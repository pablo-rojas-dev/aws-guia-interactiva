trear solicitudes distribuidas entre componentes de aplicaciones."},{"l":"D","t":"AWS Amplify + AWS X-Ray","why":"Incorrecta. NO cumple el requisito 1: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios. NO cumple el requisito 2: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0176","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un laboratorio requiere procesar conjuntos masivos mediante trabajos Spark; (2) un call center requiere producir transcripciones de grabaciones de voz. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Kinesis","why":"Incorrecta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Amazon Q","why":"Incorrecta. Amazon Q: ofrece asistentes de IA generativa para tareas empresariales y desarrollo según producto. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Amazon Transcribe","why":"Correcta. Amazon Transcribe responde a la necesidad 2: convierte audio hablado a texto mediante reconocimiento automático de voz."},{"l":"D","t":"Amazon EMR","why":"Correcta. Amazon EMR responde a la necesidad 1: ejecuta marcos de big data como Apache Spark y Hadoop administrados."},{"l":"E","t":"Amazon Translate","why":"Incorrecta. Amazon Translate traduce texto entre idiomas mediante modelos administrados. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0177","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) un responsable de administración delega creación de roles pero limita el alcance máximo de sus permisos; (2) Durante un nuevo proyecto, una instancia EC2 debe acceder a S3 sin guardar claves estáticas en disco. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Política basada en identidad IAM","why":"Incorrecta. Política basada en identidad IAM se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Política basada en recurso","why":"Incorrecta. Política basada en recurso: se adjunta al recurso compatible para expresar quién puede actuar sobre él. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"Rol IAM","why":"Correcta. Rol IAM responde a la necesidad 2: otorga credenciales temporales que pueden asumirse por principales autorizados."},{"l":"D","t":"Límite de permisos IAM","why":"Correcta. Límite de permisos IAM responde a la necesidad 1: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol."},{"l":"E","t":"Política de contraseñas IAM","why":"Incorrecta. Política de contraseñas IAM: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0178","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) Durante un nuevo proyecto, una auditoría pregunta quién protege físicamente las instalaciones y los equipos que sostienen AWS; (2) un cliente busca determinar quién debe clasificar los datos que subió a un bucket. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Seguridad física del centro de datos + Seguridad en la nube","why":"Incorrecta. NO cumple el requisito 1: AWS controla acceso físico energía y protección de instalaciones de sus regiones. cumple el requisito 2: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio."},{"l":"B","t":"Seguridad de la nube + Parches del SO invitado en EC2","why":"Incorrecta. cumple el requisito 1: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios. NO cumple el requisito 2: normalmente corresponden al cliente para sistemas operativos de instancias EC2."},{"l":"C","t":"Seguridad de la nube + Seguridad en la nube","why":"Correcta. cumple el requisito 1: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios. cumple el requisito 2: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio."},{"l":"D","t":"Seguridad física del centro de datos + Parches del SO invitado en EC2","why":"Incorrecta. NO cumple el requisito 1: AWS controla acceso físico energía y protección de instalaciones de sus regiones. NO cumple el requisito 2: normalmente corresponden al cliente para sistemas operativos de instancias EC2."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0179","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una corporación busca un marco para alinear personas procesos tecnología y resultados de migración; (2) una compañía busca ver en un lugar central el estado de sus aplicaciones en migración. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Migration Hub","why":"Correcta. AWS Migration Hub responde a la necesidad 2: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles."},{"l":"B","t":"Relocating (relocate)","why":"Incorrecta. Relocating (relocate): mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Repurchasing (repurchase)","why":"Incorrecta. Repurchasing (repurchase): reemplaza una solución existente por otro producto generalmente SaaS. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"AWS Cloud Adoption Framework","why":"Correcta. AWS Cloud Adoption Framework responde a la necesidad 1: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción."},{"l":"E","t":"Rehosting (rehost)","why":"Incorrecta. Rehosting (rehost) traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0180","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Una empresa está evaluando AWS: una aplicación web quiere reemplazar servidores sin perder sesiones almacenadas localmente en ellos. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Optimización de costos","why":"Incorrecta. Optimización de costos: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado."},{"l":"B","t":"Diseño sin estado","why":"Correcta. Diseño sin estado: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Diseño para fallos","why":"Incorrecta. Diseño para fallos: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado."},{"l":"D","t":"Automatización de infraestructura","why":"Incorrecta. Automatización de infraestructura: sustituye operaciones manuales repetitivas por procesos reproducibles. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0181","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un comité define políticas de inversión prioridades y medición de riesgos en la adopción. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Perspectiva de negocio de AWS CAF","why":"Incorrecta. Perspectiva de negocio de AWS CAF: alinea inversiones y transformación digital con resultados empresariales y valor. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orienta transformación mediante gestión de riesgos carteras y control organizacional."},{"l":"B","t":"Perspectiva de personas de AWS CAF","why":"Incorrecta. Perspectiva de personas de AWS CAF: aborda habilidades cultura organización y preparación de la fuerza laboral. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orienta transformación mediante gestión de riesgos carteras y control organizacional."},{"l":"C","t":"Perspectiva de seguridad de AWS CAF","why":"Incorrecta. Perspectiva de seguridad de AWS CAF: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orienta transformación mediante gestión de riesgos carteras y control organizacional."},{"l":"D","t":"Perspectiva de gobernanza de AWS CAF","why":"Correcta. Perspectiva de gobernanza de AWS CAF: orienta transformación mediante gestión de riesgos carteras y control organizacional. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0182","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un integrante del equipo técnico tiene Allow sobre S3 pero una política aplicable contiene Deny sobre DeleteObject; (2) una corporación busca que empleados ingresen a AWS con su proveedor corporativo de identidades. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Permisos explícitamente denegados","why":"Correcta. Permisos explícitamente denegados responde a la necesidad 1: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM."},{"l":"B","t":"Rol entre cuentas","why":"Incorrecta. Rol entre cuentas: autoriza que un principal de otra cuenta asuma una función con permisos temporales. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"Federación de identidades","why":"Correcta. Federación de identidades responde a la necesidad 2: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS."},{"l":"D","t":"Principio de privilegio mínimo","why":"Incorrecta. Principio de privilegio mínimo: concede únicamente permisos indispensables para realizar la tarea autorizada. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Límite de permisos IAM","why":"Incorrecta. Límite de permisos IAM restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0183","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una sucursal quiere enlazar su centro de datos a AWS usando IPsec por Internet. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Amazon VPC","why":"Incorrecta. Amazon VPC: proporciona una red virtual lógicamente aislada para recursos AWS. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: conecta redes locales a VPC mediante túneles cifrados sobre una red IP."},{"l":"B","t":"Internet Gateway","why":"Incorrecta. Internet Gateway: habilita comunicación entre una VPC e Internet para recursos configurados adecuadamente. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: conecta redes locales a VPC mediante túneles cifrados sobre una red IP."},{"l":"C","t":"AWS Site-to-Site VPN","why":"Correcta. AWS Site-to-Site VPN: conecta redes locales a VPC mediante túneles cifrados sobre una red IP. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon CloudFront","why":"Incorrecta. Amazon CloudFront: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: conecta redes locales a VPC mediante túneles cifrados sobre una red IP."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0184","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una plataforma con patrón estable busca descuentos por compromiso de capacidad de EC2 durante múltiples años; (2) un servicio crítico requiere asegurar disponibilidad de capacidad específica de EC2 en una AZ. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Instancias reservadas (Reserved Instances) + Dedicated Hosts","why":"Incorrecta. cumple el requisito 1: proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años. NO cumple el requisito 2: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."},{"l":"B","t":"Transferencia de datos saliente + On-Demand Capacity Reservations","why":"Incorrecta. NO cumple el requisito 1: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. cumple el requisito 2: reservan capacidad EC2 en una zona de disponibilidad sin obligar por sí mismas al descuento de plazo."},{"l":"C","t":"Instancias reservadas (Reserved Instances) + On-Demand Capacity Reservations","why":"Correcta. cumple el requisito 1: proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años. cumple el requisito 2: reservan capacidad EC2 en una zona de disponibilidad sin obligar por sí mismas al descuento de plazo."},{"l":"D","t":"Transferencia de datos saliente + Dedicated Hosts","why":"Incorrecta. NO cumple el requisito 1: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. NO cumple el requisito 2: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0185","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, dos cuentas deben compartir subredes de una VPC sin duplicarlas. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"AWS Resource Access Manager","why":"Correcta. AWS Resource Access Manager: facilita compartir recursos AWS compatibles entre cuentas de forma controlada. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: facilita compartir recursos AWS compatibles entre cuentas de forma controlada."},{"l":"C","t":"AWS Trusted Advisor","why":"Incorrecta. AWS Trusted Advisor: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: facilita compartir recursos AWS compatibles entre cuentas de forma controlada."},{"l":"D","t":"AWS Control Tower","why":"Incorrecta. AWS Control Tower: facilita configurar y gobernar un entorno de múltiples cuentas con controles. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: facilita compartir recursos AWS compatibles entre cuentas de forma controlada."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0186","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"Un cliente plantea esta situación: un equipo pregunta quién actualiza la capa de hipervisor que soporta instancias virtuales de EC2. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Seguridad de la nube","why":"Incorrecta. Seguridad de la nube: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: AWS administra la virtualización e infraestructura subyacente de EC2."},{"l":"B","t":"Control de accesos a datos en RDS","why":"Incorrecta. Control de accesos a datos en RDS: lo define el cliente mediante identidades permisos y controles de aplicación. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: AWS administra la virtualización e infraestructura subyacente de EC2."},{"l":"C","t":"Parches de infraestructura de RDS","why":"Incorrecta. Parches de infraestructura de RDS: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: AWS administra la virtualización e infraestructura subyacente de EC2."},{"l":"D","t":"Seguridad del hipervisor administrado por AWS","why":"Correcta. Seguridad del hipervisor administrado por AWS: AWS administra la virtualización e infraestructura subyacente de EC2. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0187","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Una organización compara opciones en la nube: un responsable exige una longitud mínima para todas las contraseñas de usuarios IAM. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Principio de privilegio mínimo","why":"Incorrecta. Principio de privilegio mínimo: concede únicamente permisos indispensables para realizar la tarea autorizada. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM."},{"l":"B","t":"Política de contraseñas IAM","why":"Correcta. Política de contraseñas IAM: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Política basada en identidad IAM","why":"Incorrecta. Política basada en identidad IAM: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM."},{"l":"D","t":"Límite de permisos IAM","why":"Incorrecta. Límite de permisos IAM: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0188","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: el equipo SOC necesita un panel de hallazgos procedentes de varios servicios de seguridad. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"AWS Resource Access Manager","why":"Incorrecta. AWS Resource Access Manager: facilita compartir recursos AWS compatibles entre cuentas de forma controlada. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares."},{"l":"B","t":"AWS Artifact","why":"Incorrecta. AWS Artifact: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares."},{"l":"C","t":"AWS Security Hub","why":"Correcta. AWS Security Hub: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon CloudWatch","why":"Incorrecta. Amazon CloudWatch: recopila métricas registros y alarmas para observar aplicaciones y recursos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0189","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Un cliente plantea esta situación: un equipo quiere ejecutar tareas operativas repetibles en un conjunto de instancias administradas. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"AWS Control Tower","why":"Incorrecta. AWS Control Tower: facilita configurar y gobernar un entorno de múltiples cuentas con controles. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos."},{"l":"B","t":"AWS Systems Manager","why":"Correcta. AWS Systems Manager: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos."},{"l":"D","t":"AWS Secrets Manager","why":"Incorrecta. AWS Secrets Manager: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0190","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un sitio debe seguir disponible si falla una instancia de su despliegue. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Agilidad","why":"Incorrecta. Agilidad: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos."},{"l":"B","t":"Gasto operativo variable","why":"Incorrecta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos."},{"l":"C","t":"Recuperación ante desastres","why":"Incorrecta. Recuperación ante desastres: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos."},{"l":"D","t":"Alta disponibilidad","why":"Correcta. Alta disponibilidad: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0191","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) Durante un nuevo proyecto, un analista compara tendencias de costo por servicio y cuenta durante los últimos meses; (2) Durante un nuevo proyecto, un área financiera requiere datos detallados de facturación a nivel de recursos y dimensiones compatibles. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"AWS Cost Explorer + AWS Cost and Usage Report (CUR)","why":"Correcta. cumple el requisito 1: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. cumple el requisito 2: proporciona registros detallados de uso y costos para análisis granular."},{"l":"B","t":"AWS Cost Categories + AWS Cost and Usage Report (CUR)","why":"Incorrecta. NO cumple el requisito 1: agrupa y clasifica líneas de costo usando reglas de negocio configuradas. cumple el requisito 2: proporciona registros detallados de uso y costos para análisis granular."},{"l":"C","t":"AWS Cost Categories + AWS Budgets","why":"Incorrecta. NO cumple el requisito 1: agrupa y clasifica líneas de costo usando reglas de negocio configuradas. NO cumple el requisito 2: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos."},{"l":"D","t":"AWS Cost Explorer + AWS Budgets","why":"Incorrecta. cumple el requisito 1: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. NO cumple el requisito 2: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0192","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Alta","text":"Una empresa está evaluando AWS: una empresa quiere reutilizar licencias existentes en cargas elegibles desplegadas en AWS. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Costos variables frente a fijos","why":"Incorrecta. Costos variables frente a fijos: distingue consumo flexible mensual de inversión inicial inmovilizada. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite aprovechar licencias de software propias cuando lo permiten sus términos."},{"l":"B","t":"Costos ocultos de centros de datos","why":"Incorrecta. Costos ocultos de centros de datos: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite aprovechar licencias de software propias cuando lo permiten sus términos."},{"l":"C","t":"Licencia incluida","why":"Incorrecta. Licencia incluida: incorpora el cargo de licencia aplicable en el precio del servicio. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite aprovechar licencias de software propias cuando lo permiten sus términos."},{"l":"D","t":"Bring Your Own License (BYOL)","why":"Correcta. Bring Your Own License (BYOL): permite aprovechar licencias de software propias cuando lo permiten sus términos. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0193","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un equipo detecta servidores sobredimensionados y planea ajustar su capacidad tras medir utilización. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Arquitectura basada en eventos","why":"Incorrecta. Arquitectura basada en eventos: desacopla productores y consumidores mediante eventos que disparan reacciones. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento."},{"l":"B","t":"Dimensionar según la demanda","why":"Correcta. Dimensionar según la demanda: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Sostenibilidad","why":"Incorrecta. Sostenibilidad: pilar Well-Architected que minimiza impactos ambientales del uso de recursos. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento."},{"l":"D","t":"Excelencia operativa","why":"Incorrecta. Excelencia operativa: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0194","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una plataforma quiere que una compra desencadene procesos independientes sin llamadas directas entre todos ellos. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Excelencia operativa","why":"Incorrecta. Excelencia operativa: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: desacopla productores y consumidores mediante eventos que disparan reacciones."},{"l":"B","t":"Seguridad","why":"Incorrecta. Seguridad: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: desacopla productores y consumidores mediante eventos que disparan reacciones."},{"l":"C","t":"Diseño para fallos","why":"Incorrecta. Diseño para fallos: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: desacopla productores y consumidores mediante eventos que disparan reacciones."},{"l":"D","t":"Arquitectura basada en eventos","why":"Correcta. Arquitectura basada en eventos: desacopla productores y consumidores mediante eventos que disparan reacciones. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0195","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: un corporativo quiere recibir una factura consolidada de sus diversas cuentas AWS. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"AWS Cost Explorer","why":"Incorrecta. AWS Cost Explorer: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles."},{"l":"B","t":"Etiquetas de asignación de costos","why":"Incorrecta. Etiquetas de asignación de costos: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles."},{"l":"C","t":"Facturación consolidada de AWS Organizations","why":"Correcta. Facturación consolidada de AWS Organizations: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Budgets","why":"Incorrecta. AWS Budgets: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0196","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una corporación debe replicar registros desde su base local a AWS con poca interrupción; (2) una compañía requiere un servicio relacional de AWS optimizado y compatible con PostgreSQL. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Aurora","why":"Correcta. Amazon Aurora responde a la necesidad 2: ofrece un motor relacional administrado compatible con MySQL o PostgreSQL y arquitectura de almacenamiento propia."},{"l":"B","t":"AWS DMS","why":"Correcta. AWS DMS responde a la necesidad 1: migra o replica datos de bases con cambios mínimos y admite migraciones heterogéneas."},{"l":"C","t":"Amazon DynamoDB","why":"Incorrecta. Amazon DynamoDB: proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Amazon Neptune","why":"Incorrecta. Amazon Neptune: proporciona una base de datos de grafos administrada para relaciones conectadas. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Amazon RDS","why":"Incorrecta. Amazon RDS administra bases de datos relacionales compatibles y tareas como backups y mantenimiento. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0197","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un despacho necesita extraer campos y tablas de documentos escaneados. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Amazon Rekognition","why":"Incorrecta. Amazon Rekognition: analiza imágenes y video para detectar objetos textos y características visuales. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: extrae texto y estructura de documentos como tablas y formularios."},{"l":"B","t":"AWS Glue","why":"Incorrecta. AWS Glue: integra datos mediante procesos ETL y catálogo de metadatos administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: extrae texto y estructura de documentos como tablas y formularios."},{"l":"C","t":"Amazon EMR","why":"Incorrecta. Amazon EMR: ejecuta marcos de big data como Apache Spark y Hadoop administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: extrae texto y estructura de documentos como tablas y formularios."},{"l":"D","t":"Amazon Textract","why":"Correcta. Amazon Textract: extrae texto y estructura de documentos como tablas y formularios. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0198","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Una empresa está evaluando AWS: una empresa debe localizar números de identificación personal almacenados por error en buckets S3. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Amazon Detective","why":"Incorrecta. Amazon Detective: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: detecta y ayuda a clasificar datos confidenciales en Amazon S3."},{"l":"B","t":"Cifrado en tránsito","why":"Incorrecta. Cifrado en tránsito: protege datos mientras viajan por conexiones como TLS o VPN. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: detecta y ayuda a clasificar datos confidenciales en Amazon S3."},{"l":"C","t":"Cifrado en reposo","why":"Incorrecta. Cifrado en reposo: protege datos almacenados en discos objetos o bases de datos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: detecta y ayuda a clasificar datos confidenciales en Amazon S3."},{"l":"D","t":"Amazon Macie","why":"Correcta. Amazon Macie: detecta y ayuda a clasificar datos confidenciales en Amazon S3. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0199","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, una fábrica debe recibir telemetría de miles de sensores conectados. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"AWS IoT Core","why":"Correcta. AWS IoT Core: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS CodePipeline","why":"Incorrecta. AWS CodePipeline: coordina fases automatizadas de entrega continua desde origen hasta despliegue. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube."},{"l":"C","t":"Amazon WorkSpaces","why":"Incorrecta. Amazon WorkSpaces: proporciona escritorios virtuales persistentes administrados para usuarios. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube."},{"l":"D","t":"Amazon EventBridge","why":"Incorrecta. Amazon EventBridge: enruta eventos desde distintas fuentes a destinos mediante reglas. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0200","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, usuarios Windows necesitan recursos SMB administrados compatibles con un sistema de archivos empresarial. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"S3 Standard-IA","why":"Incorrecta. S3 Standard-IA: almacena objetos poco consultados con recuperación rápida y resiliencia multizona. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece sistemas de archivos administrados especializados como Windows File Server y Lustre."},{"l":"B","t":"Amazon FSx","why":"Correcta. Amazon FSx: ofrece sistemas de archivos administrados especializados como Windows File Server y Lustre. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"S3 Glacier Deep Archive","why":"Incorrecta. S3 Glacier Deep Archive: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece sistemas de archivos administrados especializados como Windows File Server y Lustre."},{"l":"D","t":"S3 Glacier Flexible Retrieval","why":"Incorrecta. S3 Glacier Flexible Retrieval: archiva datos rara vez consultados con recuperaciones en minutos u horas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece sistemas de archivos administrados especializados como Windows File Server y Lustre."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0201","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"Una empresa está evaluando AWS: un equipo necesita transformar procedimientos y esquemas Oracle para un destino PostgreSQL. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Amazon Redshift","why":"Incorrecta. Amazon Redshift: ejecuta analítica SQL de almacén de datos para grandes volúmenes. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a convertir esquemas y objetos de bases de datos entre motores diferentes."},{"l":"B","t":"Amazon ElastiCache","why":"Incorrecta. Amazon ElastiCache: ofrece almacenes de caché en memoria administrados para disminuir latencia. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a convertir esquemas y objetos de bases de datos entre motores diferentes."},{"l":"C","t":"AWS SCT","why":"Correcta. AWS SCT: ayuda a convertir esquemas y objetos de bases de datos entre motores diferentes. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon RDS","why":"Incorrecta. Amazon RDS: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a convertir esquemas y objetos de bases de datos entre motores diferentes."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0202","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un desarrollador Java necesita integrar operaciones de S3 directamente en su aplicación. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"AWS SDK","why":"Correcta. AWS SDK: bibliotecas para que aplicaciones invoquen APIs de AWS desde un lenguaje de programación. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS CLI","why":"Incorrecta. AWS CLI: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: bibliotecas para que aplicaciones invoquen APIs de AWS desde un lenguaje de programación."},{"l":"C","t":"Zona de disponibilidad (AZ)","why":"Incorrecta. Zona de disponibilidad (AZ): ubicación físicamente independiente dentro de una región con infraestructura redundante. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: bibliotecas para que aplicaciones invoquen APIs de AWS desde un lenguaje de programación."},{"l":"D","t":"AWS Management Console","why":"Incorrecta. AWS Management Console: interfaz web gráfica para administrar servicios y recursos de AWS. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: bibliotecas para que aplicaciones invoquen APIs de AWS desde un lenguaje de programación."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0203","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un portal web requiere dirigir su dominio hacia diferentes endpoints mediante resolución DNS; (2) una corporación requiere conectar decenas de VPC evitando enlaces punto a punto entre todas ellas. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Subred pública + Amazon VPC","why":"Incorrecta. NO cumple el requisito 1: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. NO cumple el requisito 2: proporciona una red virtual lógicamente aislada para recursos AWS."},{"l":"B","t":"Subred pública + AWS Transit Gateway","why":"Incorrecta. NO cumple el requisito 1: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. cumple el requisito 2: actúa como concentrador para conectar múltiples VPC y redes locales."},{"l":"C","t":"Amazon Route 53 + AWS Transit Gateway","why":"Correcta. cumple el requisito 1: presta servicios DNS y políticas de enrutamiento de consultas por nombre. cumple el requisito 2: actúa como concentrador para conectar múltiples VPC y redes locales."},{"l":"D","t":"Amazon Route 53 + Amazon VPC","why":"Incorrecta. cumple el requisito 1: presta servicios DNS y políticas de enrutamiento de consultas por nombre. NO cumple el requisito 2: proporciona una red virtual lógicamente aislada para recursos AWS."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0204","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un analista compara tendencias de costo por servicio y cuenta durante los últimos meses. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"AWS Budgets","why":"Incorrecta. AWS Budgets: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: visualiza y analiza costos y tendencias históricas y previstas mediante filtros."},{"l":"B","t":"AWS Cost Explorer","why":"Correcta. AWS Cost Explorer: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Etiquetas de asignación de costos","why":"Incorrecta. Etiquetas de asignación de costos: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: visualiza y analiza costos y tendencias históricas y previstas mediante filtros."},{"l":"D","t":"Facturación consolidada de AWS Organizations","why":"Incorrecta. Facturación consolidada de AWS Organizations: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: visualiza y analiza costos y tendencias históricas y previstas mediante filtros."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0205","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) un servicio crítico requiere asegurar disponibilidad de capacidad específica de EC2 en una AZ; (2) una empresa emergente requiere servidores durante pocos días con uso incierto y no busca compromisos de uno o tres años. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Instancias bajo demanda (On-Demand)","why":"Correcta. Instancias bajo demanda (On-Demand) responde a la necesidad 2: paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable."},{"l":"B","t":"Dedicated Instances","why":"Incorrecta. Dedicated Instances: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"Savings Plans","why":"Incorrecta. Savings Plans ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"On-Demand Capacity Reservations","why":"Correcta. On-Demand Capacity Reservations responde a la necesidad 1: reservan capacidad EC2 en una zona de disponibilidad sin obligar por sí mismas al descuento de plazo."},{"l":"E","t":"Transferencia de datos saliente","why":"Incorrecta. Transferencia de datos saliente: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0206","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una entidad prepara su enfoque de protección riesgos y controles de seguridad de la migración. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Perspectiva de plataforma de AWS CAF","why":"Incorrecta. Perspectiva de plataforma de AWS CAF: se centra en construir y modernizar la plataforma tecnológica en la nube. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación."},{"l":"B","t":"Perspectiva de negocio de AWS CAF","why":"Incorrecta. Perspectiva de negocio de AWS CAF: alinea inversiones y transformación digital con resultados empresariales y valor. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación."},{"l":"C","t":"Perspectiva de operaciones de AWS CAF","why":"Incorrecta. Perspectiva de operaciones de AWS CAF: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación."},{"l":"D","t":"Perspectiva de seguridad de AWS CAF","why":"Correcta. Perspectiva de seguridad de AWS CAF: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0207","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) una compañía busca comprometer gasto horario estable y mantener flexibilidad de tipos de cómputo elegibles; (2) Durante un nuevo proyecto, un procesamiento por lotes tolerante a interrupciones busca el menor costo posible de cómputo. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Savings Plans + Instancias Spot","why":"Correcta. cumple el requisito 1: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. cumple el requisito 2: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla."},{"l":"B","t":"Dedicated Instances + Instancias Spot","why":"Incorrecta. NO cumple el requisito 1: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts. cumple el requisito 2: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla."},{"l":"C","t":"Savings Plans + Dedicated Hosts","why":"Incorrecta. cumple el requisito 1: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. NO cumple el requisito 2: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."},{"l":"D","t":"Dedicated Instances + Dedicated Hosts","why":"Incorrecta. NO cumple el requisito 1: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts. NO cumple el requisito 2: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0208","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una plataforma exige personalización del motor que no admite un servicio relacional administrado; (2) un sistema informático antifraude analiza vínculos entre cuentas personas y transacciones como un grafo. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon DynamoDB","why":"Incorrecta. Amazon DynamoDB proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Amazon ElastiCache","why":"Incorrecta. Amazon ElastiCache: ofrece almacenes de caché en memoria administrados para disminuir latencia. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Amazon RDS","why":"Incorrecta. Amazon RDS: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Amazon Neptune","why":"Correcta. Amazon Neptune responde a la necesidad 2: proporciona una base de datos de grafos administrada para relaciones conectadas."},{"l":"E","t":"Base de datos autoadministrada en EC2","why":"Correcta. Base de datos autoadministrada en EC2 responde a la necesidad 1: permite al cliente instalar y controlar motor parches y configuración en una instancia."}],"key":["D","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0209","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) Durante un nuevo proyecto, un servidor quedó accesible por SSH desde toda Internet debido a una regla permisiva; (2) Durante un nuevo proyecto, un auditor revisa qué actor realiza vigilancia y protección de edificios de AWS. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Seguridad en la nube","why":"Incorrecta. Seguridad en la nube es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Parches de infraestructura de RDS","why":"Incorrecta. Parches de infraestructura de RDS: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Configuración de grupos de seguridad","why":"Correcta. Configuración de grupos de seguridad responde a la necesidad 1: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2."},{"l":"D","t":"Seguridad física del centro de datos","why":"Correcta. Seguridad física del centro de datos responde a la necesidad 2: AWS controla acceso físico energía y protección de instalaciones de sus regiones."},{"l":"E","t":"Seguridad de la nube","why":"Incorrecta. Seguridad de la nube: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0210","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) un portal web busca bloquear solicitudes HTTP maliciosas dirigidas a una plataforma pública; (2) Durante un nuevo proyecto, un analista investiga relaciones entre identidades IP y actividades tras recibir una alerta. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"AWS WAF + Amazon Detective","why":"Correcta. cumple el requisito 1: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. cumple el requisito 2: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados."},{"l":"B","t":"AWS Marketplace de seguridad + Cifrado en reposo","why":"Incorrecta. NO cumple el requisito 1: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. NO cumple el requisito 2: protege datos almacenados en discos objetos o bases de datos."},{"l":"C","t":"AWS WAF + Cifrado en reposo","why":"Incorrecta. cumple el requisito 1: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. NO cumple el requisito 2: protege datos almacenados en discos objetos o bases de datos."},{"l":"D","t":"AWS Marketplace de seguridad + Amazon Detective","why":"Incorrecta. NO cumple el requisito 1: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. cumple el requisito 2: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0211","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un operador quiere una alarma cuando la CPU de una instancia supera un umbral. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Amazon CloudWatch","why":"Correcta. Amazon CloudWatch: recopila métricas registros y alarmas para observar aplicaciones y recursos. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS CloudTrail","why":"Incorrecta. AWS CloudTrail: registra acciones de API y actividad de cuenta para auditoría de quién hizo qué y cuándo. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: recopila métricas registros y alarmas para observar aplicaciones y recursos."},{"l":"C","t":"AWS Trusted Advisor","why":"Incorrecta. AWS Trusted Advisor: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: recopila métricas registros y alarmas para observar aplicaciones y recursos."},{"l":"D","t":"AWS Well-Architected Tool","why":"Incorrecta. AWS Well-Architected Tool: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: recopila métricas registros y alarmas para observar aplicaciones y recursos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0212","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una app educativa debe narrar un texto mediante voz generada. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Amazon OpenSearch Service","why":"Incorrecta. Amazon OpenSearch Service: facilita búsqueda y analítica sobre índices de texto y registros. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: convierte texto en voz sintetizada para aplicaciones."},{"l":"B","t":"Amazon Polly","why":"Correcta. Amazon Polly: convierte texto en voz sintetizada para aplicaciones. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon Comprehend","why":"Incorrecta. Amazon Comprehend: extrae información del lenguaje natural como entidades y sentimientos de texto. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: convierte texto en voz sintetizada para aplicaciones."},{"l":"D","t":"Amazon Quick","why":"Incorrecta. Amazon Quick: ofrece capacidades de inteligencia de negocios y visualización de datos administradas. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: convierte texto en voz sintetizada para aplicaciones."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0213","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Alta","text":"Una empresa está evaluando AWS: una aplicación con patrón estable quiere descuentos por compromiso de capacidad de EC2 durante varios años. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Dedicated Hosts","why":"Incorrecta. Dedicated Hosts: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años."},{"l":"B","t":"Instancias Spot","why":"Incorrecta. Instancias Spot: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años."},{"l":"C","t":"Savings Plans","why":"Incorrecta. Savings Plans: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años."},{"l":"D","t":"Instancias reservadas (Reserved Instances)","why":"Correcta. Instancias reservadas (Reserved Instances): proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0214","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una compañía compara qué proveedor mantiene la infraestructura subyacente de una base RDS; (2) un cliente busca determinar quién debe clasificar los datos que subió a un bucket. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Política de bucket S3","why":"Incorrecta. Política de bucket S3 el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Seguridad en la nube","why":"Correcta. Seguridad en la nube responde a la necesidad 2: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio."},{"l":"C","t":"Parches del SO invitado en EC2","why":"Incorrecta. Parches del SO invitado en EC2: normalmente corresponden al cliente para sistemas operativos de instancias EC2. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Parches de infraestructura de RDS","why":"Correcta. Parches de infraestructura de RDS responde a la necesidad 1: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS."},{"l":"E","t":"Seguridad física del centro de datos","why":"Incorrecta. Seguridad física del centro de datos: AWS controla acceso físico energía y protección de instalaciones de sus regiones. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["B","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0215","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) Durante un nuevo proyecto, un responsable exige una longitud mínima para todas las contraseñas de usuarios IAM; (2) un responsable de administración busca aplicar iguales permisos a veinte usuarios sin editar cada uno por separado. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Política de contraseñas IAM","why":"Correcta. Política de contraseñas IAM responde a la necesidad 1: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM."},{"l":"B","t":"Usuario raíz (root)","why":"Incorrecta. Usuario raíz (root): es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"Principio de privilegio mínimo","why":"Incorrecta. Principio de privilegio mínimo concede únicamente permisos indispensables para realizar la tarea autorizada. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Grupo IAM","why":"Correcta. Grupo IAM responde a la necesidad 2: permite asignar permisos comunes a un conjunto de usuarios IAM."},{"l":"E","t":"AWS STS","why":"Incorrecta. AWS STS: emite credenciales de seguridad temporales para sesiones y roles. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0216","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una plataforma requiere administrar credenciales de base de datos con rotación automática; (2) una corporación construye una landing zone gobernada para sus nuevas cuentas AWS. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Control Tower","why":"Correcta. AWS Control Tower responde a la necesidad 2: facilita configurar y gobernar un entorno de múltiples cuentas con controles."},{"l":"B","t":"AWS Secrets Manager","why":"Correcta. AWS Secrets Manager responde a la necesidad 1: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos."},{"l":"C","t":"AWS Resource Access Manager","why":"Incorrecta. AWS Resource Access Manager facilita compartir recursos AWS compatibles entre cuentas de forma controlada. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"AWS Security Hub","why":"Incorrecta. AWS Security Hub: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0217","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un portal de videos quiere reducir latencia de contenido estático global mediante caché perimetral. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Amazon CloudFront","why":"Correcta. Amazon CloudFront: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Site-to-Site VPN","why":"Incorrecta. AWS Site-to-Site VPN: conecta redes locales a VPC mediante túneles cifrados sobre una red IP. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN."},{"l":"C","t":"Amazon API Gateway","why":"Incorrecta. Amazon API Gateway: crea publica administra y protege APIs para clientes que acceden a backends. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN."},{"l":"D","t":"Internet Gateway","why":"Incorrecta. Internet Gateway: habilita comunicación entre una VPC e Internet para recursos configurados adecuadamente. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0218","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Un cliente plantea esta situación: un proceso CLI heredado debe autenticarse para invocar APIs AWS y gestionar sus credenciales. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Grupo IAM","why":"Incorrecta. Grupo IAM: permite asignar permisos comunes a un conjunto de usuarios IAM. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias."},{"l":"B","t":"Permisos explícitamente denegados","why":"Incorrecta. Permisos explícitamente denegados: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias."},{"l":"C","t":"Usuario raíz (root)","why":"Incorrecta. Usuario raíz (root): es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias."},{"l":"D","t":"Credenciales de acceso programático","why":"Correcta. Credenciales de acceso programático: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias. El requisito específico del escenario coincide con esta función."}],"key":["D"],"so

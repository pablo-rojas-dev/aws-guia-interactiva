 IP hacia y desde interfaces de red en VPC. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Bloqueo de acceso público de S3","why":"Incorrecta. Bloqueo de acceso público de S3: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: capturan metadatos sobre tráfico IP hacia y desde interfaces de red en VPC."},{"l":"C","t":"AWS Marketplace de seguridad","why":"Incorrecta. AWS Marketplace de seguridad: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: capturan metadatos sobre tráfico IP hacia y desde interfaces de red en VPC."},{"l":"D","t":"Amazon Inspector","why":"Incorrecta. Amazon Inspector: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: capturan metadatos sobre tráfico IP hacia y desde interfaces de red en VPC."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0045","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) una plataforma busca que una compra desencadene procesos independientes sin llamadas directas entre todos ellos; (2) una empresa comercial busca que el módulo de cobros pueda evolucionar sin obligar a desplegar el de catálogo. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Arquitectura basada en eventos + Sostenibilidad","why":"Incorrecta. cumple el requisito 1: desacopla productores y consumidores mediante eventos que disparan reacciones. NO cumple el requisito 2: pilar Well-Architected que minimiza impactos ambientales del uso de recursos."},{"l":"B","t":"Optimización de costos + Acoplamiento débil","why":"Incorrecta. NO cumple el requisito 1: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo. cumple el requisito 2: diseña componentes para depender poco unos de otros y limitar fallas en cascada."},{"l":"C","t":"Arquitectura basada en eventos + Acoplamiento débil","why":"Correcta. cumple el requisito 1: desacopla productores y consumidores mediante eventos que disparan reacciones. cumple el requisito 2: diseña componentes para depender poco unos de otros y limitar fallas en cascada."},{"l":"D","t":"Optimización de costos + Sostenibilidad","why":"Incorrecta. NO cumple el requisito 1: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo. NO cumple el requisito 2: pilar Well-Architected que minimiza impactos ambientales del uso de recursos."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0046","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un grupo de trabajo busca probar una idea y descartarla con rapidez sin adquirir servidores; (2) una compañía busca el ahorro que AWS logra al comprar infraestructura a gran escala. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Servicios administrados","why":"Incorrecta. Servicios administrados: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Pago por uso","why":"Incorrecta. Pago por uso cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"Agilidad","why":"Correcta. Agilidad responde a la necesidad 1: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas."},{"l":"D","t":"Economías de escala","why":"Correcta. Economías de escala responde a la necesidad 2: reducen costos unitarios gracias al volumen agregado de demanda del proveedor."},{"l":"E","t":"Recuperación ante desastres","why":"Incorrecta. Recuperación ante desastres: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0047","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un proceso de aprobación debe coordinar varias funciones y decisiones encadenadas. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Amazon SNS","why":"Incorrecta. Amazon SNS: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orquesta flujos de trabajo por estados con pasos y manejo de errores."},{"l":"B","t":"AWS CodePipeline","why":"Incorrecta. AWS CodePipeline: coordina fases automatizadas de entrega continua desde origen hasta despliegue. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orquesta flujos de trabajo por estados con pasos y manejo de errores."},{"l":"C","t":"Amazon WorkSpaces","why":"Incorrecta. Amazon WorkSpaces: proporciona escritorios virtuales persistentes administrados para usuarios. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orquesta flujos de trabajo por estados con pasos y manejo de errores."},{"l":"D","t":"AWS Step Functions","why":"Correcta. AWS Step Functions: orquesta flujos de trabajo por estados con pasos y manejo de errores. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0048","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) los objetos tienen frecuencias de consulta impredecibles y se busca optimizar almacenamiento de forma automática; (2) usuarios Windows necesitan recursos SMB administrados compatibles con un sistema informático de archivos empresarial. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"S3 One Zone-IA + Amazon FSx","why":"Incorrecta. NO cumple el requisito 1: almacena datos recreables poco consultados en una sola AZ para reducir costo. cumple el requisito 2: ofrece sistemas de archivos administrados especializados como Windows File Server y Lustre."},{"l":"B","t":"S3 Intelligent-Tiering + Amazon FSx","why":"Correcta. cumple el requisito 1: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización. cumple el requisito 2: ofrece sistemas de archivos administrados especializados como Windows File Server y Lustre."},{"l":"C","t":"S3 One Zone-IA + S3 Glacier Flexible Retrieval","why":"Incorrecta. NO cumple el requisito 1: almacena datos recreables poco consultados en una sola AZ para reducir costo. NO cumple el requisito 2: archiva datos rara vez consultados con recuperaciones en minutos u horas."},{"l":"D","t":"S3 Intelligent-Tiering + S3 Glacier Flexible Retrieval","why":"Incorrecta. cumple el requisito 1: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización. NO cumple el requisito 2: archiva datos rara vez consultados con recuperaciones en minutos u horas."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0049","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, una empresa requiere impedir publicaciones públicas accidentales de datos en Amazon S3. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Bloqueo de acceso público de S3","why":"Correcta. Bloqueo de acceso público de S3: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Cifrado en tránsito","why":"Incorrecta. Cifrado en tránsito: protege datos mientras viajan por conexiones como TLS o VPN. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos."},{"l":"C","t":"Amazon GuardDuty","why":"Incorrecta. Amazon GuardDuty: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos."},{"l":"D","t":"Cifrado en reposo","why":"Incorrecta. Cifrado en reposo: protege datos almacenados en discos objetos o bases de datos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0050","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) Durante un nuevo proyecto, una función solo debe leer dos prefijos de S3 y ningún otro dato; (2) un servicio requiere credenciales temporales al asumir un rol en otra cuenta. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Principio de privilegio mínimo + AWS STS","why":"Correcta. cumple el requisito 1: concede únicamente permisos indispensables para realizar la tarea autorizada. cumple el requisito 2: emite credenciales de seguridad temporales para sesiones y roles."},{"l":"B","t":"Política basada en recurso + AWS IAM Identity Center","why":"Incorrecta. NO cumple el requisito 1: se adjunta al recurso compatible para expresar quién puede actuar sobre él. NO cumple el requisito 2: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO."},{"l":"C","t":"Política basada en recurso + AWS STS","why":"Incorrecta. NO cumple el requisito 1: se adjunta al recurso compatible para expresar quién puede actuar sobre él. cumple el requisito 2: emite credenciales de seguridad temporales para sesiones y roles."},{"l":"D","t":"Principio de privilegio mínimo + AWS IAM Identity Center","why":"Incorrecta. cumple el requisito 1: concede únicamente permisos indispensables para realizar la tarea autorizada. NO cumple el requisito 2: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0051","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Alta","text":"Un cliente plantea esta situación: una empresa elige un modelo donde el gasto siga el volumen de clientes y no una compra inicial fija. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Rightsizing","why":"Incorrecta. Rightsizing: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distingue consumo flexible mensual de inversión inicial inmovilizada."},{"l":"B","t":"Bring Your Own License (BYOL)","why":"Incorrecta. Bring Your Own License (BYOL): permite aprovechar licencias de software propias cuando lo permiten sus términos. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distingue consumo flexible mensual de inversión inicial inmovilizada."},{"l":"C","t":"Costos ocultos de centros de datos","why":"Incorrecta. Costos ocultos de centros de datos: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distingue consumo flexible mensual de inversión inicial inmovilizada."},{"l":"D","t":"Costos variables frente a fijos","why":"Correcta. Costos variables frente a fijos: distingue consumo flexible mensual de inversión inicial inmovilizada. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0052","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un grupo de trabajo de ciencia de datos debe entrenar y desplegar modelos predictivos personalizados; (2) una aplicación educativa debe narrar un texto mediante voz generada. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Rekognition","why":"Incorrecta. Amazon Rekognition: analiza imágenes y video para detectar objetos textos y características visuales. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"Amazon SageMaker AI","why":"Correcta. Amazon SageMaker AI responde a la necesidad 1: proporciona capacidades para construir entrenar y desplegar modelos de machine learning."},{"l":"C","t":"Amazon Transcribe","why":"Incorrecta. Amazon Transcribe convierte audio hablado a texto mediante reconocimiento automático de voz. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Amazon Polly","why":"Correcta. Amazon Polly responde a la necesidad 2: convierte texto en voz sintetizada para aplicaciones."},{"l":"E","t":"Amazon Kinesis","why":"Incorrecta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["B","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0053","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una pequeña organización requiere un portal web sencillo con administración y precios simplificados; (2) un laboratorio requiere ejecutar miles de trabajos de procesamiento no interactivos en lotes. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Lightsail","why":"Correcta. Amazon Lightsail responde a la necesidad 1: ofrece servidores virtuales y recursos simplificados con paquetes predecibles."},{"l":"B","t":"AWS Batch","why":"Correcta. AWS Batch responde a la necesidad 2: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados."},{"l":"C","t":"Amazon EC2 Auto Scaling","why":"Incorrecta. Amazon EC2 Auto Scaling: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Instancias EC2 optimizadas para memoria","why":"Incorrecta. Instancias EC2 optimizadas para memoria: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Amazon EC2","why":"Incorrecta. Amazon EC2 ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0054","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una entidad requiere un HSM dedicado para operaciones criptográficas y administración propia de claves; (2) un responsable de operaciones requiere saber si un incidente de AWS está afectando específicamente sus recursos. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Health Dashboard","why":"Correcta. AWS Health Dashboard responde a la necesidad 2: muestra eventos de salud de servicios y eventos que pueden afectar recursos de la cuenta."},{"l":"B","t":"AWS Organizations","why":"Incorrecta. AWS Organizations: agrupa cuentas para aplicar gobierno y facturación centralizada. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"AWS Secrets Manager","why":"Incorrecta. AWS Secrets Manager: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"AWS CloudHSM","why":"Correcta. AWS CloudHSM responde a la necesidad 1: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente."},{"l":"E","t":"AWS KMS","why":"Incorrecta. AWS KMS crea y controla claves criptográficas utilizadas por servicios integrados para cifrado. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0055","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un grupo de trabajo pequeño busca reducir el trabajo de mantenimiento rutinario de la infraestructura subyacente; (2) una empresa emergente busca pagar por los recursos que efectivamente consume en cada mes. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Recuperación ante desastres + Pago por uso","why":"Incorrecta. NO cumple el requisito 1: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación. cumple el requisito 2: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente."},{"l":"B","t":"Recuperación ante desastres + Alcance global","why":"Incorrecta. NO cumple el requisito 1: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación. NO cumple el requisito 2: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas."},{"l":"C","t":"Servicios administrados + Pago por uso","why":"Correcta. cumple el requisito 1: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente. cumple el requisito 2: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente."},{"l":"D","t":"Servicios administrados + Alcance global","why":"Incorrecta. cumple el requisito 1: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente. NO cumple el requisito 2: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0056","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un sistema antifraude analiza vínculos entre cuentas personas y transacciones como un grafo. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Amazon Neptune","why":"Correcta. Amazon Neptune: proporciona una base de datos de grafos administrada para relaciones conectadas. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon Redshift","why":"Incorrecta. Amazon Redshift: ejecuta analítica SQL de almacén de datos para grandes volúmenes. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una base de datos de grafos administrada para relaciones conectadas."},{"l":"C","t":"Amazon Aurora","why":"Incorrecta. Amazon Aurora: ofrece un motor relacional administrado compatible con MySQL o PostgreSQL y arquitectura de almacenamiento propia. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una base de datos de grafos administrada para relaciones conectadas."},{"l":"D","t":"Amazon DocumentDB","why":"Incorrecta. Amazon DocumentDB: proporciona una base de documentos administrada compatible con APIs de MongoDB. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una base de datos de grafos administrada para relaciones conectadas."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0057","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"Un cliente plantea esta situación: un sistema regulado permanece local hasta renegociar sus contratos y requisitos legales. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Retiring (retire)","why":"Incorrecta. Retiring (retire): elimina aplicaciones que ya no generan valor o no son necesarias. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: conserva temporalmente una carga de trabajo en el entorno actual."},{"l":"B","t":"Repurchasing (repurchase)","why":"Incorrecta. Repurchasing (repurchase): reemplaza una solución existente por otro producto generalmente SaaS. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: conserva temporalmente una carga de trabajo en el entorno actual."},{"l":"C","t":"Retaining (retain)","why":"Correcta. Retaining (retain): conserva temporalmente una carga de trabajo en el entorno actual. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Relocating (relocate)","why":"Incorrecta. Relocating (relocate): mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: conserva temporalmente una carga de trabajo en el entorno actual."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0058","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una plataforma ejecutada en AWS debe evitar secretos de larga duración para acceso a servicios; (2) Durante un nuevo proyecto, una instancia EC2 debe acceder a S3 sin guardar claves estáticas en disco. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Acceso mediante credenciales temporales + Rol IAM","why":"Correcta. cumple el requisito 1: reduce exposición al expirar automáticamente las credenciales de sesión. cumple el requisito 2: otorga credenciales temporales que pueden asumirse por principales autorizados."},{"l":"B","t":"Permisos explícitamente denegados + Principio de privilegio mínimo","why":"Incorrecta. NO cumple el requisito 1: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. NO cumple el requisito 2: concede únicamente permisos indispensables para realizar la tarea autorizada."},{"l":"C","t":"Permisos explícitamente denegados + Rol IAM","why":"Incorrecta. NO cumple el requisito 1: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. cumple el requisito 2: otorga credenciales temporales que pueden asumirse por principales autorizados."},{"l":"D","t":"Acceso mediante credenciales temporales + Principio de privilegio mínimo","why":"Incorrecta. cumple el requisito 1: reduce exposición al expirar automáticamente las credenciales de sesión. NO cumple el requisito 2: concede únicamente permisos indispensables para realizar la tarea autorizada."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0059","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) Durante un nuevo proyecto, un servidor quedó accesible por SSH desde toda Internet debido a una regla permisiva; (2) una corporación debe decidir quién autoriza las cuentas que consultan información empresarial alojada en RDS. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Configuración de grupos de seguridad + Seguridad de la nube","why":"Incorrecta. cumple el requisito 1: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2. NO cumple el requisito 2: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios."},{"l":"B","t":"Seguridad del hipervisor administrado por AWS + Control de accesos a datos en RDS","why":"Incorrecta. NO cumple el requisito 1: AWS administra la virtualización e infraestructura subyacente de EC2. cumple el requisito 2: lo define el cliente mediante identidades permisos y controles de aplicación."},{"l":"C","t":"Seguridad del hipervisor administrado por AWS + Seguridad de la nube","why":"Incorrecta. NO cumple el requisito 1: AWS administra la virtualización e infraestructura subyacente de EC2. NO cumple el requisito 2: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios."},{"l":"D","t":"Configuración de grupos de seguridad + Control de accesos a datos en RDS","why":"Correcta. cumple el requisito 1: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2. cumple el requisito 2: lo define el cliente mediante identidades permisos y controles de aplicación."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0060","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) Durante un nuevo proyecto, un analista debe identificar gastos locales que no aparecen en el costo de compra de servidores; (2) una compañía busca reutilizar licencias existentes en cargas elegibles desplegadas en AWS. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Costos ocultos de centros de datos + Costo total de propiedad (TCO)","why":"Incorrecta. cumple el requisito 1: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos. NO cumple el requisito 2: considera costos directos e indirectos de operar una solución durante su vida útil."},{"l":"B","t":"Rightsizing + Costo total de propiedad (TCO)","why":"Incorrecta. NO cumple el requisito 1: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva. NO cumple el requisito 2: considera costos directos e indirectos de operar una solución durante su vida útil."},{"l":"C","t":"Rightsizing + Bring Your Own License (BYOL)","why":"Incorrecta. NO cumple el requisito 1: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva. cumple el requisito 2: permite aprovechar licencias de software propias cuando lo permiten sus términos."},{"l":"D","t":"Costos ocultos de centros de datos + Bring Your Own License (BYOL)","why":"Correcta. cumple el requisito 1: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos. cumple el requisito 2: permite aprovechar licencias de software propias cuando lo permiten sus términos."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0061","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) Durante un nuevo proyecto, la dirección evalúa beneficios comerciales indicadores y resultados financieros de adoptar AWS; (2) Durante un nuevo proyecto, un área de TI reorganiza observabilidad operación e incidentes para los servicios en AWS. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Perspectiva de plataforma de AWS CAF","why":"Incorrecta. Perspectiva de plataforma de AWS CAF se centra en construir y modernizar la plataforma tecnológica en la nube. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Perspectiva de personas de AWS CAF","why":"Incorrecta. Perspectiva de personas de AWS CAF: aborda habilidades cultura organización y preparación de la fuerza laboral. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Perspectiva de gobernanza de AWS CAF","why":"Incorrecta. Perspectiva de gobernanza de AWS CAF: orienta transformación mediante gestión de riesgos carteras y control organizacional. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Perspectiva de negocio de AWS CAF","why":"Correcta. Perspectiva de negocio de AWS CAF responde a la necesidad 1: alinea inversiones y transformación digital con resultados empresariales y valor."},{"l":"E","t":"Perspectiva de operaciones de AWS CAF","why":"Correcta. Perspectiva de operaciones de AWS CAF responde a la necesidad 2: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube."}],"key":["D","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0062","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un sitio quiere bloquear solicitudes HTTP maliciosas dirigidas a una aplicación pública. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon GuardDuty","why":"Incorrecta. Amazon GuardDuty: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web."},{"l":"B","t":"Cifrado en tránsito","why":"Incorrecta. Cifrado en tránsito: protege datos mientras viajan por conexiones como TLS o VPN. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web."},{"l":"C","t":"AWS WAF","why":"Correcta. AWS WAF: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon Inspector","why":"Incorrecta. Amazon Inspector: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0063","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) un gerente requiere una alerta cuando el gasto mensual proyectado supera el objetivo aprobado; (2) una empresa emergente prepara una cotización mensual hipotética de EC2 RDS y transferencia antes de crearlos. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"AWS Budgets + Facturación consolidada de AWS Organizations","why":"Incorrecta. cumple el requisito 1: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos. NO cumple el requisito 2: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles."},{"l":"B","t":"Etiquetas de asignación de costos + AWS Pricing Calculator","why":"Incorrecta. NO cumple el requisito 1: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación. cumple el requisito 2: estima costos futuros de arquitecturas y servicios antes de desplegarlos."},{"l":"C","t":"Etiquetas de asignación de costos + Facturación consolidada de AWS Organizations","why":"Incorrecta. NO cumple el requisito 1: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación. NO cumple el requisito 2: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles."},{"l":"D","t":"AWS Budgets + AWS Pricing Calculator","why":"Correcta. cumple el requisito 1: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos. cumple el requisito 2: estima costos futuros de arquitecturas y servicios antes de desplegarlos."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0064","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un equipo quiere reducir horas dedicadas a aprovisionar manualmente decenas de entornos. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Licencia incluida","why":"Incorrecta. Licencia incluida: incorpora el cargo de licencia aplicable en el precio del servicio. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reduce trabajo manual y errores operativos por procesos repetibles."},{"l":"B","t":"Automatización como ahorro","why":"Correcta. Automatización como ahorro: reduce trabajo manual y errores operativos por procesos repetibles. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Costos ocultos de centros de datos","why":"Incorrecta. Costos ocultos de centros de datos: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reduce trabajo manual y errores operativos por procesos repetibles."},{"l":"D","t":"Costos variables frente a fijos","why":"Incorrecta. Costos variables frente a fijos: distingue consumo flexible mensual de inversión inicial inmovilizada. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reduce trabajo manual y errores operativos por procesos repetibles."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0065","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un desarrollador tiene Allow sobre S3 pero una política aplicable contiene Deny sobre DeleteObject. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Permisos explícitamente denegados","why":"Correcta. Permisos explícitamente denegados: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Política de contraseñas IAM","why":"Incorrecta. Política de contraseñas IAM: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM."},{"l":"C","t":"Gestión de permisos con políticas administradas","why":"Incorrecta. Gestión de permisos con políticas administradas: reutiliza políticas IAM que pueden vincularse a varias identidades. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM."},{"l":"D","t":"Rol entre cuentas","why":"Incorrecta. Rol entre cuentas: autoriza que un principal de otra cuenta asuma una función con permisos temporales. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0066","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Una organización compara opciones en la nube: un equipo quiere modificar una política reutilizable y que el cambio afecte a varios roles. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Gestión de permisos con políticas administradas","why":"Correcta. Gestión de permisos con políticas administradas: reutiliza políticas IAM que pueden vincularse a varias identidades. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS IAM Identity Center","why":"Incorrecta. AWS IAM Identity Center: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reutiliza políticas IAM que pueden vincularse a varias identidades."},{"l":"C","t":"Autenticación multifactor (MFA)","why":"Incorrecta. Autenticación multifactor (MFA): añade un factor adicional para autenticarse además de contraseña o credencial inicial. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reutiliza políticas IAM que pueden vincularse a varias identidades."},{"l":"D","t":"Política de contraseñas IAM","why":"Incorrecta. Política de contraseñas IAM: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reutiliza políticas IAM que pueden vincularse a varias identidades."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0067","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Una organización compara opciones en la nube: un arquitecto decide incorporar redundancia y reintentos porque los componentes pueden fallar. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Diseño sin estado","why":"Incorrecta. Diseño sin estado: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse."},{"l":"B","t":"Diseño para fallos","why":"Correcta. Diseño para fallos: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Eficiencia del rendimiento","why":"Incorrecta. Eficiencia del rendimiento: pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse."},{"l":"D","t":"Fiabilidad","why":"Incorrecta. Fiabilidad: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0068","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Un cliente plantea esta situación: un equipo requiere un repositorio privado administrado para sus imágenes Docker. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"AWS Fargate","why":"Incorrecta. AWS Fargate: ejecuta contenedores sin administrar servidores de host para ECS o EKS compatibles. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: registra y almacena imágenes de contenedores para despliegues."},{"l":"B","t":"AWS Batch","why":"Incorrecta. AWS Batch: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: registra y almacena imágenes de contenedores para despliegues."},{"l":"C","t":"Amazon ECR","why":"Correcta. Amazon ECR: registra y almacena imágenes de contenedores para despliegues. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Elastic Load Balancing","why":"Incorrecta. Elastic Load Balancing: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: registra y almacena imágenes de contenedores para despliegues."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0069","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"Una empresa está evaluando AWS: una empresa migra una base de datos a un motor administrado manteniendo el diseño general. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Retaining (retain)","why":"Incorrecta. Retaining (retain): conserva temporalmente una carga de trabajo en el entorno actual. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación."},{"l":"B","t":"Replatforming (replatform)","why":"Correcta. Replatforming (replatform): realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Relocating (relocate)","why":"Incorrecta. Relocating (relocate): mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación."},{"l":"D","t":"Migration Evaluator","why":"Incorrecta. Migration Evaluator: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0070","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una empresa quiere buscar rápidamente logs indexados y generar paneles sobre ellos. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Amazon OpenSearch Service","why":"Correcta. Amazon OpenSearch Service: facilita búsqueda y analítica sobre índices de texto y registros. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon Polly","why":"Incorrecta. Amazon Polly: convierte texto en voz sintetizada para aplicaciones. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: facilita búsqueda y analítica sobre índices de texto y registros."},{"l":"C","t":"Amazon Lex","why":"Incorrecta. Amazon Lex: permite crear interfaces conversacionales de voz y texto para chatbots. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: facilita búsqueda y analítica sobre índices de texto y registros."},{"l":"D","t":"Amazon Textract","why":"Incorrecta. Amazon Textract: extrae texto y estructura de documentos como tablas y formularios. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: facilita búsqueda y analítica sobre índices de texto y registros."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0071","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) un sistema informático requiere elegir los tipos y tamaños de recursos que cumplen latencia y rendimiento; (2) una plataforma busca que una compra desencadene procesos independientes sin llamadas directas entre todos ellos. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Seguridad","why":"Incorrecta. Seguridad pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Eficiencia del rendimiento","why":"Correcta. Eficiencia del rendimiento responde a la necesidad 1: pilar Well-Architected que selecciona y usa recursos informá ncorrecta. NO cumple el requisito 1: bibliotecas para que aplicaciones invoquen APIs de AWS desde un lenguaje de programación. cumple el requisito 2: ubicación físicamente independiente dentro de una región con infraestructura redundante."},{"l":"D","t":"AWS SDK + Región AWS","why":"Incorrecta. NO cumple el requisito 1: bibliotecas para que aplicaciones invoquen APIs de AWS desde un lenguaje de programación. NO cumple el requisito 2: área geográfica con múltiples zonas de disponibilidad separadas."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0073","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, la dirección evalúa beneficios comerciales indicadores y resultados financieros de adoptar AWS. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Perspectiva de seguridad de AWS CAF","why":"Incorrecta. Perspectiva de seguridad de AWS CAF: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: alinea inversiones y transformación digital con resultados empresariales y valor."},{"l":"B","t":"Perspectiva de negocio de AWS CAF","why":"Correcta. Perspectiva de negocio de AWS CAF: alinea inversiones y transformación digital con resultados empresariales y valor. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Perspectiva de gobernanza de AWS CAF","why":"Incorrecta. Perspectiva de gobernanza de AWS CAF: orienta transformación mediante gestión de riesgos carteras y control organizacional. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: alinea inversiones y transformación digital con resultados empresariales y valor."},{"l":"D","t":"Perspectiva de operaciones de AWS CAF","why":"Incorrecta. Perspectiva de operaciones de AWS CAF: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: alinea inversiones y transformación digital con resultados empresariales y valor."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0074","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Alta","text":"Un cliente plantea esta situación: un área financiera requiere datos detallados de facturación a nivel de recursos y dimensiones compatibles. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"AWS Cost Explorer","why":"Incorrecta. AWS Cost Explorer: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona registros detallados de uso y costos para análisis granular."},{"l":"B","t":"AWS Cost and Usage Report (CUR)","why":"Correcta. AWS Cost and Usage Report (CUR): proporciona registros detallados de uso y costos para análisis granular. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Etiquetas de asignación de costos","why":"Incorrecta. Etiquetas de asignación de costos: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona registros detallados de uso y costos para análisis granular."},{"l":"D","t":"AWS Pricing Calculator","why":"Incorrecta. AWS Pricing Calculator: estima costos futuros de arquitecturas y servicios antes de desplegarlos. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona registros detallados de uso y costos para análisis granular."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0075","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: un gerente necesita una alerta cuando el gasto mensual proyectado supera el objetivo aprobado. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"AWS Budgets","why":"Correcta. AWS Budgets: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Etiquetas de asignación de costos","why":"Incorrecta. Etiquetas de asignación de costos: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos."},{"l":"C","t":"Facturación consolidada de AWS Organizations","why":"Incorrecta. Facturación consolidada de AWS Organizations: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos."},{"l":"D","t":"AWS Cost and Usage Report (CUR)","why":"Incorrecta. AWS Cost and Usage Report (CUR): proporciona registros detallados de uso y costos para análisis granular. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0076","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una función solo debe leer dos prefijos de S3 y ningún otro dato. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Acceso mediante credenciales temporales","why":"Incorrecta. Acceso mediante credenciales temporales: reduce exposición al expirar automáticamente las credenciales de sesión. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: concede únicamente permisos indispensables para realizar la tarea autorizada."},{"l":"B","t":"Federación de identidades","why":"Incorrecta. Federación de identidades: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: concede únicamente permisos indispensables para realizar la tarea autorizada."},{"l":"C","t":"Usuario IAM","why":"Incorrecta. Usuario IAM: representa una identidad persistente en una cuenta con posibles credenciales de larga duración. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: concede únicamente permisos indispensables para realizar la tarea autorizada."},{"l":"D","t":"Principio de privilegio mínimo","why":"Correcta. Principio de privilegio mínimo: concede únicamente permisos indispensables para realizar la tarea autorizada. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0077","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un responsable necesita paneles de BI y visualizaciones sin desarrollar una interfaz propia. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Amazon Polly","why":"Incorrecta. Amazon Polly: convierte texto en voz sintetizada para aplicaciones. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece capacidades de inteligencia de negocios y visualización de datos administradas."},{"l":"B","t":"AWS Glue","why":"Incorrecta. AWS Glue: integra datos mediante procesos ETL y catálogo de metadatos administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece capacidades de inteligencia de negocios y visualización de datos administradas."},{"l":"C","t":"Amazon OpenSearch Service","why":"Incorrecta. Amazon OpenSearch Service: facilita búsqueda y analítica sobre índices de texto y registros. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece capacidades de inteligencia de negocios y visualización de datos administradas."},{"l":"D","t":"Amazon Quick","why":"Correcta. Amazon Quick: ofrece capacidades de inteligencia de negocios y visualización de datos administradas. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0078","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una compañía debe localizar números de identificación personal almacenados por error en buckets S3; (2) una compañía requiere impedir publicaciones públicas accidentales de datos en Amazon S3. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Cifrado en tránsito","why":"Incorrecta. Cifrado en tránsito: protege datos mientras viajan por conexiones como TLS o VPN. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"AWS Marketplace de seguridad","why":"Incorrecta. AWS Marketplace de seguridad: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"Cifrado en reposo","why":"Incorrecta. Cifrado en reposo protege datos almacenados en discos objetos o bases de datos. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Amazon Macie","why":"Correcta. Amazon Macie responde a la necesidad 1: detecta y ayuda a clasificar datos confidenciales en Amazon S3."},{"l":"E","t":"Bloqueo de acceso público de S3","why":"Correcta. Bloqueo de acceso público de S3 responde a la necesidad 2: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos."}],"key":["D","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0079","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"Un cliente plantea esta situación: una aplicación exige personalización del motor que no admite un servicio relacional administrado. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Amazon Redshift","why":"Incorrecta. Amazon Redshift: ejecuta analítica SQL de almacén de datos para grandes volúmenes. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite al cliente instalar y controlar motor parches y configuración en una instancia."},{"l":"B","t":"AWS DMS","why":"Incorrecta. AWS DMS: migra o replica datos de bases con cambios mínimos y admite migraciones heterogéneas. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite al cliente instalar y controlar motor parches y configuración en una instancia."},{"l":"C","t":"Amazon DynamoDB","why":"Incorrecta. Amazon DynamoDB: proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite al cliente instalar y controlar motor parches y configuración en una instancia."},{"l":"D","t":"Base de datos autoadministrada en EC2","why":"Correcta. Base de datos autoadministrada en EC2: permite al cliente instalar y controlar motor parches y configuración en una instancia. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0080","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) los empleados necesitan iniciar sesión una vez y acceder a múltiples cuentas AWS asignadas; (2) un sistema informático heredado requiere identificar una identidad IAM concreta dentro de una cuenta. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Usuario IAM","why":"Correcta. Usuario IAM responde a la necesidad 2: representa una identidad persistente en una cuenta con posibles credenciales de larga duración."},{"l":"B","t":"Principio de privilegio mínimo","why":"Incorrecta. Principio de privilegio mínimo: concede únicamente permisos indispensables para realizar la tarea autorizada. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"AWS IAM Identity Center","why":"Correcta. AWS IAM Identity Center responde a la necesidad 1: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO."},{"l":"D","t":"Política de contraseñas IAM","why":"Incorrecta. Política de contraseñas IAM define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"Permisos explícitamente denegados","why":"Incorrecta. Permisos explícitamente denegados: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["A","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0081","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Alta","text":"Un cliente plantea esta situación: una empresa quiere clasificar facturación según unidades de negocio usando reglas sobre cuentas y etiquetas. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"AWS Pricing Calculator","why":"Incorrecta. AWS Pricing Calculator: estima costos futuros de arquitecturas y servicios antes de desplegarlos. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: agrupa y clasifica líneas de costo usando reglas de negocio configuradas."},{"l":"B","t":"Etiquetas de asignación de costos","why":"Incorrecta. Etiquetas de asignación de costos: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: agrupa y clasifica líneas de costo usando reglas de negocio configuradas."},{"l":"C","t":"AWS Cost Categories","why":"Correcta. AWS Cost Categories: agrupa y clasifica líneas de costo usando reglas de negocio configuradas. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Facturación consolidada de AWS Organizations","why":"Incorrecta. Facturación consolidada de AWS Organizations: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: agrupa y clasifica líneas de costo usando reglas de negocio configuradas."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0082","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una aplicación monolítica necesita más RAM en su instancia sin distribuirse entre varios servidores. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Recuperación ante desastres","why":"Incorrecta. Recuperación ante desastres: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aumenta recursos de un único servidor como memoria o CPU."},{"l":"B","t":"Tolerancia a errores","why":"Incorrecta. Tolerancia a errores: continúa operando durante fallas de componentes con interrupción mínima o nula. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aumenta recursos de un único servidor como memoria o CPU."},{"l":"C","t":"Alta disponibilidad","why":"Incorrecta. Alta disponibilidad: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aumenta recursos de un único servidor como memoria o CPU."},{"l":"D","t":"Escalabilidad vertical","why":"Correcta. Escalabilidad vertical: aumenta recursos de un único servidor como memoria o CPU. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0083","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una corporación busca comprar una solución comercial de un proveedor externo compatible con AWS; (2) un grupo financiero busca un plan de soporte con acompañamiento experto para cargas críticas de negocio. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Professional Services","why":"Incorrecta. AWS Professional Services: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"AWS Business Support+","why":"Incorrecta. AWS Business Support+ plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"AWS Prescriptive Guidance","why":"Incorrecta. AWS Prescriptive Guidance: publica estrategias patrones y guías para migración modernización y operación. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"AWS Marketplace","why":"Correcta. AWS Marketplace responde a la necesidad 1: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros."},{"l":"E","t":"AWS Enterprise Support","why":"Correcta. AWS Enterprise Support responde a la necesidad 2: plan prémium para cargas críticas de negocio con orientación experta y capacidades empresariales."}],"key":["D","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0084","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Una organización compara opciones en la nube: una compañía construye una landing zone gobernada para sus nuevas cuentas AWS. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"AWS Systems Manager","why":"Incorrecta. AWS Systems Manager: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: facilita configurar y gobernar un entorno de múltiples cuentas con controles."},{"l":"B","t":"Amazon CloudWatch","why":"Incorrecta. Amazon CloudWatch: recopila métricas registros y alarmas para observar aplicaciones y recursos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: facilita configurar y gobernar un entorno de múltiples cuentas con controles."},{"l":"C","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: facilita configurar y gobernar un entorno de múltiples cuentas con controles."},{"l":"D","t":"AWS Control Tower","why":"Correcta. AWS Control Tower: facilita configurar y gobernar un entorno de múltiples cuentas con controles. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0085","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una compañía debe capacitar empleados y redefinir roles para adoptar trabajo en la nube; (2) Durante un nuevo proyecto, un comité define políticas de inversión prioridades y medición de riesgos en la adopción. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Perspectiva de seguridad de AWS CAF","why":"Incorrecta. Perspectiva de seguridad de AWS CAF orienta a lograr confidencialidad integridad y disponibilidad durante la transformación. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Perspectiva de personas de AWS CAF","why":"Correcta. Perspectiva de personas de AWS CAF responde a la necesidad 1: aborda habilidades cultura organización y preparación de la fuerza laboral."},{"l":"C","t":"Perspectiva de negocio de AWS CAF","why":"Incorrecta. Perspectiva de negocio de AWS CAF: alinea inversiones y transformación digital con resultados empresariales y valor. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Perspectiva de plataforma de AWS CAF","why":"Incorrecta. Perspectiva de plataforma de AWS CAF: se centra en construir y modernizar la plataforma tecnológica en la nube. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Perspectiva de gobernanza de AWS CAF","why":"Correcta. Perspectiva de gobernanza de AWS CAF responde a la necesidad 2: orienta transformación mediante gestión de riesgos carteras y control organizacional."}],"key":["B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0086","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) una multinacional busca organizar múltiples cuentas bajo una estructura administrada centralmente; (2) un responsable de administración desea recomendaciones generales sobre recursos ociosos y configuraciones de seguridad. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"AWS Artifact + AWS KMS","why":"Incorrecta. NO cumple el requisito 1: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. NO cumple el requisito 2: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado."},{"l":"B","t":"AWS Artifact + AWS Trusted Advisor","why":"Incorrecta. NO cumple el requisito 1: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. cumple el requisito 2: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas."},{"l":"C","t":"AWS Organizations + AWS Trusted Advisor","why":"Correcta. cumple el requisito 1: agrupa cuentas para aplicar gobierno y facturación centralizada. cumple el requisito 2: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas."},{"l":"D","t":"AWS Organizations + AWS KMS","why":"Incorrecta. cumple el requisito 1: agrupa cuentas para aplicar gobierno y facturación centralizada. NO cumple el requisito 2: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0087","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un archivo histórico se consulta trimestralmente pero cada consulta requiere acceso inmediato. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"S3 Intelligent-Tiering","why":"Incorrecta. S3 Intelligent-Tiering: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: guarda archivos de acceso muy infrecuente que requieren recuperación en milisegundos."},{"l":"B","t":"S3 Glacier Instant Retrieval","why":"Correcta. S3 Glacier Instant Retrieval: guarda archivos de acceso muy infrecuente que requieren recuperación en milisegundos. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon EFS","why":"Incorrecta. Amazon EFS: proporciona archivos elásticos administrados NFS para acceso simultáneo desde varias instancias Linux. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: guarda archivos de acceso muy infrecuente que requieren recuperación en milisegundos."},{"l":"D","t":"S3 Standard-IA","why":"Incorrecta. S3 Standard-IA: almacena objetos poco consultados con recuperación rápida y resiliencia multizona. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: guarda archivos de acceso muy infrecuente que requieren recuperación en milisegundos."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0088","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) un área solicita aislamiento físico de otras cuentas para sus instancias pero no requiere manejar el host subyacente; (2) Durante un nuevo proyecto, un procesamiento por lotes tolerante a interrupciones busca el menor costo posible de cómputo. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Transferencia de datos saliente","why":"Incorrecta. Transferencia de datos saliente: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Dedicated Instances","why":"Correcta. Dedicated Instances responde a la necesidad 1: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts."},{"l":"C","t":"Savings Plans","why":"Incorrecta. Savings Plans: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Instancias Spot","why":"Correcta. Instancias Spot responde a la necesidad 2: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla."},{"l":

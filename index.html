la capacidad solicitada es: identifica acceso externo no previsto y ayuda a analizar permisos de recursos e identidades."},{"l":"C","t":"AWS Config","why":"Incorrecta. AWS Config: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: identifica acceso externo no previsto y ayuda a analizar permisos de recursos e identidades."},{"l":"D","t":"AWS Control Tower","why":"Incorrecta. AWS Control Tower: facilita configurar y gobernar un entorno de múltiples cuentas con controles. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: identifica acceso externo no previsto y ayuda a analizar permisos de recursos e identidades."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0263","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: un administrador delega creación de roles pero limita el alcance máximo de sus permisos. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Autenticación multifactor (MFA)","why":"Incorrecta. Autenticación multifactor (MFA): añade un factor adicional para autenticarse además de contraseña o credencial inicial. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol."},{"l":"B","t":"Rol IAM","why":"Incorrecta. Rol IAM: otorga credenciales temporales que pueden asumirse por principales autorizados. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol."},{"l":"C","t":"Límite de permisos IAM","why":"Correcta. Límite de permisos IAM: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Credenciales de acceso programático","why":"Incorrecta. Credenciales de acceso programático: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0264","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) un grupo financiero busca mover servidores virtuales a AWS sin rediseñar inicialmente sus aplicaciones; (2) un grupo de trabajo sustituye su monolito por componentes desacoplados y servicios gestionados. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Rehosting (rehost) + AWS Migration Hub","why":"Incorrecta. cumple el requisito 1: traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. NO cumple el requisito 2: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles."},{"l":"B","t":"AWS Cloud Adoption Framework + AWS Migration Hub","why":"Incorrecta. NO cumple el requisito 1: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción. NO cumple el requisito 2: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles."},{"l":"C","t":"Rehosting (rehost) + Refactoring (refactor)","why":"Correcta. cumple el requisito 1: traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. cumple el requisito 2: rediseña significativamente la aplicación para aprovechar capacidades nativas de nube."},{"l":"D","t":"AWS Cloud Adoption Framework + Refactoring (refactor)","why":"Incorrecta. NO cumple el requisito 1: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción. cumple el requisito 2: rediseña significativamente la aplicación para aprovechar capacidades nativas de nube."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0265","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) un grupo de trabajo clasifica sentimientos y entidades en comentarios de clientes; (2) un despacho requiere extraer campos y tablas de documentos escaneados. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Kinesis","why":"Incorrecta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Amazon Comprehend","why":"Correcta. Amazon Comprehend responde a la necesidad 1: extrae información del lenguaje natural como entidades y sentimientos de texto."},{"l":"C","t":"Amazon Textract","why":"Correcta. Amazon Textract responde a la necesidad 2: extrae texto y estructura de documentos como tablas y formularios."},{"l":"D","t":"Amazon EMR","why":"Incorrecta. Amazon EMR: ejecuta marcos de big data como Apache Spark y Hadoop administrados. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Amazon Polly","why":"Incorrecta. Amazon Polly convierte texto en voz sintetizada para aplicaciones. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["B","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0266","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una empresa quiere acercar su aplicación a clientes de América Europa y Asia. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Pago por uso","why":"Incorrecta. Pago por uso: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas."},{"l":"B","t":"Escalabilidad vertical","why":"Incorrecta. Escalabilidad vertical: aumenta recursos de un único servidor como memoria o CPU. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas."},{"l":"C","t":"Escalabilidad horizontal","why":"Incorrecta. Escalabilidad horizontal: aumenta capacidad agregando más instancias o nodos en paralelo. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas."},{"l":"D","t":"Alcance global","why":"Correcta. Alcance global: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0267","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) una entidad busca patrones de migración y mejores prácticas descritas paso a paso; (2) una entidad global requiere la modalidad más especializada para operar cargas de misión crítica. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"AWS Marketplace + AWS Unified Operations","why":"Incorrecta. NO cumple el requisito 1: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. cumple el requisito 2: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones."},{"l":"B","t":"AWS Marketplace + AWS re:Post","why":"Incorrecta. NO cumple el requisito 1: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. NO cumple el requisito 2: comunidad de preguntas y respuestas técnicas sobre AWS."},{"l":"C","t":"AWS Prescriptive Guidance + AWS Unified Operations","why":"Correcta. cumple el requisito 1: publica estrategias patrones y guías para migración modernización y operación. cumple el requisito 2: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones."},{"l":"D","t":"AWS Prescriptive Guidance + AWS re:Post","why":"Incorrecta. cumple el requisito 1: publica estrategias patrones y guías para migración modernización y operación. NO cumple el requisito 2: comunidad de preguntas y respuestas técnicas sobre AWS."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0268","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una plataforma ejecutada en AWS debe evitar secretos de larga duración para acceso a servicios; (2) Durante un nuevo proyecto, el propietario de un bucket agrega una declaración que autoriza a un rol de otra cuenta a leer objetos. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Política basada en recurso","why":"Correcta. Política basada en recurso responde a la necesidad 2: se adjunta al recurso compatible para expresar quién puede actuar sobre él."},{"l":"B","t":"Autenticación multifactor (MFA)","why":"Incorrecta. Autenticación multifactor (MFA): añade un factor adicional para autenticarse además de contraseña o credencial inicial. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Permisos explícitamente denegados","why":"Incorrecta. Permisos explícitamente denegados: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Acceso mediante credenciales temporales","why":"Correcta. Acceso mediante credenciales temporales responde a la necesidad 1: reduce exposición al expirar automáticamente las credenciales de sesión."},{"l":"E","t":"Rol entre cuentas","why":"Incorrecta. Rol entre cuentas autoriza que un principal de otra cuenta asuma una función con permisos temporales. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0269","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un sistema informático regulado permanece local hasta renegociar sus contratos y requisitos legales; (2) una compañía migra una base de datos a un motor administrado manteniendo el diseño general. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Retaining (retain) + AWS Migration Hub","why":"Incorrecta. cumple el requisito 1: conserva temporalmente una carga de trabajo en el entorno actual. NO cumple el requisito 2: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles."},{"l":"B","t":"Rehosting (rehost) + Replatforming (replatform)","why":"Incorrecta. NO cumple el requisito 1: traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. cumple el requisito 2: realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación."},{"l":"C","t":"Retaining (retain) + Replatforming (replatform)","why":"Correcta. cumple el requisito 1: conserva temporalmente una carga de trabajo en el entorno actual. cumple el requisito 2: realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación."},{"l":"D","t":"Rehosting (rehost) + AWS Migration Hub","why":"Incorrecta. NO cumple el requisito 1: traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. NO cumple el requisito 2: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0270","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"Una empresa está evaluando AWS: una aplicación requiere distribuir instancias entre dominios de falla dentro de una misma región. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Zona de disponibilidad (AZ)","why":"Correcta. Zona de disponibilidad (AZ): ubicación físicamente independiente dentro de una región con infraestructura redundante. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Arquitectura multirregión","why":"Incorrecta. Arquitectura multirregión: despliega o replica recursos en regiones distintas para objetivos globales y recuperación. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ubicación físicamente independiente dentro de una región con infraestructura redundante."},{"l":"C","t":"Ubicación perimetral (edge location)","why":"Incorrecta. Ubicación perimetral (edge location): punto de presencia cercano a usuarios para entrega de contenido y ciertos servicios periféricos. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ubicación físicamente independiente dentro de una región con infraestructura redundante."},{"l":"D","t":"AWS Outposts","why":"Incorrecta. AWS Outposts: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ubicación físicamente independiente dentro de una región con infraestructura redundante."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0271","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una plataforma analiza eventos de clics continuamente conforme llegan; (2) una compañía busca buscar rápidamente logs indexados y generar paneles sobre ellos. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Quick","why":"Incorrecta. Amazon Quick: ofrece capacidades de inteligencia de negocios y visualización de datos administradas. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"Amazon Q","why":"Incorrecta. Amazon Q: ofrece asistentes de IA generativa para tareas empresariales y desarrollo según producto. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"Amazon OpenSearch Service","why":"Correcta. Amazon OpenSearch Service responde a la necesidad 2: facilita búsqueda y analítica sobre índices de texto y registros."},{"l":"D","t":"Amazon Kinesis","why":"Correcta. Amazon Kinesis responde a la necesidad 1: ingiere y procesa flujos de datos en tiempo real a escala."},{"l":"E","t":"Amazon Rekognition","why":"Incorrecta. Amazon Rekognition analiza imágenes y video para detectar objetos textos y características visuales. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0272","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"Un cliente plantea esta situación: una empresa desea desplegar un call center sin operar centrales telefónicas locales. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Amazon EventBridge","why":"Incorrecta. Amazon EventBridge: enruta eventos desde distintas fuentes a destinos mediante reglas. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona un centro de contacto omnicanal en la nube."},{"l":"B","t":"Amazon Connect","why":"Correcta. Amazon Connect: proporciona un centro de contacto omnicanal en la nube. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon SNS","why":"Incorrecta. Amazon SNS: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona un centro de contacto omnicanal en la nube."},{"l":"D","t":"AWS IoT Core","why":"Incorrecta. AWS IoT Core: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona un centro de contacto omnicanal en la nube."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0273","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un responsable de administración central busca impedir determinadas acciones aunque un usuario final tenga permisos IAM amplios; (2) un arquitecto busca documentar el análisis de riesgos frente a los seis pilares Well-Architected. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS KMS","why":"Incorrecta. AWS KMS: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"AWS Firewall Manager","why":"Incorrecta. AWS Firewall Manager administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Service Control Policy (SCP)","why":"Correcta. Service Control Policy (SCP) responde a la necesidad 1: establece el máximo conjunto de permisos posibles para cuentas en una organización."},{"l":"E","t":"AWS Well-Architected Tool","why":"Correcta. AWS Well-Architected Tool responde a la necesidad 2: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura."}],"key":["D","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0274","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) un sistema informático transaccional no puede dejar de procesar si se avería un componente; (2) una compañía busca el ahorro que AWS logra al comprar infraestructura a gran escala. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Escalabilidad horizontal + Economías de escala","why":"Incorrecta. NO cumple el requisito 1: aumenta capacidad agregando más instancias o nodos en paralelo. cumple el requisito 2: reducen costos unitarios gracias al volumen agregado de demanda del proveedor."},{"l":"B","t":"Tolerancia a errores + Economías de escala","why":"Correcta. cumple el requisito 1: continúa operando durante fallas de componentes con interrupción mínima o nula. cumple el requisito 2: reducen costos unitarios gracias al volumen agregado de demanda del proveedor."},{"l":"C","t":"Tolerancia a errores + Gasto operativo variable","why":"Incorrecta. cumple el requisito 1: continúa operando durante fallas de componentes con interrupción mínima o nula. NO cumple el requisito 2: desplaza inversiones en hardware hacia gastos asociados al uso."},{"l":"D","t":"Escalabilidad horizontal + Gasto operativo variable","why":"Incorrecta. NO cumple el requisito 1: aumenta capacidad agregando más instancias o nodos en paralelo. NO cumple el requisito 2: desplaza inversiones en hardware hacia gastos asociados al uso."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0275","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) un grupo de trabajo pregunta quién actualiza la capa de hipervisor que soporta instancias virtuales de EC2; (2) un grupo de trabajo pregunta quién debe corregir bibliotecas vulnerables incorporadas al paquete de su función Lambda. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Control de accesos a datos en RDS","why":"Incorrecta. Control de accesos a datos en RDS: lo define el cliente mediante identidades permisos y controles de aplicación. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Código y dependencias de Lambda","why":"Correcta. Código y dependencias de Lambda responde a la necesidad 2: son responsabilidad del cliente que publica y mantiene su propia función."},{"l":"C","t":"Parches del SO invitado en EC2","why":"Incorrecta. Parches del SO invitado en EC2 normalmente corresponden al cliente para sistemas operativos de instancias EC2. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Seguridad física del centro de datos","why":"Incorrecta. Seguridad física del centro de datos: AWS controla acceso físico energía y protección de instalaciones de sus regiones. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Seguridad del hipervisor administrado por AWS","why":"Correcta. Seguridad del hipervisor administrado por AWS responde a la necesidad 1: AWS administra la virtualización e infraestructura subyacente de EC2."}],"key":["B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0276","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Una empresa está evaluando AWS: una pequeña organización necesita un sitio sencillo con administración y precios simplificados. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS Lambda","why":"Incorrecta. AWS Lambda: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece servidores virtuales y recursos simplificados con paquetes predecibles."},{"l":"B","t":"AWS Fargate","why":"Incorrecta. AWS Fargate: ejecuta contenedores sin administrar servidores de host para ECS o EKS compatibles. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece servidores virtuales y recursos simplificados con paquetes predecibles."},{"l":"C","t":"Amazon Lightsail","why":"Correcta. Amazon Lightsail: ofrece servidores virtuales y recursos simplificados con paquetes predecibles. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon EC2 Auto Scaling","why":"Incorrecta. Amazon EC2 Auto Scaling: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece servidores virtuales y recursos simplificados con paquetes predecibles."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0277","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, una organización quiere aplicar políticas de copia y retención consistentes a varios servicios. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Amazon EBS","why":"Incorrecta. Amazon EBS: aporta volúmenes de almacenamiento en bloques persistente para instancias EC2. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: centraliza y automatiza políticas de respaldo de recursos AWS compatibles."},{"l":"B","t":"S3 Glacier Instant Retrieval","why":"Incorrecta. S3 Glacier Instant Retrieval: guarda archivos de acceso muy infrecuente que requieren recuperación en milisegundos. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: centraliza y automatiza políticas de respaldo de recursos AWS compatibles."},{"l":"C","t":"Amazon S3","why":"Incorrecta. Amazon S3: almacena objetos en buckets con acceso basado en API y alta durabilidad. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: centraliza y automatiza políticas de respaldo de recursos AWS compatibles."},{"l":"D","t":"AWS Backup","why":"Correcta. AWS Backup: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0278","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) Durante un nuevo proyecto, un archivo histórico se consulta trimestralmente pero cada consulta requiere acceso inmediato; (2) una plataforma local requiere seguir mediante interfaces de archivos mientras almacena datos en AWS. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"S3 Glacier Instant Retrieval","why":"Correcta. S3 Glacier Instant Retrieval responde a la necesidad 1: guarda archivos de acceso muy infrecuente que requieren recuperación en milisegundos."},{"l":"B","t":"S3 Glacier Flexible Retrieval","why":"Incorrecta. S3 Glacier Flexible Retrieval: archiva datos rara vez consultados con recuperaciones en minutos u horas. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"S3 Glacier Deep Archive","why":"Incorrecta. S3 Glacier Deep Archive ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"AWS Backup","why":"Incorrecta. AWS Backup: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"AWS Storage Gateway","why":"Correcta. AWS Storage Gateway responde a la necesidad 2: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas."}],"key":["A","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0279","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: un sistema necesita elegir los tipos y tamaños de recursos que cumplen latencia y rendimiento. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Sostenibilidad","why":"Incorrecta. Sostenibilidad: pilar Well-Architected que minimiza impactos ambientales del uso de recursos. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga."},{"l":"B","t":"Arquitectura basada en eventos","why":"Incorrecta. Arquitectura basada en eventos: desacopla productores y consumidores mediante eventos que disparan reacciones. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga."},{"l":"C","t":"Fiabilidad","why":"Incorrecta. Fiabilidad: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga."},{"l":"D","t":"Eficiencia del rendimiento","why":"Correcta. Eficiencia del rendimiento: pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0280","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) finanzas debe atribuir gasto a equipos mediante etiquetas como proyecto o centro de costo; (2) un gerente requiere una alerta cuando el gasto mensual proyectado supera el objetivo aprobado. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Pricing Calculator","why":"Incorrecta. AWS Pricing Calculator: estima costos futuros de arquitecturas y servicios antes de desplegarlos. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"AWS Cost Categories","why":"Incorrecta. AWS Cost Categories agrupa y clasifica líneas de costo usando reglas de negocio configuradas. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"AWS Budgets","why":"Correcta. AWS Budgets responde a la necesidad 2: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos."},{"l":"D","t":"AWS Cost and Usage Report (CUR)","why":"Incorrecta. AWS Cost and Usage Report (CUR): proporciona registros detallados de uso y costos para análisis granular. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Etiquetas de asignación de costos","why":"Correcta. Etiquetas de asignación de costos responde a la necesidad 1: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación."}],"key":["C","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0281","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un grupo de trabajo adjunta al rol de aplicación una política que permite PutObject en un bucket; (2) un servicio requiere credenciales temporales al asumir un rol en otra cuenta. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Límite de permisos IAM","why":"Incorrecta. Límite de permisos IAM restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"AWS STS","why":"Correcta. AWS STS responde a la necesidad 2: emite credenciales de seguridad temporales para sesiones y roles."},{"l":"C","t":"Autenticación multifactor (MFA)","why":"Incorrecta. Autenticación multifactor (MFA): añade un factor adicional para autenticarse además de contraseña o credencial inicial. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Permisos explícitamente denegados","why":"Incorrecta. Permisos explícitamente denegados: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Política basada en identidad IAM","why":"Correcta. Política basada en identidad IAM responde a la necesidad 1: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados."}],"key":["B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0282","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un equipo ejecuta contenedores y quiere evitar operar nodos EC2 de su clúster. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"AWS Elastic Beanstalk","why":"Incorrecta. AWS Elastic Beanstalk: despliega aplicaciones web y automatiza infraestructura mientras permite acceso a recursos subyacentes. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta contenedores sin administrar servidores de host para ECS o EKS compatibles."},{"l":"B","t":"AWS Fargate","why":"Correcta. AWS Fargate: ejecuta contenedores sin administrar servidores de host para ECS o EKS compatibles. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon EC2 Auto Scaling","why":"Incorrecta. Amazon EC2 Auto Scaling: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta contenedores sin administrar servidores de host para ECS o EKS compatibles."},{"l":"D","t":"Instancias EC2 optimizadas para memoria","why":"Incorrecta. Instancias EC2 optimizadas para memoria: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta contenedores sin administrar servidores de host para ECS o EKS compatibles."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0283","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Una empresa está evaluando AWS: un equipo revisa métricas y automatiza procedimientos para mejorar continuamente la operación. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Excelencia operativa","why":"Correcta. Excelencia operativa: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Acoplamiento débil","why":"Incorrecta. Acoplamiento débil: diseña componentes para depender poco unos de otros y limitar fallas en cascada. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos."},{"l":"C","t":"Fiabilidad","why":"Incorrecta. Fiabilidad: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos."},{"l":"D","t":"Dimensionar según la demanda","why":"Incorrecta. Dimensionar según la demanda: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0284","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Un cliente plantea esta situación: una empresa conserva respaldos largos y acepta esperar minutos u horas para recuperarlos. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"S3 Standard-IA","why":"Incorrecta. S3 Standard-IA: almacena objetos poco consultados con recuperación rápida y resiliencia multizona. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: archiva datos rara vez consultados con recuperaciones en minutos u horas."},{"l":"B","t":"Amazon S3","why":"Incorrecta. Amazon S3: almacena objetos en buckets con acceso basado en API y alta durabilidad. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: archiva datos rara vez consultados con recuperaciones en minutos u horas."},{"l":"C","t":"S3 Glacier Flexible Retrieval","why":"Correcta. S3 Glacier Flexible Retrieval: archiva datos rara vez consultados con recuperaciones en minutos u horas. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Backup","why":"Incorrecta. AWS Backup: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: archiva datos rara vez consultados con recuperaciones en minutos u horas."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0285","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una compañía requiere identificar hosts físicos para administrar ciertos requisitos de licenciamiento por servidor; (2) una compañía busca comprometer gasto horario estable y mantener flexibilidad de tipos de cómputo elegibles. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Savings Plans","why":"Correcta. Savings Plans responde a la necesidad 2: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan."},{"l":"B","t":"On-Demand Capacity Reservations","why":"Incorrecta. On-Demand Capacity Reservations: reservan capacidad EC2 en una zona de disponibilidad sin obligar por sí mismas al descuento de plazo. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Instancias Spot","why":"Incorrecta. Instancias Spot: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Dedicated Hosts","why":"Correcta. Dedicated Hosts responde a la necesidad 1: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."},{"l":"E","t":"Instancias reservadas (Reserved Instances)","why":"Incorrecta. Instancias reservadas (Reserved Instances) proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0286","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una aplicación debe recuperarse de interrupciones y responder a cambios en la demanda. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Sostenibilidad","why":"Incorrecta. Sostenibilidad: pilar Well-Architected que minimiza impactos ambientales del uso de recursos. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado."},{"l":"B","t":"Arquitectura basada en eventos","why":"Incorrecta. Arquitectura basada en eventos: desacopla productores y consumidores mediante eventos que disparan reacciones. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado."},{"l":"C","t":"Diseño para fallos","why":"Incorrecta. Diseño para fallos: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado."},{"l":"D","t":"Fiabilidad","why":"Correcta. Fiabilidad: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0287","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) Durante un nuevo proyecto, una auditoría pregunta quién protege físicamente las instalaciones y los equipos que sostienen AWS; (2) una entidad ejecuta Windows en EC2 y requiere asignar responsables de parches del sistema invitado. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Seguridad de la nube","why":"Correcta. Seguridad de la nube responde a la necesidad 1: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios."},{"l":"B","t":"Parches del SO invitado en EC2","why":"Correcta. Parches del SO invitado en EC2 responde a la necesidad 2: normalmente corresponden al cliente para sistemas operativos de instancias EC2."},{"l":"C","t":"Configuración de grupos de seguridad","why":"Incorrecta. Configuración de grupos de seguridad: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Seguridad física del centro de datos","why":"Incorrecta. Seguridad física del centro de datos: AWS controla acceso físico energía y protección de instalaciones de sus regiones. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Seguridad del hipervisor administrado por AWS","why":"Incorrecta. Seguridad del hipervisor administrado por AWS AWS administra la virtualización e infraestructura subyacente de EC2. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0288","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"Una organización compara opciones en la nube: una app heredada usa documentos JSON con controladores MongoDB compatibles. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon DocumentDB","why":"Correcta. Amazon DocumentDB: proporciona una base de documentos administrada compatible con APIs de MongoDB. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon RDS","why":"Incorrecta. Amazon RDS: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una base de documentos administrada compatible con APIs de MongoDB."},{"l":"C","t":"Amazon Aurora","why":"Incorrecta. Amazon Aurora: ofrece un motor relacional administrado compatible con MySQL o PostgreSQL y arquitectura de almacenamiento propia. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una base de documentos administrada compatible con APIs de MongoDB."},{"l":"D","t":"Amazon ElastiCache","why":"Incorrecta. Amazon ElastiCache: ofrece almacenes de caché en memoria administrados para disminuir latencia. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una base de documentos administrada compatible con APIs de MongoDB."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0289","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una empresa emergente busca pagar por los recursos que efectivamente consume en cada mes; (2) un portal web requiere soportar mayor tráfico incorporando servidores adicionales detrás de un balanceador. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Escalabilidad horizontal","why":"Correcta. Escalabilidad horizontal responde a la necesidad 2: aumenta capacidad agregando más instancias o nodos en paralelo."},{"l":"B","t":"Escalabilidad vertical","why":"Incorrecta. Escalabilidad vertical aumenta recursos de un único servidor como memoria o CPU. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"Tolerancia a errores","why":"Incorrecta. Tolerancia a errores: continúa operando durante fallas de componentes con interrupción mínima o nula. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Pago por uso","why":"Correcta. Pago por uso responde a la necesidad 1: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente."},{"l":"E","t":"Servicios administrados","why":"Incorrecta. Servicios administrados: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0290","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) un grupo de trabajo debe definir arquitectura y capacidades de plataforma para albergar aplicaciones migradas; (2) Durante un nuevo proyecto, la dirección evalúa beneficios comerciales indicadores y resultados financieros de adoptar AWS; (3) Durante un nuevo proyecto, una entidad prepara su enfoque de protección riesgos y controles de seguridad de la migración. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"Perspectiva de seguridad de AWS CAF","why":"Correcta. Se aplica a la situación 3: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación."},{"l":"B","t":"Perspectiva de plataforma de AWS CAF","why":"Correcta. Se aplica a la situación 1: se centra en construir y modernizar la plataforma tecnológica en la nube."},{"l":"C","t":"Perspectiva de operaciones de AWS CAF","why":"Incorrecta. Perspectiva de operaciones de AWS CAF se centra en ejecutar y administrar cargas de trabajo y servicios en la nube. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"D","t":"Perspectiva de gobernanza de AWS CAF","why":"Incorrecta. Perspectiva de gobernanza de AWS CAF orienta transformación mediante gestión de riesgos carteras y control organizacional. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"E","t":"Perspectiva de personas de AWS CAF","why":"Incorrecta. Perspectiva de personas de AWS CAF: aborda habilidades cultura organización y preparación de la fuerza laboral. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"F","t":"Perspectiva de negocio de AWS CAF","why":"Correcta. Se aplica a la situación 2: alinea inversiones y transformación digital con resultados empresariales y valor."}],"key":["A","B","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0291","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Una organización compara opciones en la nube: una instancia EC2 debe acceder a S3 sin guardar claves estáticas en disco. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Rol IAM","why":"Correcta. Rol IAM: otorga credenciales temporales que pueden asumirse por principales autorizados. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS STS","why":"Incorrecta. AWS STS: emite credenciales de seguridad temporales para sesiones y roles. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: otorga credenciales temporales que pueden asumirse por principales autorizados."},{"l":"C","t":"Autenticación multifactor (MFA)","why":"Incorrecta. Autenticación multifactor (MFA): añade un factor adicional para autenticarse además de contraseña o credencial inicial. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: otorga credenciales temporales que pueden asumirse por principales autorizados."},{"l":"D","t":"Política basada en identidad IAM","why":"Incorrecta. Política basada en identidad IAM: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: otorga credenciales temporales que pueden asumirse por principales autorizados."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0292","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"En un proyecto que utilizará AWS, una empresa necesita definir rangos IP subredes y rutas de su entorno en AWS. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Amazon VPC","why":"Correcta. Amazon VPC: proporciona una red virtual lógicamente aislada para recursos AWS. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"NAT Gateway","why":"Incorrecta. NAT Gateway: permite que recursos de subredes privadas inicien tráfico saliente a Internet sin conexiones entrantes iniciadas desde fuera. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una red virtual lógicamente aislada para recursos AWS."},{"l":"C","t":"Amazon CloudFront","why":"Incorrecta. Amazon CloudFront: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una red virtual lógicamente aislada para recursos AWS."},{"l":"D","t":"AWS Site-to-Site VPN","why":"Incorrecta. AWS Site-to-Site VPN: conecta redes locales a VPC mediante túneles cifrados sobre una red IP. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una red virtual lógicamente aislada para recursos AWS."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0293","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) un grupo de trabajo busca modificar una política reutilizable y que el cambio afecte a múltiples roles; (2) una corporación busca que empleados ingresen a AWS con su proveedor corporativo de identidades. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Gestión de permisos con políticas administradas + Federación de identidades","why":"Correcta. cumple el requisito 1: reutiliza políticas IAM que pueden vincularse a varias identidades. cumple el requisito 2: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS."},{"l":"B","t":"Política de contraseñas IAM + Federación de identidades","why":"Incorrecta. NO cumple el requisito 1: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. cumple el requisito 2: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS."},{"l":"C","t":"Política de contraseñas IAM + Política basada en recurso","why":"Incorrecta. NO cumple el requisito 1: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. NO cumple el requisito 2: se adjunta al recurso compatible para expresar quién puede actuar sobre él."},{"l":"D","t":"Gestión de permisos con políticas administradas + Política basada en recurso","why":"Incorrecta. cumple el requisito 1: reutiliza políticas IAM que pueden vincularse a varias identidades. NO cumple el requisito 2: se adjunta al recurso compatible para expresar quién puede actuar sobre él."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0294","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) Durante un nuevo proyecto, se expuso un bucket por una política pública excesiva y deben asignarse las responsabilidades; (2) una corporación debe decidir quién autoriza las cuentas que consultan información empresarial alojada en RDS. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Seguridad de la nube","why":"Incorrecta. Seguridad de la nube: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"Seguridad del hipervisor administrado por AWS","why":"Incorrecta. Seguridad del hipervisor administrado por AWS: AWS administra la virtualización e infraestructura subyacente de EC2. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"Control de accesos a datos en RDS","why":"Correcta. Control de accesos a datos en RDS responde a la necesidad 2: lo define el cliente mediante identidades permisos y controles de aplicación."},{"l":"D","t":"Política de bucket S3","why":"Correcta. Política de bucket S3 responde a la necesidad 1: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets."},{"l":"E","t":"Seguridad en la nube","why":"Incorrecta. Seguridad en la nube es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0295","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un sistema de pedidos necesita absorber picos y procesar tareas asincrónicas mediante colas. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon SES","why":"Incorrecta. Amazon SES: permite enviar correos electrónicos transaccionales y campañas mediante un servicio escalable. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: desacopla componentes mediante colas de mensajes que consumidores recuperan."},{"l":"B","t":"Amazon EventBridge","why":"Incorrecta. Amazon EventBridge: enruta eventos desde distintas fuentes a destinos mediante reglas. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: desacopla componentes mediante colas de mensajes que consumidores recuperan."},{"l":"C","t":"Amazon SQS","why":"Correcta. Amazon SQS: desacopla componentes mediante colas de mensajes que consumidores recuperan. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon WorkSpaces","why":"Incorrecta. Amazon WorkSpaces: proporciona escritorios virtuales persistentes administrados para usuarios. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: desacopla componentes mediante colas de mensajes que consumidores recuperan."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0296","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Una organización compara opciones en la nube: un SOC necesita detectar comunicaciones sospechosas y posibles credenciales comprometidas. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"AWS Certificate Manager","why":"Incorrecta. AWS Certificate Manager: aprovisiona y administra certificados TLS públicos o privados compatibles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad."},{"l":"B","t":"AWS Marketplace de seguridad","why":"Incorrecta. AWS Marketplace de seguridad: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad."},{"l":"C","t":"Amazon GuardDuty","why":"Correcta. Amazon GuardDuty: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Cifrado en reposo","why":"Incorrecta. Cifrado en reposo: protege datos almacenados en discos objetos o bases de datos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0297","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) Durante un nuevo proyecto, una base de datos interna no debe ser accesible directamente desde Internet; (2) un grupo de trabajo requiere exponer endpoints REST controlados frente a funciones Lambda. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Subred pública","why":"Incorrecta. Subred pública tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Amazon API Gateway","why":"Correcta. Amazon API Gateway responde a la necesidad 2: crea publica administra y protege APIs para clientes que acceden a backends."},{"l":"C","t":"Subred privada","why":"Correcta. Subred privada responde a la necesidad 1: no dispone de una ruta directa al internet gateway para exposición pública."},{"l":"D","t":"Lista de control de acceso de red (NACL)","why":"Incorrecta. Lista de control de acceso de red (NACL): filtro sin estado que aplica reglas de entrada y salida a nivel de subred. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"AWS Site-to-Site VPN","why":"Incorrecta. AWS Site-to-Site VPN: conecta redes locales a VPC mediante túneles cifrados sobre una red IP. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["B","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0298","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Alta","text":"Una empresa está evaluando AWS: un corporativo necesita acompañamiento de especialistas para un programa amplio de migración. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS Professional Services","why":"Correcta. AWS Professional Services: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Business Support+","why":"Incorrecta. AWS Business Support+: plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS."},{"l":"C","t":"AWS Basic Support","why":"Incorrecta. AWS Basic Support: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS."},{"l":"D","t":"AWS Unified Operations","why":"Incorrecta. AWS Unified Operations: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0299","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una instancia de pruebas usa poca CPU y el equipo busca bajar su tamaño de forma fundamentada. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Automatización como ahorro","why":"Incorrecta. Automatización como ahorro: reduce trabajo manual y errores operativos por procesos repetibles. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva."},{"l":"B","t":"Costos ocultos de centros de datos","why":"Incorrecta. Costos ocultos de centros de datos: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva."},{"l":"C","t":"Rightsizing","why":"Correcta. Rightsizing: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Costos variables frente a fijos","why":"Incorrecta. Costos variables frente a fijos: distingue consumo flexible mensual de inversión inicial inmovilizada. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0300","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una compañía elige un modelo donde el gasto siga el volumen de clientes y no una compra inicial fija; (2) una compañía compara nube y centro de datos incluyendo electricidad espacio mantenimiento y licencias. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Rightsizing","why":"Incorrecta. Rightsizing: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Licencia incluida","why":"Incorrecta. Licencia incluida: incorpora el cargo de licencia aplicable en el precio del servicio. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Costos variables frente a fijos","why":"Correcta. Costos variables frente a fijos responde a la necesidad 1: distingue consumo flexible mensual de inversión inicial inmovilizada."},{"l":"D","t":"Costo total de propiedad (TCO)","why":"Correcta. Costo total de propiedad (TCO) responde a la necesidad 2: considera costos directos e indirectos de operar una solución durante su vida útil."},{"l":"E","t":"Bring Your Own License (BYOL)","why":"Incorrecta. Bring Your Own License (BYOL) permite aprovechar licencias de software propias cuando lo permiten sus términos. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0301","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un servidor web con IP pública debe ser accesible directamente desde Internet según sus reglas. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Amazon Route 53","why":"Incorrecta. Amazon Route 53: presta servicios DNS y políticas de enrutamiento de consultas por nombre. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública."},{"l":"B","t":"NAT Gateway","why":"Incorrecta. NAT Gateway: permite que recursos de subredes privadas inicien tráfico saliente a Internet sin conexiones entrantes iniciadas desde fuera. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública."},{"l":"C","t":"Amazon CloudFront","why":"Incorrecta. Amazon CloudFront: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública."},{"l":"D","t":"Subred pública","why":"Correcta. Subred pública: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0302","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) un área solicita aislamiento físico de otras cuentas para sus instancias pero no requiere manejar el host subyacente; (2) una empresa emergente requiere servidores durante pocos días con uso incierto y no busca compromisos de uno o tres años. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Transferencia de datos saliente + Savings Plans","why":"Incorrecta. NO cumple el requisito 1: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. NO cumple el requisito 2: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan."},{"l":"B","t":"Transferencia de datos saliente + Instancias bajo demanda (On-Demand)","why":"Incorrecta. NO cumple el requisito 1: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. cumple el requisito 2: paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable."},{"l":"C","t":"Dedicated Instances + Savings Plans","why":"Incorrecta. cumple el requisito 1: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts. NO cumple el requisito 2: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan."},{"l":"D","t":"Dedicated Instances + Instancias bajo demanda (On-Demand)","why":"Correcta. cumple el requisito 1: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts. cumple el requisito 2: paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0303","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un equipo quiere orquestar source build y deployment en una canalización de entrega. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon SES","why":"Incorrecta. Amazon SES: permite enviar correos electrónicos transaccionales y campañas mediante un servicio escalable. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: coordina fases automatizadas de entrega continua desde origen hasta despliegue."},{"l":"B","t":"Amazon SQS","why":"Incorrecta. Amazon SQS: desacopla componentes mediante colas de mensajes que consumidores recuperan. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: coordina fases automatizadas de entrega continua desde origen hasta despliegue."},{"l":"C","t":"AWS CodePipeline","why":"Correcta. AWS CodePipeline: coordina fases automatizadas de entrega continua desde origen hasta despliegue. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS CodeBuild","why":"Incorrecta. AWS CodeBuild: compila código ejecuta pruebas y produce artefactos en un entorno administrado. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: coordina fases automatizadas de entrega continua desde origen hasta despliegue."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0304","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) una entidad traslada un conjunto de máquinas virtuales a un entorno compatible en AWS; (2) Durante un nuevo proyecto, una auditoría identifica aplicaciones antiguas sin usuarios que no deben migrarse. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"AWS Migration Hub + Refactoring (refactor)","why":"Incorrecta. NO cumple el requisito 1: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles. NO cumple el requisito 2: rediseña significativamente la aplicación para aprovechar capacidades nativas de nube."},{"l":"B","t":"Relocating (relocate) + Refactoring (refactor)","why":"Incorrecta. cumple el requisito 1: mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales. NO cumple el requisito 2: rediseña significativamente la aplicación para aprovechar capacidades nativas de nube."},{"l":"C","t":"AWS Migration Hub + Retiring (retire)","why":"Incorrecta. NO cumple el requisito 1: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles. cumple el requisito 2: elimina aplicaciones que ya no generan valor o no son necesarias."},{"l":"D","t":"Relocating (relocate) + Retiring (retire)","why":"Correcta. cumple el requisito 1: mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales. cumple el requisito 2: elimina aplicaciones que ya no generan valor o no son necesarias."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0305","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Un cliente plantea esta situación: un operador necesita saber si un incidente de AWS está afectando específicamente sus recursos. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"AWS KMS","why":"Incorrecta. AWS KMS: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: muestra eventos de salud de servicios y eventos que pueden afectar recursos de la cuenta."},{"l":"B","t":"Amazon CloudWatch","why":"Incorrecta. Amazon CloudWatch: recopila métricas registros y alarmas para observar aplicaciones y recursos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: muestra eventos de salud de servicios y eventos que pueden afectar recursos de la cuenta."},{"l":"C","t":"AWS Health Dashboard","why":"Correcta. AWS Health Dashboard: muestra eventos de salud de servicios y eventos que pueden afectar recursos de la cuenta. El re

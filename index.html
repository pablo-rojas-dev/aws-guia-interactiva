<script id="embedded-bank" type="application/json">{"questions":[{"id":"CLF02-0001","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: varias instancias Linux deben compartir carpetas con un sistema de archivos NFS administrado. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Amazon EFS","why":"Correcta. Amazon EFS: proporciona archivos elásticos administrados NFS para acceso simultáneo desde varias instancias Linux. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Backup","why":"Incorrecta. AWS Backup: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona archivos elásticos administrados NFS para acceso simultáneo desde varias instancias Linux."},{"l":"C","t":"Amazon S3","why":"Incorrecta. Amazon S3: almacena objetos en buckets con acceso basado en API y alta durabilidad. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona archivos elásticos administrados NFS para acceso simultáneo desde varias instancias Linux."},{"l":"D","t":"S3 Glacier Deep Archive","why":"Incorrecta. S3 Glacier Deep Archive: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona archivos elásticos administrados NFS para acceso simultáneo desde varias instancias Linux."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0002","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un cliente prefiere pagar software y capacidad juntos sin administrar su propia licencia. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Rightsizing","why":"Incorrecta. Rightsizing: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: incorpora el cargo de licencia aplicable en el precio del servicio."},{"l":"B","t":"Automatización como ahorro","why":"Incorrecta. Automatización como ahorro: reduce trabajo manual y errores operativos por procesos repetibles. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: incorpora el cargo de licencia aplicable en el precio del servicio."},{"l":"C","t":"Costos ocultos de centros de datos","why":"Incorrecta. Costos ocultos de centros de datos: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: incorpora el cargo de licencia aplicable en el precio del servicio."},{"l":"D","t":"Licencia incluida","why":"Correcta. Licencia incluida: incorpora el cargo de licencia aplicable en el precio del servicio. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0003","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una aplicación TCP global busca IP fijas y entrada optimizada a endpoints regionales. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"NAT Gateway","why":"Incorrecta. NAT Gateway: permite que recursos de subredes privadas inicien tráfico saliente a Internet sin conexiones entrantes iniciadas desde fuera. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS."},{"l":"B","t":"AWS Transit Gateway","why":"Incorrecta. AWS Transit Gateway: actúa como concentrador para conectar múltiples VPC y redes locales. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS."},{"l":"C","t":"AWS Global Accelerator","why":"Correcta. AWS Global Accelerator: mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Grupo de seguridad","why":"Incorrecta. Grupo de seguridad: firewall virtual con estado asociado a interfaces y recursos compatibles. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0004","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un equipo pregunta quién debe corregir bibliotecas vulnerables incorporadas al paquete de su función Lambda. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Código y dependencias de Lambda","why":"Correcta. Código y dependencias de Lambda: son responsabilidad del cliente que publica y mantiene su propia función. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Parches del SO invitado en EC2","why":"Incorrecta. Parches del SO invitado en EC2: normalmente corresponden al cliente para sistemas operativos de instancias EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: son responsabilidad del cliente que publica y mantiene su propia función."},{"l":"C","t":"Seguridad física del centro de datos","why":"Incorrecta. Seguridad física del centro de datos: AWS controla acceso físico energía y protección de instalaciones de sus regiones. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: son responsabilidad del cliente que publica y mantiene su propia función."},{"l":"D","t":"Política de bucket S3","why":"Incorrecta. Política de bucket S3: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: son responsabilidad del cliente que publica y mantiene su propia función."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0005","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un equipo quiere versionar y desplegar el mismo conjunto de recursos como código. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Región AWS","why":"Incorrecta. Región AWS: área geográfica con múltiples zonas de disponibilidad separadas. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables."},{"l":"B","t":"AWS CloudFormation","why":"Correcta. AWS CloudFormation: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS SDK","why":"Incorrecta. AWS SDK: bibliotecas para que aplicaciones invoquen APIs de AWS desde un lenguaje de programación. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables."},{"l":"D","t":"Arquitectura multirregión","why":"Incorrecta. Arquitectura multirregión: despliega o replica recursos en regiones distintas para objetivos globales y recuperación. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0006","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un integrante del equipo técnico sube su código web y busca que AWS configure el entorno de ejecución asociado; (2) una plataforma requiere incorporar o retirar instancias EC2 según los picos de CPU. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Instancias EC2 optimizadas para cómputo","why":"Incorrecta. Instancias EC2 optimizadas para cómputo: aportan proporción alta de potencia de CPU para cargas intensivas en procesamiento. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"AWS Elastic Beanstalk","why":"Correcta. AWS Elastic Beanstalk responde a la necesidad 1: despliega aplicaciones web y automatiza infraestructura mientras permite acceso a recursos subyacentes."},{"l":"C","t":"Amazon EC2","why":"Incorrecta. Amazon EC2: ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"AWS Lambda","why":"Incorrecta. AWS Lambda ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"Amazon EC2 Auto Scaling","why":"Correcta. Amazon EC2 Auto Scaling responde a la necesidad 2: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales."}],"key":["B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0007","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) Durante un nuevo proyecto, una entidad prepara su enfoque de protección riesgos y controles de seguridad de la migración; (2) Durante un nuevo proyecto, un comité define políticas de inversión prioridades y medición de riesgos en la adopción. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Perspectiva de seguridad de AWS CAF + Perspectiva de gobernanza de AWS CAF","why":"Correcta. cumple el requisito 1: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación. cumple el requisito 2: orienta transformación mediante gestión de riesgos carteras y control organizacional."},{"l":"B","t":"Perspectiva de seguridad de AWS CAF + Perspectiva de plataforma de AWS CAF","why":"Incorrecta. cumple el requisito 1: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación. NO cumple el requisito 2: se centra en construir y modernizar la plataforma tecnológica en la nube."},{"l":"C","t":"Perspectiva de personas de AWS CAF + Perspectiva de plataforma de AWS CAF","why":"Incorrecta. NO cumple el requisito 1: aborda habilidades cultura organización y preparación de la fuerza laboral. NO cumple el requisito 2: se centra en construir y modernizar la plataforma tecnológica en la nube."},{"l":"D","t":"Perspectiva de personas de AWS CAF + Perspectiva de gobernanza de AWS CAF","why":"Incorrecta. NO cumple el requisito 1: aborda habilidades cultura organización y preparación de la fuerza laboral. cumple el requisito 2: orienta transformación mediante gestión de riesgos carteras y control organizacional."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0008","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un cliente quiere determinar quién debe clasificar los datos que subió a un bucket. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Configuración de grupos de seguridad","why":"Incorrecta. Configuración de grupos de seguridad: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio."},{"l":"B","t":"Seguridad en la nube","why":"Correcta. Seguridad en la nube: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Parches de infraestructura de RDS","why":"Incorrecta. Parches de infraestructura de RDS: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio."},{"l":"D","t":"Seguridad física del centro de datos","why":"Incorrecta. Seguridad física del centro de datos: AWS controla acceso físico energía y protección de instalaciones de sus regiones. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0009","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una compañía necesita conectar decenas de VPC evitando enlaces punto a punto entre todas ellas. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Lista de control de acceso de red (NACL)","why":"Incorrecta. Lista de control de acceso de red (NACL): filtro sin estado que aplica reglas de entrada y salida a nivel de subred. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: actúa como concentrador para conectar múltiples VPC y redes locales."},{"l":"B","t":"Amazon CloudFront","why":"Incorrecta. Amazon CloudFront: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: actúa como concentrador para conectar múltiples VPC y redes locales."},{"l":"C","t":"AWS Transit Gateway","why":"Correcta. AWS Transit Gateway: actúa como concentrador para conectar múltiples VPC y redes locales. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS PrivateLink","why":"Incorrecta. AWS PrivateLink: expone servicios de forma privada mediante endpoints sin usar Internet público. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: actúa como concentrador para conectar múltiples VPC y redes locales."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0010","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Alta","text":"Una empresa está evaluando AWS: una empresa quiere comprometer gasto horario estable y mantener flexibilidad de tipos de cómputo elegibles. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Instancias reservadas (Reserved Instances)","why":"Incorrecta. Instancias reservadas (Reserved Instances): proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan."},{"l":"B","t":"Savings Plans","why":"Correcta. Savings Plans: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"On-Demand Capacity Reservations","why":"Incorrecta. On-Demand Capacity Reservations: reservan capacidad EC2 en una zona de disponibilidad sin obligar por sí mismas al descuento de plazo. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan."},{"l":"D","t":"Dedicated Hosts","why":"Incorrecta. Dedicated Hosts: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0011","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un responsable de operaciones busca acercar copias de contenido a espectadores en otras ciudades; (2) un integrante del equipo técnico Java requiere integrar operaciones de S3 directamente en su aplicación. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS CloudFormation","why":"Incorrecta. AWS CloudFormation: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"AWS Outposts","why":"Incorrecta. AWS Outposts lleva infraestructura y servicios administrados de AWS a instalaciones del cliente. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"Ubicación perimetral (edge location)","why":"Correcta. Ubicación perimetral (edge location) responde a la necesidad 1: punto de presencia cercano a usuarios para entrega de contenido y ciertos servicios periféricos."},{"l":"D","t":"AWS SDK","why":"Correcta. AWS SDK responde a la necesidad 2: bibliotecas para que aplicaciones invoquen APIs de AWS desde un lenguaje de programación."},{"l":"E","t":"AWS Management Console","why":"Incorrecta. AWS Management Console: interfaz web gráfica para administrar servicios y recursos de AWS. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0012","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una organización ejecuta Windows en EC2 y necesita asignar responsables de parches del sistema invitado. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Seguridad del hipervisor administrado por AWS","why":"Incorrecta. Seguridad del hipervisor administrado por AWS: AWS administra la virtualización e infraestructura subyacente de EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: normalmente corresponden al cliente para sistemas operativos de instancias EC2."},{"l":"B","t":"Control de accesos a datos en RDS","why":"Incorrecta. Control de accesos a datos en RDS: lo define el cliente mediante identidades permisos y controles de aplicación. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: normalmente corresponden al cliente para sistemas operativos de instancias EC2."},{"l":"C","t":"Parches del SO invitado en EC2","why":"Correcta. Parches del SO invitado en EC2: normalmente corresponden al cliente para sistemas operativos de instancias EC2. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Seguridad en la nube","why":"Incorrecta. Seguridad en la nube: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: normalmente corresponden al cliente para sistemas operativos de instancias EC2."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0013","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: los empleados necesitan iniciar sesión una vez y acceder a varias cuentas AWS asignadas. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Rol IAM","why":"Incorrecta. Rol IAM: otorga credenciales temporales que pueden asumirse por principales autorizados. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO."},{"l":"B","t":"Usuario raíz (root)","why":"Incorrecta. Usuario raíz (root): es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO."},{"l":"C","t":"Gestión de permisos con políticas administradas","why":"Incorrecta. Gestión de permisos con políticas administradas: reutiliza políticas IAM que pueden vincularse a varias identidades. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO."},{"l":"D","t":"AWS IAM Identity Center","why":"Correcta. AWS IAM Identity Center: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0014","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una entidad busca impedir que datos legibles queden expuestos si se accede a medios almacenados; (2) una compañía busca atenuar inundaciones volumétricas de tráfico contra una plataforma. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Amazon GuardDuty + AWS Shield","why":"Incorrecta. NO cumple el requisito 1: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad. cumple el requisito 2: protege contra ataques de denegación de servicio distribuido DDoS."},{"l":"B","t":"Cifrado en reposo + AWS Certificate Manager","why":"Incorrecta. cumple el requisito 1: protege datos almacenados en discos objetos o bases de datos. NO cumple el requisito 2: aprovisiona y administra certificados TLS públicos o privados compatibles."},{"l":"C","t":"Cifrado en reposo + AWS Shield","why":"Correcta. cumple el requisito 1: protege datos almacenados en discos objetos o bases de datos. cumple el requisito 2: protege contra ataques de denegación de servicio distribuido DDoS."},{"l":"D","t":"Amazon GuardDuty + AWS Certificate Manager","why":"Incorrecta. NO cumple el requisito 1: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad. NO cumple el requisito 2: aprovisiona y administra certificados TLS públicos o privados compatibles."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0015","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, una institución conserva documentos por décadas y tolera recuperaciones de muchas horas. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Amazon EBS","why":"Incorrecta. Amazon EBS: aporta volúmenes de almacenamiento en bloques persistente para instancias EC2. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas."},{"l":"B","t":"AWS Storage Gateway","why":"Incorrecta. AWS Storage Gateway: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas."},{"l":"C","t":"Amazon FSx","why":"Incorrecta. Amazon FSx: ofrece sistemas de archivos administrados especializados como Windows File Server y Lustre. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas."},{"l":"D","t":"S3 Glacier Deep Archive","why":"Correcta. S3 Glacier Deep Archive: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0016","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Una organización compara opciones en la nube: una aerolínea desea un bot que entienda intenciones y solicite parámetros a pasajeros. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon Polly","why":"Incorrecta. Amazon Polly: convierte texto en voz sintetizada para aplicaciones. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite crear interfaces conversacionales de voz y texto para chatbots."},{"l":"B","t":"AWS Glue","why":"Incorrecta. AWS Glue: integra datos mediante procesos ETL y catálogo de metadatos administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite crear interfaces conversacionales de voz y texto para chatbots."},{"l":"C","t":"Amazon Comprehend","why":"Incorrecta. Amazon Comprehend: extrae información del lenguaje natural como entidades y sentimientos de texto. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite crear interfaces conversacionales de voz y texto para chatbots."},{"l":"D","t":"Amazon Lex","why":"Correcta. Amazon Lex: permite crear interfaces conversacionales de voz y texto para chatbots. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0017","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) una compañía desea implementar servicios contenedorizados con un orquestador nativo AWS; (2) una compañía requiere instalar software especializado y gestionar su propio sistema operativo en una máquina virtual. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"AWS Batch + Amazon EC2","why":"Incorrecta. NO cumple el requisito 1: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados. cumple el requisito 2: ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado."},{"l":"B","t":"AWS Batch + Elastic Load Balancing","why":"Incorrecta. NO cumple el requisito 1: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados. NO cumple el requisito 2: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador."},{"l":"C","t":"Amazon ECS + Amazon EC2","why":"Correcta. cumple el requisito 1: orquesta contenedores mediante un servicio de administración propio de AWS. cumple el requisito 2: ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado."},{"l":"D","t":"Amazon ECS + Elastic Load Balancing","why":"Incorrecta. cumple el requisito 1: orquesta contenedores mediante un servicio de administración propio de AWS. NO cumple el requisito 2: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0018","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: instancias privadas deben descargar actualizaciones sin recibir conexiones iniciadas desde Internet. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"NAT Gateway","why":"Correcta. NAT Gateway: permite que recursos de subredes privadas inicien tráfico saliente a Internet sin conexiones entrantes iniciadas desde fuera. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS PrivateLink","why":"Incorrecta. AWS PrivateLink: expone servicios de forma privada mediante endpoints sin usar Internet público. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite que recursos de subredes privadas inicien tráfico saliente a Internet sin conexiones entrantes iniciadas desde fuera."},{"l":"C","t":"Subred privada","why":"Incorrecta. Subred privada: no dispone de una ruta directa al internet gateway para exposición pública. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite que recursos de subredes privadas inicien tráfico saliente a Internet sin conexiones entrantes iniciadas desde fuera."},{"l":"D","t":"AWS Site-to-Site VPN","why":"Incorrecta. AWS Site-to-Site VPN: conecta redes locales a VPC mediante túneles cifrados sobre una red IP. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite que recursos de subredes privadas inicien tráfico saliente a Internet sin conexiones entrantes iniciadas desde fuera."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0019","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) un responsable de administración delega creación de roles pero limita el alcance máximo de sus permisos; (2) un responsable de administración busca aplicar iguales permisos a veinte usuarios sin editar cada uno por separado. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Límite de permisos IAM + Credenciales de acceso programático","why":"Incorrecta. cumple el requisito 1: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. NO cumple el requisito 2: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias."},{"l":"B","t":"Permisos explícitamente denegados + Grupo IAM","why":"Incorrecta. NO cumple el requisito 1: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. cumple el requisito 2: permite asignar permisos comunes a un conjunto de usuarios IAM."},{"l":"C","t":"Permisos explícitamente denegados + Credenciales de acceso programático","why":"Incorrecta. NO cumple el requisito 1: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. NO cumple el requisito 2: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias."},{"l":"D","t":"Límite de permisos IAM + Grupo IAM","why":"Correcta. cumple el requisito 1: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. cumple el requisito 2: permite asignar permisos comunes a un conjunto de usuarios IAM."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0020","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una entidad requiere restaurar su servicio después de la pérdida de una región; (2) una plataforma monolítica requiere más RAM en su instancia sin distribuirse entre múltiples servidores. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Alcance global","why":"Incorrecta. Alcance global: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Recuperación ante desastres","why":"Correcta. Recuperación ante desastres responde a la necesidad 1: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación."},{"l":"C","t":"Escalabilidad vertical","why":"Correcta. Escalabilidad vertical responde a la necesidad 2: aumenta recursos de un único servidor como memoria o CPU."},{"l":"D","t":"Escalabilidad horizontal","why":"Incorrecta. Escalabilidad horizontal aumenta capacidad agregando más instancias o nodos en paralelo. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"Gasto operativo variable","why":"Incorrecta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["B","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0021","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una aplicación necesita administrar credenciales de base de datos con rotación automática. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"AWS Secrets Manager","why":"Correcta. AWS Secrets Manager: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Control Tower","why":"Incorrecta. AWS Control Tower: facilita configurar y gobernar un entorno de múltiples cuentas con controles. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos."},{"l":"C","t":"AWS Config","why":"Incorrecta. AWS Config: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos."},{"l":"D","t":"AWS Firewall Manager","why":"Incorrecta. AWS Firewall Manager: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0022","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una aplicación heredada usa documentos JSON con controladores MongoDB compatibles; (2) una aplicación requiere PostgreSQL administrado sin instalar ni mantener manualmente el motor en EC2. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Redshift","why":"Incorrecta. Amazon Redshift: ejecuta analítica SQL de almacén de datos para grandes volúmenes. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"Amazon DocumentDB","why":"Correcta. Amazon DocumentDB responde a la necesidad 1: proporciona una base de documentos administrada compatible con APIs de MongoDB."},{"l":"C","t":"Amazon RDS","why":"Correcta. Amazon RDS responde a la necesidad 2: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento."},{"l":"D","t":"Amazon DynamoDB","why":"Incorrecta. Amazon DynamoDB proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"Amazon ElastiCache","why":"Incorrecta. Amazon ElastiCache: ofrece almacenes de caché en memoria administrados para disminuir latencia. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["B","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0023","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un equipo frontend busca simplificar hosting y backend para su aplicación web. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"AWS Amplify","why":"Correcta. AWS Amplify: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon Connect","why":"Incorrecta. Amazon Connect: proporciona un centro de contacto omnicanal en la nube. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios."},{"l":"C","t":"AWS X-Ray","why":"Incorrecta. AWS X-Ray: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios."},{"l":"D","t":"AWS IoT Core","why":"Incorrecta. AWS IoT Core: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0024","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un analista busca ejecutar consultas SQL ad hoc sobre archivos en un lago de datos S3; (2) un responsable requiere paneles de BI y visualizaciones sin desarrollar una interfaz propia. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Athena","why":"Correcta. Amazon Athena responde a la necesidad 1: consulta directamente datos almacenados en S3 mediante SQL sin aprovisionar servidores."},{"l":"B","t":"Amazon Lex","why":"Incorrecta. Amazon Lex: permite crear interfaces conversacionales de voz y texto para chatbots. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"Amazon Quick","why":"Correcta. Amazon Quick responde a la necesidad 2: ofrece capacidades de inteligencia de negocios y visualización de datos administradas."},{"l":"D","t":"AWS Glue","why":"Incorrecta. AWS Glue integra datos mediante procesos ETL y catálogo de metadatos administrados. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"Amazon Kinesis","why":"Incorrecta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["A","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0025","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un auditor revisa qué actor realiza vigilancia y protección de edificios de AWS. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Seguridad del hipervisor administrado por AWS","why":"Incorrecta. Seguridad del hipervisor administrado por AWS: AWS administra la virtualización e infraestructura subyacente de EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: AWS controla acceso físico energía y protección de instalaciones de sus regiones."},{"l":"B","t":"Política de bucket S3","why":"Incorrecta. Política de bucket S3: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: AWS controla acceso físico energía y protección de instalaciones de sus regiones."},{"l":"C","t":"Seguridad física del centro de datos","why":"Correcta. Seguridad física del centro de datos: AWS controla acceso físico energía y protección de instalaciones de sus regiones. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Código y dependencias de Lambda","why":"Incorrecta. Código y dependencias de Lambda: son responsabilidad del cliente que publica y mantiene su propia función. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: AWS controla acceso físico energía y protección de instalaciones de sus regiones."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0026","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) una entidad prioriza confidencialidad controles de acceso y respuesta a incidentes; (2) Durante un nuevo proyecto, un arquitecto decide incorporar redundancia y reintentos porque los componentes pueden fallar. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Seguridad + Dimensionar según la demanda","why":"Incorrecta. cumple el requisito 1: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. NO cumple el requisito 2: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento."},{"l":"B","t":"Diseño sin estado + Diseño para fallos","why":"Incorrecta. NO cumple el requisito 1: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado. cumple el requisito 2: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse."},{"l":"C","t":"Diseño sin estado + Dimensionar según la demanda","why":"Incorrecta. NO cumple el requisito 1: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado. NO cumple el requisito 2: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento."},{"l":"D","t":"Seguridad + Diseño para fallos","why":"Correcta. cumple el requisito 1: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. cumple el requisito 2: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0027","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Alta","text":"En un proyecto que utilizará AWS, finanzas debe atribuir gasto a equipos usando etiquetas como proyecto o centro de costo. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"AWS Cost Explorer","why":"Incorrecta. AWS Cost Explorer: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación."},{"l":"B","t":"AWS Cost and Usage Report (CUR)","why":"Incorrecta. AWS Cost and Usage Report (CUR): proporciona registros detallados de uso y costos para análisis granular. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación."},{"l":"C","t":"AWS Budgets","why":"Incorrecta. AWS Budgets: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación."},{"l":"D","t":"Etiquetas de asignación de costos","why":"Correcta. Etiquetas de asignación de costos: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0028","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"Un cliente plantea esta situación: un equipo sustituye su monolito por componentes desacoplados y servicios gestionados. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Refactoring (refactor)","why":"Correcta. Refactoring (refactor): rediseña significativamente la aplicación para aprovechar capacidades nativas de nube. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Retaining (retain)","why":"Incorrecta. Retaining (retain): conserva temporalmente una carga de trabajo en el entorno actual. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: rediseña significativamente la aplicación para aprovechar capacidades nativas de nube."},{"l":"C","t":"Repurchasing (repurchase)","why":"Incorrecta. Repurchasing (repurchase): reemplaza una solución existente por otro producto generalmente SaaS. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: rediseña significativamente la aplicación para aprovechar capacidades nativas de nube."},{"l":"D","t":"AWS Migration Hub","why":"Incorrecta. AWS Migration Hub: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: rediseña significativamente la aplicación para aprovechar capacidades nativas de nube."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0029","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Una empresa está evaluando AWS: una plataforma necesita guardar millones de fotografías como objetos accesibles por URL y API. ¿Qué opción debería elegir?","options":[{"l":"A","t":"S3 Intelligent-Tiering","why":"Incorrecta. S3 Intelligent-Tiering: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena objetos en buckets con acceso basado en API y alta durabilidad."},{"l":"B","t":"Amazon S3","why":"Correcta. Amazon S3: almacena objetos en buckets con acceso basado en API y alta durabilidad. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"S3 One Zone-IA","why":"Incorrecta. S3 One Zone-IA: almacena datos recreables poco consultados en una sola AZ para reducir costo. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena objetos en buckets con acceso basado en API y alta durabilidad."},{"l":"D","t":"S3 Glacier Flexible Retrieval","why":"Incorrecta. S3 Glacier Flexible Retrieval: archiva datos rara vez consultados con recuperaciones en minutos u horas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena objetos en buckets con acceso basado en API y alta durabilidad."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0030","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Alta","text":"Una empresa está evaluando AWS: un banco busca un plan de soporte con acompañamiento experto para cargas críticas de negocio. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS re:Post","why":"Incorrecta. AWS re:Post: comunidad de preguntas y respuestas técnicas sobre AWS. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: plan prémium para cargas críticas de negocio con orientación experta y capacidades empresariales."},{"l":"B","t":"AWS Marketplace","why":"Incorrecta. AWS Marketplace: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: plan prémium para cargas críticas de negocio con orientación experta y capacidades empresariales."},{"l":"C","t":"AWS Enterprise Support","why":"Correcta. AWS Enterprise Support: plan prémium para cargas críticas de negocio con orientación experta y capacidades empresariales. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Professional Services","why":"Incorrecta. AWS Professional Services: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: plan prémium para cargas críticas de negocio con orientación experta y capacidades empresariales."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0031","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) un grupo de trabajo detecta servidores sobredimensionados y planea ajustar su capacidad tras medir utilización; (2) una compañía busca reducir energía consumida por transacción y recursos infrautilizados. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Dimensionar según la demanda + Sostenibilidad","why":"Correcta. cumple el requisito 1: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento. cumple el requisito 2: pilar Well-Architected que minimiza impactos ambientales del uso de recursos."},{"l":"B","t":"Dimensionar según la demanda + Diseño para fallos","why":"Incorrecta. cumple el requisito 1: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento. NO cumple el requisito 2: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse."},{"l":"C","t":"Acoplamiento débil + Sostenibilidad","why":"Incorrecta. NO cumple el requisito 1: diseña componentes para depender poco unos de otros y limitar fallas en cascada. cumple el requisito 2: pilar Well-Architected que minimiza impactos ambientales del uso de recursos."},{"l":"D","t":"Acoplamiento débil + Diseño para fallos","why":"Incorrecta. NO cumple el requisito 1: diseña componentes para depender poco unos de otros y limitar fallas en cascada. NO cumple el requisito 2: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0032","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Una empresa está evaluando AWS: un sitio requiere gestionar certificados usados para conexiones HTTPS. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS Certificate Manager","why":"Correcta. AWS Certificate Manager: aprovisiona y administra certificados TLS públicos o privados compatibles. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Cifrado en reposo","why":"Incorrecta. Cifrado en reposo: protege datos almacenados en discos objetos o bases de datos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aprovisiona y administra certificados TLS públicos o privados compatibles."},{"l":"C","t":"Bloqueo de acceso público de S3","why":"Incorrecta. Bloqueo de acceso público de S3: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aprovisiona y administra certificados TLS públicos o privados compatibles."},{"l":"D","t":"Amazon Inspector","why":"Incorrecta. Amazon Inspector: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aprovisiona y administra certificados TLS públicos o privados compatibles."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0033","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Un cliente plantea esta situación: un auditor debe investigar qué identidad eliminó un recurso desde la consola o API. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"AWS CloudTrail","why":"Correcta. AWS CloudTrail: registra acciones de API y actividad de cuenta para auditoría de quién hizo qué y cuándo. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: registra acciones de API y actividad de cuenta para auditoría de quién hizo qué y cuándo."},{"l":"C","t":"Service Control Policy (SCP)","why":"Incorrecta. Service Control Policy (SCP): establece el máximo conjunto de permisos posibles para cuentas en una organización. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: registra acciones de API y actividad de cuenta para auditoría de quién hizo qué y cuándo."},{"l":"D","t":"AWS Artifact","why":"Incorrecta. AWS Artifact: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: registra acciones de API y actividad de cuenta para auditoría de quién hizo qué y cuándo."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0034","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Una empresa está evaluando AWS: un equipo quiere gobernar permisos y uso de claves para cifrar datos en servicios de AWS. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS KMS","why":"Correcta. AWS KMS: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Resource Access Manager","why":"Incorrecta. AWS Resource Access Manager: facilita compartir recursos AWS compatibles entre cuentas de forma controlada. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado."},{"l":"C","t":"Amazon CloudWatch","why":"Incorrecta. Amazon CloudWatch: recopila métricas registros y alarmas para observar aplicaciones y recursos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado."},{"l":"D","t":"Service Control Policy (SCP)","why":"Incorrecta. Service Control Policy (SCP): establece el máximo conjunto de permisos posibles para cuentas en una organización. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0035","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Alta","text":"Una organización compara opciones en la nube: un equipo debe definir arquitectura y capacidades de plataforma para albergar aplicaciones migradas. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Perspectiva de seguridad de AWS CAF","why":"Incorrecta. Perspectiva de seguridad de AWS CAF: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se centra en construir y modernizar la plataforma tecnológica en la nube."},{"l":"B","t":"Perspectiva de operaciones de AWS CAF","why":"Incorrecta. Perspectiva de operaciones de AWS CAF: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se centra en construir y modernizar la plataforma tecnológica en la nube."},{"l":"C","t":"Perspectiva de gobernanza de AWS CAF","why":"Incorrecta. Perspectiva de gobernanza de AWS CAF: orienta transformación mediante gestión de riesgos carteras y control organizacional. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se centra en construir y modernizar la plataforma tecnológica en la nube."},{"l":"D","t":"Perspectiva de plataforma de AWS CAF","why":"Correcta. Perspectiva de plataforma de AWS CAF: se centra en construir y modernizar la plataforma tecnológica en la nube. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0036","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) un grupo de trabajo legal requiere descargar informes SOC de AWS para su auditoría; (2) un arquitecto busca documentar el análisis de riesgos frente a los seis pilares Well-Architected. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"AWS Firewall Manager + AWS Well-Architected Tool","why":"Incorrecta. NO cumple el requisito 1: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. cumple el requisito 2: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura."},{"l":"B","t":"AWS Artifact + AWS Systems Manager","why":"Incorrecta. cumple el requisito 1: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. NO cumple el requisito 2: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos."},{"l":"C","t":"AWS Artifact + AWS Well-Architected Tool","why":"Correcta. cumple el requisito 1: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. cumple el requisito 2: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura."},{"l":"D","t":"AWS Firewall Manager + AWS Systems Manager","why":"Incorrecta. NO cumple el requisito 1: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. NO cumple el requisito 2: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0037","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Alta","text":"Un cliente plantea esta situación: un desarrollador quiere plantear una duda técnica a una comunidad de expertos y usuarios AWS. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"AWS Basic Support","why":"Incorrecta. AWS Basic Support: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: comunidad de preguntas y respuestas técnicas sobre AWS."},{"l":"B","t":"AWS Business Support+","why":"Incorrecta. AWS Business Support+: plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: comunidad de preguntas y respuestas técnicas sobre AWS."},{"l":"C","t":"AWS Professional Services","why":"Incorrecta. AWS Professional Services: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: comunidad de preguntas y respuestas técnicas sobre AWS."},{"l":"D","t":"AWS re:Post","why":"Correcta. AWS re:Post: comunidad de preguntas y respuestas técnicas sobre AWS. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0038","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una plataforma transmite grandes volúmenes desde AWS a clientes de Internet y debe estimar cargos de egreso; (2) una plataforma con patrón estable busca descuentos por compromiso de capacidad de EC2 durante múltiples años. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Instancias reservadas (Reserved Instances)","why":"Correcta. Instancias reservadas (Reserved Instances) responde a la necesidad 2: proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años."},{"l":"B","t":"Savings Plans","why":"Incorrecta. Savings Plans ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"Dedicated Hosts","why":"Incorrecta. Dedicated Hosts: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Dedicated Instances","why":"Incorrecta. Dedicated Instances: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Transferencia de datos saliente","why":"Correcta. Transferencia de datos saliente responde a la necesidad 1: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso."}],"key":["A","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0039","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"Una empresa está evaluando AWS: una compañía debe replicar registros desde su base local a AWS con poca interrupción. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Amazon ElastiCache","why":"Incorrecta. Amazon ElastiCache: ofrece almacenes de caché en memoria administrados para disminuir latencia. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: migra o replica datos de bases con cambios mínimos y admite migraciones heterogéneas."},{"l":"B","t":"AWS DMS","why":"Correcta. AWS DMS: migra o replica datos de bases con cambios mínimos y admite migraciones heterogéneas. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon RDS","why":"Incorrecta. Amazon RDS: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: migra o replica datos de bases con cambios mínimos y admite migraciones heterogéneas."},{"l":"D","t":"Base de datos autoadministrada en EC2","why":"Incorrecta. Base de datos autoadministrada en EC2: permite al cliente instalar y controlar motor parches y configuración en una instancia. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: migra o replica datos de bases con cambios mínimos y admite migraciones heterogéneas."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0040","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una compañía migra una base de datos a un motor administrado manteniendo el diseño general; (2) una compañía deja su CRM instalado y contrata una alternativa SaaS. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Repurchasing (repurchase)","why":"Correcta. Repurchasing (repurchase) responde a la necesidad 2: reemplaza una solución existente por otro producto generalmente SaaS."},{"l":"B","t":"Replatforming (replatform)","why":"Correcta. Replatforming (replatform) responde a la necesidad 1: realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación."},{"l":"C","t":"AWS Migration Hub","why":"Incorrecta. AWS Migration Hub: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Refactoring (refactor)","why":"Incorrecta. Refactoring (refactor) rediseña significativamente la aplicación para aprovechar capacidades nativas de nube. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"Relocating (relocate)","why":"Incorrecta. Relocating (relocate): mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0041","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un repositorio requiere ejecutar compilación y pruebas automáticas al recibir cambios; (2) un sistema informático de pedidos requiere absorber picos y procesar tareas asincrónicas mediante colas. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"AWS Amplify + Amazon SQS","why":"Incorrecta. NO cumple el requisito 1: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios. cumple el requisito 2: desacopla componentes mediante colas de mensajes que consumidores recuperan."},{"l":"B","t":"AWS CodeBuild + AWS IoT Core","why":"Incorrecta. cumple el requisito 1: compila código ejecuta pruebas y produce artefactos en un entorno administrado. NO cumple el requisito 2: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube."},{"l":"C","t":"AWS Amplify + AWS IoT Core","why":"Incorrecta. NO cumple el requisito 1: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios. NO cumple el requisito 2: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube."},{"l":"D","t":"AWS CodeBuild + Amazon SQS","why":"Correcta. cumple el requisito 1: compila código ejecuta pruebas y produce artefactos en un entorno administrado. cumple el requisito 2: desacopla componentes mediante colas de mensajes que consumidores recuperan."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0042","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) Durante un nuevo proyecto, un analista compara tendencias de costo por servicio y cuenta durante los últimos meses; (2) un corporativo busca recibir una factura consolidada de sus diversas cuentas AWS. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Budgets","why":"Incorrecta. AWS Budgets: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Etiquetas de asignación de costos","why":"Incorrecta. Etiquetas de asignación de costos: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"AWS Cost Explorer","why":"Correcta. AWS Cost Explorer responde a la necesidad 1: visualiza y analiza costos y tendencias históricas y previstas mediante filtros."},{"l":"D","t":"AWS Cost Categories","why":"Incorrecta. AWS Cost Categories agrupa y clasifica líneas de costo usando reglas de negocio configuradas. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"Facturación consolidada de AWS Organizations","why":"Correcta. Facturación consolidada de AWS Organizations responde a la necesidad 2: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles."}],"key":["C","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0043","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una administradora quiere crear manualmente una instancia desde un navegador sin instalar herramientas. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"AWS Management Console","why":"Correcta. AWS Management Console: interfaz web gráfica para administrar servicios y recursos de AWS. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Outposts","why":"Incorrecta. AWS Outposts: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: interfaz web gráfica para administrar servicios y recursos de AWS."},{"l":"C","t":"AWS CLI","why":"Incorrecta. AWS CLI: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: interfaz web gráfica para administrar servicios y recursos de AWS."},{"l":"D","t":"Ubicación perimetral (edge location)","why":"Incorrecta. Ubicación perimetral (edge location): punto de presencia cercano a usuarios para entrega de contenido y ciertos servicios periféricos. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: interfaz web gráfica para administrar servicios y recursos de AWS."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0044","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un investigador requiere revisar metadatos de flujos IP aceptados o rechazados en interfaces. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Registros VPC Flow Logs","why":"Correcta. Registros VPC Flow Logs: capturan metadatos sobre tráfico

ad con alta disponibilidad."},{"id":"1.2","title":"AWS Well-Architected Framework","summary":"Seis pilares para evaluar decisiones arquitectónicas.","points":["Excelencia operativa: operar, observar, automatizar procesos y aprender continuamente.","Seguridad: proteger identidades, datos, sistemas y mantener trazabilidad.","Fiabilidad: recuperarse de fallos, cumplir demandas y continuar prestando servicio.","Eficiencia del rendimiento: usar los recursos adecuados y adaptarse a cambios tecnológicos.","Optimización de costos: evitar gastos innecesarios y medir el valor de cada recurso.","Sostenibilidad: reducir el impacto ambiental de las cargas de trabajo."],"trap":"Optimización de costos no es lo mismo que eficiencia del rendimiento; fiabilidad no equivale a seguridad."},{"id":"1.3","title":"Migración y Cloud Adoption Framework","summary":"7 R de migración, AWS CAF y herramientas de transferencia.","points":["Rehost: mover casi sin cambios; replatform: optimizar algunos componentes sin rediseñar el núcleo.","Refactor/re-architect: rediseñar una aplicación para aprovechar servicios o patrones nativos.","Repurchase: sustituir por una solución comercial/SaaS; retire: retirar; retain: mantener; relocate: trasladar infraestructura compatible.","AWS CAF ayuda a planear cambios en personas, procesos, gobierno, plataforma, seguridad y operaciones, no a migrar automáticamente recursos.","AWS DMS migra/replica datos de bases de datos; AWS SCT ayuda a convertir esquemas heterogéneos.","AWS DataSync transfiere datos entre almacenamientos; AWS Application Migration Service facilita migraciones de servidores."],"trap":"DMS mueve datos; SCT ayuda con conversiones de esquema. Repurchase ≠ replatform."},{"id":"1.4","title":"Economía de la nube","summary":"CapEx vs OpEx, costos y optimización.","points":["CapEx: inversión inicial en activos; OpEx: gasto operativo asociado al uso y servicios.","TCO incluye hardware, personal, energía, refrigeración, espacio, mantenimiento y licencias.","Rightsizing: dimensionar instancias y recursos según utilización para reducir sobreaprovisionamiento.","BYOL implica llevar licencias propias sujetas a condiciones; licencia incluida incorpora el cargo correspondiente.","Automatizar el apagado de recursos o ajustar capacidad puede reducir gasto, pero exige observar la demanda.","Los cargos de salida de datos, retención y solicitudes pueden alterar el costo total de almacenamiento."],"trap":"La nube no es automáticamente más barata: compara TCO y configuración real."},{"id":"2.1","title":"Responsabilidad compartida","summary":"AWS protege la infraestructura de la nube; el cliente protege lo que configura y ejecuta en ella.","points":["AWS: seguridad de la nube (instalaciones, hardware, virtualización y componentes administrados según servicio).","Cliente: datos, identidades, permisos, clasificaciones y configuración segura.","EC2: el cliente administra el sistema operativo invitado, paquetes y su aplicación.","RDS: AWS administra varios componentes de base de datos/infraestructura; el cliente administra accesos y datos.","Lambda: AWS administra infraestructura de ejecución; el cliente gestiona código, dependencias y configuración.","El alcance cambia según IaaS, servicios administrados o serverless: no desaparece la responsabilidad del cliente."],"trap":"Responsabilidad compartida no significa que AWS tenga que configurar tus políticas IAM o cifrado de la aplicación."},{"id":"2.2","title":"Seguridad, auditoría y cumplimiento","summary":"Evidencia, registros, postura y detección.","points":["CloudTrail: registra actividad de cuentas y llamadas a APIs para auditoría.","CloudWatch: métricas, logs operativos, alarmas y observabilidad; Config: historial de configuración y evaluación de cumplimiento.","AWS Artifact: acceso a documentación y acuerdos de cumplimiento emitidos por AWS.","GuardDuty: detección de actividad sospechosa/amenazas; Security Hub: agregación y priorización de hallazgos.","Amazon Inspector: evaluación de vulnerabilidades en recursos compatibles; Macie: detección y protección de datos sensibles en S3.","KMS: administración de claves de cifrado; AWS Secrets Manager: secretos y rotación; cifrado en tránsito protege comunicaciones."],"trap":"CloudTrail = quién hizo qué; Config = cómo cambió un recurso; CloudWatch = salud y alertas."},{"id":"2.3","title":"IAM e identidad","summary":"Autenticación, autorización y permisos mínimos.","points":["IAM users son identidades en una cuenta; grupos agregan usuarios; roles otorgan permisos asumibles con credenciales temporales.","Políticas IAM definen acciones, recursos y condiciones; una denegación explícita prevalece sobre permisos permitidos.","MFA agrega un segundo factor y es especialmente importante para la cuenta root.","IAM Identity Center centraliza el acceso de fuerza laboral a cuentas y aplicaciones, incluso mediante federación.","AWS Organizations + SCP limitan el máximo de permisos de cuentas miembros; una SCP por sí sola no concede permisos.","AWS STS emite credenciales temporales; Secrets Manager almacena secretos de aplicaciones."],"trap":"La política de confianza permite asumir un rol; una política de permisos determina qué puede hacer después."},{"id":"2.4","title":"Protección y herramientas de seguridad","summary":"Distinguir firewall, DDoS, hallazgos y recomendaciones.","points":["Security Group: firewall de recursos con estado (stateful); network ACL: control de subred sin estado (stateless).","AWS WAF inspecciona solicitudes HTTP(S) de aplicaciones web; AWS Shield ayuda a mitigar ataques DDoS.","AWS Firewall Manager centraliza administración de reglas/políticas en múltiples cuentas.","GuardDuty detecta amenazas a partir de señales; Inspector busca vulnerabilidades; Macie descubre datos sensibles en S3.","Trusted Advisor propone verificaciones y recomendaciones en áreas como seguridad, costos y límites, según acceso.","Marketplace ofrece productos de terceros; la documentación AWS y re:Post ayudan a investigar prácticas recomendadas."],"trap":"WAF no sustituye un grupo de seguridad; Shield no realiza la función de Macie."},{"id":"3.1","title":"Despliegue y operación de AWS","summary":"Consola, CLI, SDK, IaC y modelos híbridos.","points":["AWS Management Console: interfaz gráfica; AWS CLI: comandos; AWS SDK: acceso programático desde aplicaciones.","CloudFormation define infraestructura como código para crear recursos repetibles mediante plantillas.","IaC favorece consistencia, revisión y automatización en múltiples entornos.","Nube pública, infraestructura local e híbrida describen ubicación y combinación de recursos.","AWS Outposts extiende infraestructura/servicios AWS a entornos locales seleccionados.","Elastic Beanstalk simplifica el despliegue de aplicaciones sin administrar manualmente todas las capas de infraestructura."],"trap":"CloudFormation aprovisiona infraestructura; CloudTrail registra acciones; CodePipeline automatiza etapas de entrega."},{"id":"3.2","title":"Infraestructura global de AWS","summary":"Región, zona de disponibilidad y ubicación periférica.","points":["Región: zona geográfica de AWS con múltiples zonas de disponibilidad; elegirla influye en latencia, residencia de datos, precio y servicios disponibles.","Availability Zone: conjunto de centros de datos físicamente separados y con aislamiento para reducir fallos correlacionados.","Desplegar en varias AZ de una región mejora la alta disponibilidad ante caída de una zona.","Varias regiones permiten estrategias de recuperación ante desastres, requisitos de residencia y proximidad global.","Edge locations se usan para servicios globales de distribución/entrada (por ejemplo, CloudFront); no son AZ.","AWS Local Zones extienden ciertos servicios a áreas cercanas a usuarios para baja latencia."],"trap":"Una AZ no es una región. CloudFront utiliza edge; no significa que almacenes todos tus recursos en esas ubicaciones."},{"id":"3.3","title":"Cómputo y escalamiento","summary":"EC2, Lambda, contenedores, balanceadores y Auto Scaling.","points":["EC2 ofrece máquinas virtuales y control sobre SO/aplicación; elige familia de instancias según CPU, memoria, almacenamiento o GPU.","Lambda ejecuta código por eventos sin administrar servidores; no es una máquina virtual de uso general administrada por ti.","ECS orquesta contenedores con servicio de AWS; EKS usa Kubernetes administrado; Fargate proporciona capacidad serverless para contenedores.","EC2 Auto Scaling ajusta número de instancias de un grupo según demanda y políticas.","Elastic Load Balancing distribuye tráfico entre destinos; no crea capacidad por sí mismo.","Lightsail es una opción simplificada para cargas pequeñas con paquetes predecibles."],"trap":"Auto Scaling aumenta/reduce capacidad; Load Balancer reparte el tráfico existente."},{"id":"3.4","title":"Bases de datos y migración","summary":"Relacional, NoSQL, caché y migración.","points":["Amazon RDS: bases de datos relacionales administradas; Aurora: motor relacional compatible con MySQL/PostgreSQL.","DynamoDB: NoSQL llave-valor/documentos de baja latencia con operación administrada.","ElastiCache: caché en memoria, no sustituto automático de una base de datos persistente.","Redshift: almacén analítico columnar para consultas de análisis a gran escala.","RDS Multi-AZ favorece alta disponibilidad/conmutación; réplica de lectura puede descargar consultas, no es el mismo propósito.","DMS transfiere/replica datos; SCT facilita conversión de esquema entre motores diferentes."],"trap":"DynamoDB ≠ RDS; Redshift es analítica, no una base transaccional típica."},{"id":"3.5","title":"Redes y entrega de contenido","summary":"VPC, conectividad, DNS y globalización.","points":["VPC: red lógica aislada; subnet pública tiene ruta hacia Internet Gateway, pero no basta por sí sola para exponer una instancia.","Internet Gateway habilita conectividad a Internet cuando la ruta y las políticas la permiten; NAT Gateway permite salida desde subredes privadas.","Security Group es stateful a nivel de recurso; NACL es stateless a nivel de subnet.","Route 53: DNS y enrutamiento; CloudFront: distribución/caché de contenido en ubicaciones edge.","Direct Connect: enlace dedicado privado; Site-to-Site VPN: túnel cifrado sobre conexiones de red existentes.","Global Accelerator optimiza rutas globales hacia endpoints con IP anycast estáticas; no es una CDN de caché."],"trap":"CloudFront distribuye contenido; Global Accelerator optimiza conectividad hacia endpoints. NAT no recibe conexiones entrantes nuevas de Internet."},{"id":"3.6","title":"Opciones de almacenamiento","summary":"Objetos, bloques, archivos, copias y clases.","points":["Amazon S3: almacenamiento de objetos; usado para archivos, copias, contenidos y data lakes.","EBS: volúmenes de bloques para EC2 con persistencia independiente de la instancia dentro de la AZ; instance store: almacenamiento local efímero.","EFS: sistema de archivos NFS administrado para uso compartido entre instancias Linux.","Amazon FSx: sistemas de archivos administrados especializados (por ejemplo, Windows File Server, Lustre).","S3 Standard: acceso frecuente; Standard-IA: acceso infrecuente con costos de recuperación; One Zone-IA usa una sola AZ.","S3 Glacier Flexible Retrieval y Deep Archive favorecen archivo con tiempos de recuperación mayores; lifecycle puede transicionar objetos automáticamente.","AWS Backup centraliza políticas de copias; Storage Gateway integra almacenamiento local con AWS."],"trap":"S3 = objetos; EBS = bloques; EFS/FSx = archivos. Elige clase S3 considerando acceso, recuperación y resiliencia."},{"id":"3.7","title":"Datos, analítica e inteligencia artificial","summary":"Casos de uso sin confundir nombres.","points":["Athena: consultas SQL interactivas sobre datos en S3 sin aprovisionar servidores.","Glue: integración de datos y ETL; Kinesis: ingestión y procesamiento de flujos en tiempo real.","Amazon Quick: análisis, visualización e inteligencia empresarial (anteriormente QuickSight).","SageMaker AI: desarrollo y operación de modelos de machine learning; Bedrock: acceso a modelos fundacionales y capacidades de IA generativa administradas.","Comprehend: análisis de lenguaje natural; Rekognition: análisis de imágenes y video; Transcribe: voz a texto; Polly: texto a voz.","Lex: interfaces conversacionales; Textract: extracción de texto y estructura de documentos."],"trap":"Athena consulta; Glue prepara/transfiere; Kinesis recibe streaming. Rekognition analiza imágenes y Comprehend texto."},{"id":"3.8","title":"Integración, desarrollo y otras categorías","summary":"Mensajería, correo, automatización, escritorios e IoT.","points":["SQS desacopla productores y consumidores mediante colas; SNS distribuye notificaciones a suscriptores.","EventBridge conecta eventos de aplicaciones y servicios mediante reglas y buses de eventos.","SES envía correo a escala; Amazon Connect facilita centros de contacto.","CodeBuild ejecuta builds; CodePipeline orquesta fases CI/CD; X-Ray ayuda a analizar trazas distribuidas.","WorkSpaces ofrece escritorios virtuales; AppStream 2.0 transmite aplicaciones.","Amplify ayuda con aplicaciones web/móviles; IoT Core conecta y administra mensajería de dispositivos."],"trap":"SQS = cola con consumidores; SNS = publicación/suscripción; EventBridge = enrutamiento por reglas de eventos."},{"id":"4.1","title":"Modelos de precios","summary":"On-Demand, Savings Plans, Reserved, Spot y transferencias.","points":["On-Demand: flexibilidad de pago según uso, sin compromiso largo de capacidad.","Savings Plans: descuentos a cambio de compromiso de gasto de cómputo por 1 o 3 años.","Reserved Instances: descuento de facturación por compromiso; no implica necesariamente capacidad reservada.","Spot: capacidad EC2 no utilizada con ahorro y riesgo de interrupción; adecuada para cargas tolerantes.","Dedicated Hosts/Instances: aislamiento dedicado con diferencias de control y facturación.","Capacity Reservations reservan capacidad de EC2 en una AZ; no son automáticamente una estrategia de descuento.","Precios de S3 varían por clase, almacenamiento, solicitudes, recuperación y transferencia."],"trap":"Reserved Instance es principalmente beneficio de precio; Capacity Reservation es garantizar disponibilidad de capacidad."},{"id":"4.2","title":"Facturación, costos y presupuestos","summary":"Herramientas de análisis, proyección y asignación.","points":["AWS Cost Explorer: visualizar costos históricos, tendencias y proyecciones; AWS Budgets: establecer umbrales y alertas/acciones compatibles.","AWS Pricing Calculator: estimar costos previstos antes de desplegar.","Cost and Usage Report (CUR) entrega detalle granular para analizar consumo y cargos.","AWS Organizations facilita facturación consolidada y gobierno multi-cuenta.","Etiquetas de asignación de costos permiten atribuir gastos a proyectos o equipos tras activarlas según corresponda.","Free Tier no implica que toda cuenta o recurso sea gratuito; revisa condiciones y límites vigentes."],"trap":"Cost Explorer analiza gasto; Budgets alerta; Pricing Calculator estima un diseño futuro."},{"id":"4.3","title":"AWS Support y recursos de ayuda","summary":"Documentación, soporte, Health y socios.","points":["Basic Support incluye recursos de autoservicio y asistencia de cuenta/facturación; las opciones superiores amplían el soporte técnico según el plan.","La guía actual contempla Basic, Business Support+, Enterprise Support y Unified Operations; consulta condiciones vigentes antes de memorizar prestaciones.","AWS Health Dashboard comunica eventos que afectan a recursos/cuentas; Trusted Advisor emite recomendaciones de prácticas de operación.","AWS re:Post y Knowledge Center ofrecen información comunitaria y soluciones; AWS Support Center es el canal de casos de soporte.","Marketplace permite descubrir/adquirir software de terceros; AWS Partner Network agrupa socios e integradores.","AWS Trust & Safety recibe reportes de abuso de recursos; la documentación y whitepapers apoyan decisiones de arquitectura."],"trap":"AWS Health muestra eventos/afectaciones; Trusted Advisor evalúa recomendaciones. Los niveles de soporte pueden cambiar."}],"cheats":[{"id":"c1","domain":1,"title":"Elasticidad vs escalabilidad vs disponibilidad","tag":"Conceptos","rows":[["Escalabilidad","Capacidad de soportar crecimiento"],["Elasticidad","Ajuste dinámico a demanda variable"],["Alta disponibilidad","Servicio accesible pese a fallos"],["Tolerancia a fallos","Continúa operando ante fallos"],["Recuperación ante desastres","Restaurar operación tras incidente grave"]],"key":"Una solución puede escalar sin ser altamente disponible. Escalar automáticamente no es lo mismo que distribuir entre AZ."},{"id":"c2","domain":1,"title":"6 pilares de Well-Architected","tag":"Framework","rows":[["Operaciones","Ejecución, monitoreo y mejora"],["Seguridad","Proteger datos e identidades"],["Fiabilidad","Resistir y recuperarse de fallos"],["Rendimiento","Elegir recursos óptimos"],["Costos","Eliminar desperdicio"],["Sostenibilidad","Disminuir huella ambiental"]],"key":"Identifica la palabra dominante del escenario, no la solución técnica concreta."},{"id":"c3","domain":1,"title":"Migración: 7 R","tag":"Migración","rows":[["Rehost","Mover tal cual (lift and shift)"],["Replatform","Optimizar moderadamente"],["Refactor","Rediseñar la arquitectura"],["Repurchase","Sustituir por SaaS"],["Relocate","Trasladar plataforma compatible"],["Retain","No migrar por ahora"],["Retire","Eliminar aplicación"]],"key":"Replatform no cambia necesariamente la arquitectura central; refactor sí."},{"id":"c4","domain":1,"title":"TCO y optimización","tag":"Economía","rows":[["CapEx","Inversión inicial de capital"],["OpEx","Gasto operativo por uso"],["TCO","Costo total de propiedad"],["Rightsizing","Adecuar tamaño a demanda"],["BYOL","Traer licencia existente"],["Licencia incluida","Licencia integrada en precio"]],"key":"Considera personal, energía, licencias y transferencia de datos además del precio de instancias."},{"id":"c5","domain":2,"title":"Quién administra qué: EC2, RDS, Lambda","tag":"Responsabilidad","rows":[["EC2","Cliente: SO invitado, parches y aplicación"],["RDS","AWS: componentes del servicio; cliente: datos/accesos"],["Lambda","AWS: infraestructura; cliente: código/dependencias"],["Siempre cliente","IAM, clasificación y permisos de datos"],["Siempre AWS","Seguridad física e infraestructura subyacente"]],"key":"Mientras más administrado el servicio, menos mantenimiento de infraestructura; la protección de datos sigue recayendo en el cliente."},{"id":"c6","domain":2,"title":"CloudTrail vs CloudWatch vs Config","tag":"Observabilidad","rows":[["CloudTrail","¿Quién hizo qué y cuándo? API/auditoría"],["CloudWatch","¿Qué está pasando? métricas/logs/alertas"],["Config","¿Cómo estuvo configurado y qué cambió?"],["Artifact","Informes y acuerdos de cumplimiento"],["Security Hub","Hallazgos de seguridad agregados"]],"key":"Pregunta por API/identidad → CloudTrail. Alarma CPU → CloudWatch. Configuración histórica → Config."},{"id":"c7","domain":2,"title":"Servicios de seguridad: identificar la señal","tag":"Amenazas","rows":[["GuardDuty","Actividad sospechosa/amenazas"],["Macie","Datos sensibles en S3"],["Inspector","Vulnerabilidades en recursos compatibles"],["Security Hub","Consolida hallazgos de seguridad"],["WAF","Filtra HTTP(S) de aplicaciones web"],["Shield","Mitigación DDoS"],["KMS","Gestión de claves de cifrado"]],"key":"Macie no sustituye a GuardDuty y WAF no protege por sí solo los permisos de un bucket."},{"id":"c8","domain":2,"title":"IAM: identidad y permisos","tag":"Identidad","rows":[["Usuario IAM","Identidad persistente dentro de cuenta"],["Rol IAM","Credenciales temporales al asumir"],["Grupo IAM","Agrupa usuarios"],["Política de identidad","Define acciones/recurso/condiciones"],["SCP","Límite máximo de permisos en Organizations"],["Identity Center","Acceso centralizado a múltiples cuentas"]],"key":"Deny explícito gana. Una SCP restringe, no concede. Habilita MFA para proteger el acceso."},{"id":"c9","domain":3,"title":"Infraestructura global","tag":"Global","rows":[["Región","Área geográfica con AZ independientes"],["Availability Zone","Zona aislada en una región"],["Edge location","Entrega/entrada global cercana al usuario"],["Multi-AZ","Alta disponibilidad dentro de región"],["Multi-región","Recuperación, residencia y proximidad"],["Local Zones","Servicios cercanos para baja latencia"]],"key":"Este objetivo 3.2 no tiene reactivos etiquetados en el CSV importado; revísalo especialmente."},{"id":"c10","domain":3,"title":"EC2, Lambda, ECS, EKS, Fargate","tag":"Cómputo","rows":[["EC2","Máquina virtual con control de SO"],["Lambda","Función por evento serverless"],["ECS","Orquestador de contenedores AWS"],["EKS","Kubernetes administrado"],["Fargate","Cómputo serverless para contenedores"],["Auto Scaling","Ajusta cantidad de instancias"],["ELB","Distribuye tráfico a destinos"]],"key":"ECS/EKS orquestan; Fargate ejecuta contenedores sin administrar nodos."},{"id":"c11","domain":3,"title":"RDS, Aurora, DynamoDB y analytics","tag":"Bases de datos","rows":[["RDS","Relacional administrada"],["Aurora","Relacional compatible MySQL/PostgreSQL"],["DynamoDB","NoSQL clave-valor/documentos"],["ElastiCache","Caché en memoria"],["Redshift","Almacén analítico"],["DMS","Mueve/replica datos"],["SCT","Ayuda a convertir esquemas"]],"key":"Multi-AZ = alta disponibilidad; read replica = escalar lecturas. No son intercambiables."},{"id":"c12","domain":3,"title":"VPC y conectividad: servicios vecinos","tag":"Redes","rows":[["Internet Gateway","Salida/entrada pública con rutas"],["NAT Gateway","Salida de subredes privadas"],["Security Group","Firewall stateful de recursos"],["Network ACL","Firewall stateless de subnet"],["VPN","Túnel cifrado"],["Direct Connect","Conexión dedicada"],["Transit Gateway","Hub entre redes/VPC"]],"key":"En una respuesta de tráfico de retorno, NACL requiere permitir reglas en ambas direcciones; SG mantiene estado."},{"id":"c13","domain":3,"title":"CloudFront vs Route 53 vs Global Accelerator","tag":"Global","rows":[["Route 53","Resolución DNS y enrutamiento"],["CloudFront","CDN/cache de contenido en edge"],["Global Accelerator","Entrada global TCP/UDP e IP anycast"],["Local Zone","Cómputo cercano de baja latencia"],["Direct Connect","Enlace dedicado a AWS"]],"key":"IP estáticas y tráfico TCP global → Global Accelerator; caché web → CloudFront."},{"id":"c14","domain":3,"title":"S3 vs EBS vs EFS vs FSx","tag":"Almacenamiento","rows":[["S3","Objetos por API"],["EBS","Bloques persistentes para EC2"],["Instance store","Bloques locales efímeros"],["EFS","Archivos NFS compartidos Linux"],["FSx","Archivos administrados especializados"],["Storage Gateway","Puente con almacenamiento on-premises"],["AWS Backup","Orquestación de copias de seguridad"]],"key":"No montes S3 como si fuese el equivalente nativo de EBS; modelo de acceso distinto."},{"id":"c15","domain":3,"title":"Clases S3: elección rápida","tag":"Almacenamiento","rows":[["Standard","Acceso frecuente"],["Intelligent-Tiering","Patrones de acceso cambiantes"],["Standard-IA","Infrecuente, multi-AZ y recuperación tarifada"],["One Zone-IA","Infrecuente en una AZ"],["Glacier Instant Retrieval","Archivo con acceso inmediato"],["Glacier Flexible Retrieval","Recuperación flexible con espera"],["Glacier Deep Archive","Archivo a muy largo plazo, recuperación más lenta"]],"key":"No elijas solo por costo GB: considera duración mínima, solicitudes, recuperación y requisitos de resiliencia."},{"id":"c16","domain":3,"title":"Analítica e IA: servicio → verbo","tag":"Datos / IA","rows":[["Athena","Consultar S3 con SQL"],["Glue","Preparar/transformar datos (ETL)"],["Kinesis","Capturar flujos de eventos"],["Quick","Visualizar y analizar datos (BI)"],["SageMaker AI","Crear y operar modelos ML"],["Bedrock","Usar modelos fundacionales"],["Textract","Extraer datos de documentos"],["Comprehend","Analizar texto NLP"]],"key":"Textract = documentos, Rekognition = imágenes, Transcribe = voz a texto, Polly = texto a voz."},{"id":"c17","domain":3,"title":"Mensajería, integración y CI/CD","tag":"Integración","rows":[["SQS","Cola y desacoplamiento"],["SNS","Pub/Sub y notificaciones"],["EventBridge","Enrutamiento de eventos y reglas"],["SES","Envío de correo"],["CodeBuild","Construye y prueba"],["CodePipeline","Orquesta CI/CD"],["X-Ray","Trazas distribuidas"]],"key":"No confundas notificaciones a suscriptores (SNS) con tareas encoladas para consumidores (SQS)."},{"id":"c18","domain":4,"title":"Modelos de compra de EC2","tag":"Precios","rows":[["On-Demand","Flexible, sin compromiso prolongado"],["Savings Plans","Compromiso de gasto 1–3 años"],["Reserved Instances","Descuento por compromiso"],["Spot","Más barato y puede interrumpirse"],["Capacity Reservation","Reserva capacidad en AZ"],["Dedicated Host","Servidor físico dedicado"]],"key":"Reserved no garantiza capacidad salvo acuerdos/características aplicables; Capacity Reservation prioriza capacidad."},{"id":"c19","domain":4,"title":"Herramientas de costos","tag":"Facturación","rows":[["Pricing Calculator","Estimación previa al despliegue"],["Cost Explorer","Análisis histórico/forecast de gasto"],["AWS Budgets","Presupuestos y alertas"],["CUR","Datos granulares de costos y uso"],["Organizations","Cuentas, gobierno y facturación consolidada"],["Cost allocation tags","Clasificar y atribuir gastos"]],"key":"Si el caso pide avisar cuando se exceda un umbral → Budgets, no Cost Explorer."},{"id":"c20","domain":4,"title":"Soporte: qué recurso buscar","tag":"Soporte","rows":[["AWS Health","Estado/eventos que afectan recursos"],["Trusted Advisor","Checks y recomendaciones"],["Support Center","Abrir/gestionar casos"],["re:Post","Preguntas y respuestas comunitarias"],["AWS Artifact","Documentación de cumplimiento"],["Marketplace","Software y ofertas de terceros"],["APN","Red de socios AWS"]],"key":"Las categorías/nombres de soporte cambian. La guía CLF-C02 actual incluye Basic, Business Support+, Enterprise Support y Unified Operations."}],"meta":{"count":390,"objectiveCount":19,"generated":"2026-11-16","source":"aws-banco-preguntas.csv"}}</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('embedded-bank').textContent);
const BANK = DATA.questions, OBJ = DATA.objectives, CHEATS=DATA.cheats;
const NAMES={1:'Cloud Concepts',2:'Security and Compliance',3:'Cloud Technology and Services',4:'Billing, Pricing, and Support'};
const SHORT={1:'Conceptos',2:'Seguridad',3:'Tecnología',4:'Facturación'};
const WEIGHTS={1:24,2:30,3:34,4:12};
const DOC_BASE='https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/';
const DOCS={1:DOC_BASE+'cloud-practitioner-02-domain1.html',2:DOC_BASE+'cloud-practitioner-02-domain2.html',3:DOC_BASE+'cloud-practitioner-02-domain3.html',4:DOC_BASE+'cloud-practitioner-02-domain4.html'};
const MENU=[{id:'dashboard',icon:'◫',label:'Mi panel'},{id:'setup',icon:'◉',label:'Simulacros y práctica'},{id:'topics',icon:'▤',label:'Temario'},{id:'cheats',icon:'▦',label:'Cheatsheets'},{id:'history',icon:'▥',label:'Mi progreso'}];
const STORE_KEY='cloudprep-clfc02-v1';
const INITIAL={history:[],seen:[],completed:{},favorites:[],session:null};
let persistError=false;
function loadState(){try {let raw=localStorage.getItem(STORE_KEY); if(!raw)return structuredCloneSafe(INITIAL);let p=JSON.parse(raw);return {...structuredCloneSafe(INITIAL),...p}}catch(e){persistError=true;return structuredCloneSafe(INITIAL)}}
function structuredCloneSafe(x){return JSON.parse(JSON.stringify(x))}
let state=loadState();
let ui={page:state.session?'exam':'dashboard',mode:'exam',domain:'all',objective:'all',count:20,feedback:true,unseen:true,topicSearch:'',topicDomain:'all',cheatSearch:'',cheatDomain:'all',onlyFav:false,blur:false,reviewFilter:'wrong',report:null};
const el=document.getElementById('content');
const QMAP=new Map(BANK.map(q=>[q.id,q]));
const OMAP=new Map(OBJ.map(o=>[o.id,o]));
const countByObj={};BANK.forEach(q=>{countByObj[q.objective]=(countByObj[q.objective]||0)+1});
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=(a,b)=>b?Math.round(100*a/b):0;
function rnd(xs){let a=xs.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));persistError=false;let lbl=document.getElementById('saveState');if(lbl)lbl.textContent='● Guardado local'}catch(e){persistError=true;let lbl=document.getElementById('saveState');if(lbl)lbl.textContent='⚠ Sin guardado persistente'}}
let toastJob;function toast(s){let d=document.getElementById('toast');d.textContent=s;d.classList.add('show');clearTimeout(toastJob);toastJob=setTimeout(()=>d.classList.remove('show'),3300)}
function humanDate(ms){return new Date(ms).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}
function humanTime(sec){let m=Math.floor(sec/60);return `${m} min ${sec%60} s`}
function docLink(domain,label='Documentación oficial ↗'){return `<a href="${DOCS[domain]}" target="_blank" rel="noopener noreferrer">${E(label)}</a>`}
function heading(title,subtitle,right=''){return `<div class="view-title"><div><div class="eyebrow">AWS CLOUD PRACTITIONER · CLF-C02</div><h1>${E(title)}</h1><p>${subtitle}</p></div>${right}</div>`}
function badge(text,kind=''){return `<span class="tag ${kind}">${E(text)}</span>`}

function bar(value,kind=''){return `<div class="bar ${kind}"><span style="width:${Math.min(100,Math.max(0,value))}%"></span></div>`}

function setup(){let missed=latestMisses().length,selected=ui.mode;let possible=selected==='missed'?latestMisses().map(id=>QMAP.get(id)).filter(q=>q&&(ui.domain==='all'||String(q.domain)===ui.domain)&&(ui.objective==='all'||q.objective===ui.objective)).length:selected==='exam'?BANK.length:BANK.filter(q=>(ui.domain==='all'||String(q.domain)===ui.domain)&&(ui.objective==='all'||q.objective===ui.objective)).length;let opts=OBJ.filter(o=>ui.domain==='all'||o.id.startsWith(ui.domain+'.'));let countOptions=[...new Set([10,20,35,50,65,100,ui.count])].sort((a,b)=>a-b);

function selectFrom(pool,num){let a=rnd(pool);if(!ui.unseen)return a.slice(0,num);let seen=new Set(state.seen);return rnd(a.filter(q=>!seen.has(q.id))).concat(rnd(a.filter(q=>seen.has(q.id)))).slice(0,num)}
function startSession(forceMode=null){let mode=forceMode||ui.mode,qs=[];
if(mode==='exam'){for(let [d,n] of [[1,16],[2,19],[3,22],[4,8]]) qs.push(...selectFrom(BANK.filter(q=>q.domain===d),n));qs=rnd(qs)}
else if(mode==='missed'){qs=selectFrom(latestMisses().map(id=>QMAP.get(id)).filter(q=>q&&(ui.domain==='all'||String(q.domain)===ui.domain)&&(ui.objective==='all'||q.objective===ui.objective)),ui.count)}
else{qs=selectFrom(BANK.filter(q=>(ui.domain==='all'||String(q.domain)===ui.domain)&&(ui.objective==='all'||q.objective===ui.objective)),ui.count)}
if(!qs.length){toast('No hay preguntas para esa selección.');return}
if(state.session && !confirm('¿Descartar la sesión sin terminar e iniciar otra?'))return;
let now=Date.now();state.session={id:'att-'+now,mode,ids:qs.map(q=>q.id),answers:{},flags:[],checked:[],cursor:0,startedAt:now,deadline:mode==='exam'?now+90*60*1000:null,feedback:mode==='practice'&&ui.feedback};persist();go('exam');toast(mode==='exam'?'Simulacro iniciado. ¡Éxito!':'Sesión de práctica iniciada.');}
function sQuestion(){let s=state.session;return s?QMAP.get(s.ids[s.cursor]):null}
function answered(q,s=state.session){return (s.answers[q.id]||[]).length>0}

let q=sQuestion(),selected=s.answers[q.id]||[],tested=s.checked.includes(q.id),isMulti=q.key.length>1;
let nAns=s.ids.filter(id=>(s.answers[id]||[]).length).length;
let nFlag=s.flags.length;
return `<div class="view-title"><div><div class="eyebrow">${s.mode==='exam'?'SIMULACRO CRONOMETRADO':s.mode==='missed'?'REPASO DE ERRORES':'PRÁCTICA GUIADA'}</div><h1>${s.mode==='exam'?'Examen de práctica CLF-C02':'Sesión de aprendizaje'}</h1><p>${s.mode==='exam'?'Responde todas las preguntas que puedas. Las explicaciones aparecen después de entregar.':'Revisa cada caso y afianza los conceptos con el temario.'}</p></div>${s.deadline?`<span class="timer" id="timer" aria-label="Tiempo restante">◷ 90:00</span>`:badge('Sin límite de tiempo','good')}</div>
<div class="exam-layout"><div class="card exam-card"><div class="exam-progress"><div class="row wrap">${badge('Pregunta '+(s.cursor+1)+' / '+s.ids.length,'amber')}${badge('D'+q.domain+' · '+q.objective)}${badge(q.difficulty)}</div>${button('flag',s.flags.includes(q.id)?'⚑ Marcada':'⚐ Marcar','btn sm')}</div>${bar(pct(nAns,s.ids.length),'teal')}<h2 class="exam-h">${E(q.text)}</h2><p class="hint">${isMulti?`Selecciona exactamente <b>${q.key.length}</b> respuestas (de ${q.options.length}).`:'Selecciona una respuesta (de cuatro).'}</p>
<div class="answer-list">${q.options.map(o=>{let isSel=selected.includes(o.l),isRight=q.key.includes(o.l);let k=tested?(isRight?'right':isSel?'wrong':''):(isSel?'selected':'');return `<button type="button" class="answer ${k}" data-action="answer" data-letter="${o.l}" aria-pressed="${isSel}" ${tested?'disabled':''}><span class="letter">${o.l}</span><span class="answer-text">${E(o.t)}</span><span aria-hidden="true">${isSel?'●':'○'}</span></button>`}).join('')}</div>

<div class="exam-foot"><div class="row wrap">${button('previous','← Anterior','btn',s.cursor===0?'disabled':'')}${button('next','Siguiente →','btn',s.cursor===s.ids.length-1?'disabled':'')}</div><div class="row wrap">${s.feedback&&!tested?button('check','Comprobar respuesta','btn soft',selected.length!==q.key.length?'disabled':''):''}${button('finish','Finalizar '+(s.mode==='exam'?'simulacro':'práctica'),'btn primary')}</div></div><div class="hint" style="margin-top:15px">Atajos: ${['1–6','F','← / →'].map(x=>`<kbd class="kbd">${x}</kbd>`).join(' ')} · opciones, marcar y navegar. ${s.mode==='exam'?'No hay retroalimentación antes de entregar.':''}</div></div>

function updateTimer(){let s=state.session;if(!s || !s.deadline)return;let diff=s.deadline-Date.now();let clock=document.getElementById('timer');if(diff<=0){finishSession(true);return}if(clock){let t=Math.ceil(diff/1000),m=Math.floor(t/60),sec=t%60;clock.textContent=`◷ ${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;clock.classList.toggle('urgent',t<300)}}
function finishSession(auto=false){let s=state.session;if(!s)return;let missing=s.ids.filter(id=>(s.answers[id]||[]).length===0).length;if(!auto && !confirm(`¿Entregar sesión? ${missing} pregunta(s) sin respuesta se contarán como incorrectas.`))return;
let correct=0,per={};for(let id of s.ids){let q=QMAP.get(id);let d=q.domain;if(!per[d])per[d]={ok:0,total:0};per[d].total++;if(equalSet(s.answers[id]||[],q.key)){correct++;per[d].ok++}}
let now=Date.now();let h={id:s.id,when:now,mode:s.mode,ids:s.ids,answers:s.answers,flags:s.flags,correct,per,elapsed:Math.max(1,Math.floor((now-s.startedAt)/1000)),timedOut:!!auto};state.history.unshift(h);state.history=state.history.slice(0,70);state.seen=[...new Set([...state.seen,...s.ids])];state.session=null;ui.report=h;ui.reviewFilter='wrong';persist();go('results');if(auto)toast('Tiempo agotado. Simulacro entregado automáticamente.')}
function results(){let h=ui.report||state.history[0];if(!h)return heading('Resultados','Aún no has completado una sesión.')+`<div class="empty">${button('nav','Iniciar simulacro','btn primary','data-page="setup"')}</div>`;
let n=h.ids.length,wrong=n-h.correct,unanswered=h.ids.filter(id=>!(h.answers[id]||[]).length).length,score=pct(h.correct,n);
return heading('Resultados de tu sesión','Revisa qué respondió el banco, por qué cada alternativa es correcta o incorrecta y qué objetivo conviene reforzar.',button('nav','Nueva sesión','btn primary','data-page="setup"'))+
`<div class="card score-card"><div class="donut" style="--pct:${score}"><div>${score}%<small>acierto bruto</small></div></div><div style="flex:1;min-width:225px"><div class="row wrap">${badge(h.mode==='exam'?'Simulacro':'Práctica','amber')}${badge(h.timedOut?'Tiempo agotado':'Entregada')}</div><h2 style="margin-top:12px">${score>=85?'Buen rendimiento: revisa los detalles.':score>=70?'Hay una base sólida; refuerza los errores.':'Prioriza el repaso antes del próximo intento.'}</h2><div class="result-numbers"><span><strong>${h.correct}</strong> correctas</span><span><strong>${wrong}</strong> incorrectas</span><span><strong>${unanswered}</strong> en blanco</span><span><strong>${humanTime(h.elapsed)}</strong> duración</span></div><p class="hint">Porcentaje de práctica, no equivalente al puntaje escalado oficial de aprobación (700/1000).</p></div></div>

<div class="toolbar"><div class="tabs">${[['wrong','Errores'],['all','Todas'],['correct','Correctas'],['flagged','Marcadas']].map(([f,label])=>`<button class="tab ${ui.reviewFilter===f?'active':''}" data-action="review-filter" data-filter="${f}">${label}</button>`).join('')}</div></div><div id="reviewList">${reviewList(h)}</div>`}
function reviewList(h){let rows=h.ids.map((id,i)=>({q:QMAP.get(id),i,ans:h.answers[id]||[]})).filter(x=>ui.reviewFilter==='all'||(ui.reviewFilter==='wrong'&&!equalSet(x.ans,x.q.key))||(ui.reviewFilter==='correct'&&equalSet(x.ans,x.q.key))||(ui.reviewFilter==='flagged'&&h.flags.includes(x.q.id)));
if(!rows.length)return `<div class="empty"><span class="empty-ico">✓</span><strong>No hay preguntas en este filtro.</strong>Prueba otra categoría.</div>`;
return rows.map(({q,i,ans})=>{let ok=equalSet(ans,q.key);return `<details class="review-item"><summary><span class="domain-num" style="font-size:11px">${i+1}</span><div style="flex:1"><div class="row wrap" style="margin-bottom:7px">${badge(ok?'Correcta':ans.length?'Incorrecta':'Sin responder',ok?'good':'bad')}${badge('D'+q.domain+' · '+q.objective)}${h.flags.includes(q.id)?badge('Marcada','amber'):''}</div><div style="font-weight:650">${E(q.text)}</div></div></summary><div class="review-content"><div class="hint">Tu selección: <b>${ans.join(', ')||'—'}</b> · Respuesta: <b>${q.key.join(', ')}</b></div>${q.options.map(o=>`<div class="review-choice ${q.key.includes(o.l)?'iscorrect':ans.includes(o.l)?'iswrong':''}"><b>${o.l}. ${E(o.t)}</b> ${q.key.includes(o.l)?badge('Correcta','good'):ans.includes(o.l)?badge('Tu elección','bad'):''}<p>${E(o.why)}</p></div>`).join('')}<div class="mini-footer">${button('open-objective','Repasar objetivo '+q.objective,'btn sm','data-objective="'+q.objective+'"')}${docLink(q.domain)}</div></div></details>`}).join('')}
function topics(){return heading('Temario oficial','19 objetivos distribuidos en cuatro dominios. Abre cualquier objetivo para estudiar los conceptos y los errores frecuentes.',`<div class="tag good">${OBJ.filter(o=>state.completed[o.id]).length}/19 repasados</div>`)+`<div class="toolbar"><input class="search" id="topicSearch" type="search" placeholder="Buscar servicios, conceptos u objetivos…" aria-label="Buscar en el temario" value="${E(ui.topicSearch)}"><div class="tabs">${[['all','Todos'],['1','D1'],['2','D2'],['3','D3'],['4','D4']].map(([v,l])=>`<button class="tab ${ui.topicDomain===v?'active':''}" data-action="topic-filter" data-domain="${v}">${l}</button>`).join('')}</div></div><div class="alert info" style="margin-bottom:21px">${BANK.length} preguntas importadas. <strong>Objetivo 3.2:</strong> 0 preguntas clasificadas en el CSV; su contenido de repaso sí está disponible.</div><div id="topicList">${topicList()}</div>`}
function topicList(){let search=ui.topicSearch.trim().toLocaleLowerCase('es-MX');let os=OBJ.filter(o=>(ui.topicDomain==='all'||o.id.startsWith(ui.topicDomain+'.'))&&(!search||[o.id,o.title,o.summary,o.trap,...o.points].join(' ').toLocaleLowerCase('es-MX').includes(search)));if(!os.length)return `<div class="empty"><strong>Sin coincidencias</strong>Prueba otro término.</div>`;
return [1,2,3,4].map(d=>{let items=os.filter(o=>o.id.startsWith(d+'.'));if(!items.length)return '';return `<div class="section-line"><h2>D${d} · ${E(NAMES[d])}</h2><span class="hint">${WEIGHTS[d]}% en el examen · ${docLink(d,'Fuente ↗')}</span></div><div class="topic-list">${items.map(o=>{let count=countByObj[o.id]||0;return `<details class="topic-card" id="objective-${o.id}"><summary><div class="row spread">${badge('OBJETIVO '+o.id,'amber')}${state.completed[o.id]?badge('✓ Repasado','good'):badge(count+' preguntas',count?'':'bad')}</div><div class="summary-title">${E(o.title)}</div><div class="hint">${E(o.summary)}</div></summary><div class="topic-body"><ul class="learn-list">${o.points.map(point=>`<li>${E(point)}</li>`).join('')}</ul><div class="trap"><b>Trampa frecuente:</b> ${E(o.trap)}</div><div class="mini-footer"><label class="row hint"><input type="checkbox" data-complete="${o.id}" ${state.completed[o.id]?'checked':''} style="width:18px;height:18px;accent-color:var(--teal)"> Objetivo repasado</label>${button('practice-objective',count?'Practicar '+count+' preguntas':'Sin preguntas en el banco','btn sm',`data-objective="${o.id}" ${count?'':'disabled'}`)}</div></div></details>`}).join('')}</div>`}).join('')}
function cheats(){return heading('Cheatsheets','20 fichas de consulta rápida: servicios similares, palabras clave, casos de uso y errores habituales.',`<div class="row wrap">${button('blur','◉ '+(ui.blur?'Mostrar respuestas':'Ocultar definiciones'),'btn sm')}${button('print','⎙ Imprimir fichas abiertas','btn sm')}</div>`)+
`<div class="toolbar"><input class="search" id="cheatSearch" type="search" placeholder="Buscar comparaciones, servicios…" aria-label="Buscar cheatsheets" value="${E(ui.cheatSearch)}"><div class="tabs">${[['all','Todas'],['1','D1'],['2','D2'],['3','D3'],['4','D4'],['fav','★']].map(([v,l])=>`<button class="tab ${ui.cheatDomain===v?'active':''}" data-action="cheat-filter" data-domain="${v}">${l}</button>`).join('')}</div></div><p class="hint">Tip de recuerdo activo: activa <b>Ocultar definiciones</b> antes de desplegar una tarjeta. Haz clic en una definición para revelarla.</p><div id="cheatList">${cheatList()}</div>`}
function cheatList(){let search=ui.cheatSearch.trim().toLocaleLowerCase('es-MX');let items=CHEATS.filter(c=>(ui.cheatDomain==='all'||(ui.cheatDomain==='fav'?state.favorites.includes(c.id):String(c.domain)===ui.cheatDomain))&&(!search||[c.title,c.tag,c.key,...c.rows.flat()].join(' ').toLocaleLowerCase('es-MX').includes(search)));if(!items.length)return `<div class="empty"><strong>No hay fichas en esta vista.</strong>Cambia el filtro de búsqueda.</div>`;
return `<div class="cheat-list">${items.map(c=>`<details class="cheat"><summary><div class="row spread">${badge('D'+c.domain+' · '+c.tag,'amber')}<button type="button" class="favorite ${state.favorites.includes(c.id)?'active':''}" data-action="favorite" data-id="${c.id}" aria-label="${state.favorites.includes(c.id)?'Quitar de':'Añadir a'} favoritos">${state.favorites.includes(c.id)?'★':'☆'}</button></div><h3>${E(c.title)}</h3><div class="hint">${c.rows.length} conceptos · abrir ficha</div></summary><div class="cheat-body"><table class="cheat-table"><tbody>${c.rows.map(([name,val])=>`<tr><td>${E(name)}</td><td><span class="cheat-value ${ui.blur?'blur-answer':''}" data-action="reveal" title="Mostrar u ocultar esta definición" style="cursor:pointer">${E(val)}</span></td></tr>`).join('')}</tbody></table><div class="cheat-recall"><b>Recuerda:</b> ${E(c.key)}</div></div></details>`).join('')}</div>`}
function history(){let hist=state.history,missed=latestMisses();let avg=hist.length?Math.round(hist.reduce((x,h)=>x+pct(h.correct,h.ids.length),0)/hist.length):0;
let per={};for(let h of hist){for(let id of h.ids){let q=QMAP.get(id);if(!per[q.objective])per[q.objective]={ok:0,total:0};per[q.objective].total++;if(equalSet(h.answers[id]||[],q.key))per[q.objective].ok++}}
return heading('Progreso personal','Historial de sesiones, objetivos con dificultades, respaldos de tus datos y gestión del avance.')+
`<section class="grid grid4"><div class="card"><div class="metric-label">Sesiones completadas</div><div class="metric">${hist.length}</div></div><div class="card"><div class="metric-label">Promedio simple de aciertos</div><div class="metric">${hist.length?avg+'%':'—'}</div></div><div class="card"><div class="metric-label">Banco utilizado</div><div class="metric">${pct(new Set(state.seen).size,BANK.length)}%</div></div><div class="card"><div class="metric-label">Preguntas en repaso</div><div class="metric">${missed.length}</div></div></section>
<div class="grid grid2" style="margin-top:18px"><section class="card"><div class="card-head"><h3>Historial</h3>${button('export-progress','⇩ Exportar progreso','btn sm')}</div>${hist.length?hist.slice(0,20).map(h=>`<div class="history-row"><div><b>${h.mode==='exam'?'Simulacro':'Práctica'} · ${h.ids.length} preguntas</b><div class="history-date">${humanDate(h.when)} · ${humanTime(h.elapsed)}</div></div><div class="row"><span class="history-score">${pct(h.correct,h.ids.length)}%</span>${button('review-history','Revisar','btn sm','data-id="'+h.id+'"')}</div></div>`).join(''):`<div class="empty"><strong>Aún no hay sesiones</strong>Completa un simulacro para construir tu historial.</div>`}</section>
<section class="stack"><div class="card"><h3 style="margin-bottom:17px">Objetivos que requieren atención</h3>${Object.entries(per).sort((a,b)=>pct(a[1].ok,a[1].total)-pct(b[1].ok,b[1].total)).slice(0,6).map(([id,r])=>`<div style="margin-bottom:15px"><div class="row spread" style="margin-bottom:7px"><span class="hint">${id} · ${E(OMAP.get(id)?.title||'')}</span><b>${pct(r.ok,r.total)}%</b></div>${bar(pct(r.ok,r.total),pct(r.ok,r.total)>=80?'teal':'red')}</div>`).join('')||'<p class="hint">Los objetivos aparecerán después de practicar.</p>'}${missed.length?button('retry-missed','Repasar errores actuales','btn primary full'):''}</div><div class="card"><h3 style="margin-bottom:16px">Tu información</h3><p class="hint">El progreso se almacena en este navegador y en este origen de archivo. Al borrar datos del navegador o abrirlo en otro dispositivo, podría no aparecer.</p><div class="stack">${button('export-progress','Exportar progreso (.json)','btn full')}<label class="btn full" for="importProgress">Importar progreso (.json)</label><input id="importProgress" type="file" accept=".json,application/json" style="display:none">${button('reset-seen','Reiniciar historial de preguntas usadas','btn full')}${button('reset-all','Borrar todo el progreso','btn danger full')}</div></div></section></div><div class="footer">Las estadísticas proceden de este banco, no del sistema de puntuación de AWS. Los datos se almacenan localmente; no hay cuenta ni sincronización.</div>`}
function scrollObjective(id){ui.topicDomain=id.split('.')[0];ui.topicSearch='';go('topics');let x=document.getElementById('objective-'+id);if(x){x.open=true;setTimeout(()=>x.scrollIntoView({behavior:'smooth',block:'start'}),30)}}
function toggleAnswer(letter){let s=state.session;if(!s)return;let q=sQuestion();if(s.checked.includes(q.id))return;let a=(s.answers[q.id]||[]).slice();if(q.key.length===1)a=[letter];else if(a.includes(letter))a=a.filter(c=>c!==letter);else if(a.length<q.key.length)a.push(letter);else{toast('Ya seleccionaste '+q.key.length+' opciones. Deselecciona una para cambiar.');return}if(a.length)s.answers[q.id]=a;else delete s.answers[q.id];persist();render()}
function checkAnswer(){let s=state.session;if(!s)return;let q=sQuestion();if(!s.feedback)return;if((s.answers[q.id]||[]).length!==q.key.length){toast('Selecciona exactamente '+q.key.length+' alternativas.');return}s.checked.push(q.id);persist();render()}
function nextQuestion(delta){let s=state.session;if(!s)return;s.cursor=Math.max(0,Math.min(s.ids.length-1,s.cursor+delta));persist();render();window.scrollTo({top:0,behavior:'instant'})}
function handleClick(e){let node=e.target.closest('[data-action]');if(!node)return;let action=node.dataset.action;
if(action==='reveal'){node.classList.toggle('blur-answer');return}
if(action==='favorite'){e.preventDefault();let id=node.dataset.id;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();node.textContent=state.favorites.includes(id)?'★':'☆';node.classList.toggle('active',state.favorites.includes(id));return}
if(action==='nav'){go(node.dataset.page);return}
if(action==='quick-exam'){startSession('exam');return}
if(action==='quick-practice'){ui.mode='practice';ui.domain='all';ui.objective='all';ui.count=20;ui.feedback=true;startSession('practice');return}
if(action==='mode'){ui.mode=node.dataset.mode;render();return}
if(action==='start'){startSession();return}
if(action==='resume'){go('exam');return}
if(action==='answer'){toggleAnswer(node.dataset.letter);return}
if(action==='flag'){let s=state.session;if(!s)return;let id=s.ids[s.cursor];s.flags=s.flags.includes(id)?s.flags.filter(x=>x!==id):[...s.flags,id];persist();render();return}
if(action==='previous'){nextQuestion(-1);return}
if(action==='next'){nextQuestion(1);return}
if(action==='jump'){let s=state.session;if(!s)return;s.cursor=Number(node.dataset.index);persist();render();window.scrollTo({top:0,behavior:'instant'});return}
if(action==='check'){checkAnswer();return}
if(action==='finish'){finishSession();return}
if(action==='retry-missed'){ui.mode='missed';ui.count=Math.max(1,Math.min(latestMisses().length,20));ui.domain='all';ui.objective='all';ui.unseen=false;startSession('missed');return}
if(action==='retry-result-wrong'){let h=ui.report||state.history[0];if(!h)return;let ids=h.ids.filter(id=>!equalSet(h.answers[id]||[],QMAP.get(id).key));startIds(ids);return}
if(action==='review-filter'){ui.reviewFilter=node.dataset.filter;document.querySelectorAll('[data-action="review-filter"]').forEach(b=>b.classList.toggle('active',b.dataset.filter===ui.reviewFilter));document.getElementById('reviewList').innerHTML=reviewList(ui.report||state.history[0]);return}
if(action==='review-history'){ui.report=state.history.find(h=>h.id===node.dataset.id)||null;ui.reviewFilter='wrong';go('results');return}
if(action==='topic-filter'){ui.topicDomain=node.dataset.domain;document.querySelectorAll('[data-action="topic-filter"]').forEach(b=>b.classList.toggle('active',b.dataset.domain===ui.topicDomain));document.getElementById('topicList').innerHTML=topicList();return}
if(action==='topic-domain'){ui.topicDomain=node.dataset.domain;ui.topicSearch='';go('topics');return}
if(action==='practice-objective'){ui.mode='practice';ui.objective=node.dataset.objective;ui.domain=ui.objective.split('.')[0];ui.count=Math.min(20,countByObj[ui.objective]||20);ui.feedback=true;go('setup');return}
if(action==='open-objective'){scrollObjective(node.dataset.objective);return}
if(action==='cheat-filter'){ui.cheatDomain=node.dataset.domain;document.querySelectorAll('[data-action="cheat-filter"]').forEach(b=>b.classList.toggle('active',b.dataset.domain===ui.cheatDomain));document.getElementById('cheatList').innerHTML=cheatList();return}
if(action==='blur'){ui.blur=!ui.blur;render();return}
if(action==='print'){window.print();return}
if(action==='export-progress'){exportProgress();return}
if(action==='reset-seen'){if(confirm('¿Permitir que todos los reactivos vuelvan a considerarse no utilizados? El historial se conservará.')){state.seen=[];persist();render();toast('Marcadores de uso reiniciados.')}return}
if(action==='reset-all'){if(confirm('¿Eliminar historial, sesiones y objetivos repasados de este navegador? No se puede deshacer.')){state=structuredCloneSafe(INITIAL);ui.report=null;persist();go('dashboard');toast('Progreso local borrado.')}return}
}
function startIds(ids){if(!ids.length)return toast('Esta sesión no tiene errores.');if(state.session&&!confirm('¿Reemplazar la sesión actual?'))return;let t=Date.now();state.session={id:'att-'+t,mode:'missed',ids:rnd(ids),answers:{},flags:[],checked:[],cursor:0,startedAt:t,deadline:null,feedback:true};persist();go('exam')}
function exportProgress(){let data={format:'cloudprep-progress',version:1,exportedAt:new Date().toISOString(),bankSize:BANK.length,progress:state};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let link=document.createElement('a');link.href=url;link.download='aws-clf-c02-progreso-'+new Date().toISOString().slice(0,10)+'.json';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Respaldo exportado.')}
async function importProgress(input){let file=input.files?.[0];if(!file)return;try{if(file.size>15e6)throw Error('Archivo demasiado grande.');let data=JSON.parse(await file.text());if(data.format!=='cloudprep-progress'||data.version!==1||!data.progress||!Array.isArray(data.progress.history))throw Error('Formato de respaldo no reconocido.');if(!confirm('¿Reemplazar el progreso local por el contenido del respaldo?'))return;let p=data.progress;state={history:p.history.filter(h=>Array.isArray(h.ids)&&h.ids.every(id=>QMAP.has(id))).slice(0,70),seen:Array.isArray(p.seen)?p.seen.filter(id=>QMAP.has(id)):[],completed:p.completed&&typeof p.completed==='object'?p.completed:{},favorites:Array.isArray(p.favorites)?p.favorites.filter(id=>CHEATS.some(c=>c.id===id)):[],session:null};ui.report=null;persist();go('history');toast('Progreso importado. La sesión en curso no se restaura desde respaldos.')}catch(e){toast('No se pudo importar: '+e.message)}finally{input.value=''}}
function handleChange(e){let t=e.target;if(t.id==='importProgress'){importProgress(t);return}if(t.dataset.complete){state.completed[t.dataset.complete]=t.checked;persist();toast(t.checked?'Objetivo marcado como repasado.':'Objetivo desmarcado.');return}if(!t.dataset.setting)return;let setting=t.dataset.setting;if(setting==='feedback'||setting==='unseen')ui[setting]=t.checked;else if(setting==='count')ui.count=Number(t.value);else if(setting==='domain'){ui.domain=t.value;ui.objective='all';}else if(setting==='objective')ui.objective=t.value;render()}
function handleSearch(e){let t=e.target;if(t.id==='topicSearch'){ui.topicSearch=t.value;document.getElementById('topicList').innerHTML=topicList()}if(t.id==='cheatSearch'){ui.cheatSearch=t.value;document.getElementById('cheatList').innerHTML=cheatList()}}
function handleKey(e){let tag=(e.target.tagName||'').toLowerCase();if(['input','textarea','select'].includes(tag)||e.altKey||e.ctrlKey||e.metaKey)return;if(ui.page!=='exam'||!state.session)return;if(e.key.toLowerCase()==='f'){e.preventDefault();let s=state.session,id=s.ids[s.cursor];s.flags=s.flags.includes(id)?s.flags.filter(x=>x!==id):[...s.flags,id];persist();render()}else if(e.key==='ArrowLeft'){e.preventDefault();nextQuestion(-1)}else if(e.key==='ArrowRight'){e.preventDefault();nextQuestion(1)}else if(/^[1-6]$/.test(e.key)){let q=sQuestion(),ix=Number(e.key)-1;if(q.options[ix]){e.preventDefault();toggleAnswer(q.options[ix].l)}}}
document.addEventListener('click',handleClick);document.addEventListener('change',handleChange);document.addEventListener('input',handleSearch);document.addEventListener('keydown',handleKey);
setInterval(()=>{if(state.session?.deadline){if(ui.page==='exam')updateTimer();else if(state.session.deadline<=Date.now())finishSession(true)}},1000);
render();
</script>
</body>
</html>

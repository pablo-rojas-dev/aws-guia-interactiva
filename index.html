quisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Secrets Manager","why":"Incorrecta. AWS Secrets Manager: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: muestra eventos de salud de servicios y eventos que pueden afectar recursos de la cuenta."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0306","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una compañía busca atenuar inundaciones volumétricas de tráfico contra una plataforma; (2) un portal web busca bloquear solicitudes HTTP maliciosas dirigidas a una plataforma pública. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Shield","why":"Correcta. AWS Shield responde a la necesidad 1: protege contra ataques de denegación de servicio distribuido DDoS."},{"l":"B","t":"Amazon Detective","why":"Incorrecta. Amazon Detective: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"AWS Certificate Manager","why":"Incorrecta. AWS Certificate Manager: aprovisiona y administra certificados TLS públicos o privados compatibles. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"AWS WAF","why":"Correcta. AWS WAF responde a la necesidad 2: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web."},{"l":"E","t":"Cifrado en tránsito","why":"Incorrecta. Cifrado en tránsito protege datos mientras viajan por conexiones como TLS o VPN. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0307","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"Un cliente plantea esta situación: una tienda quiere guardar temporalmente resultados de consultas repetidas en memoria. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Amazon Redshift","why":"Incorrecta. Amazon Redshift: ejecuta analítica SQL de almacén de datos para grandes volúmenes. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece almacenes de caché en memoria administrados para disminuir latencia."},{"l":"B","t":"Amazon DynamoDB","why":"Incorrecta. Amazon DynamoDB: proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece almacenes de caché en memoria administrados para disminuir latencia."},{"l":"C","t":"Amazon ElastiCache","why":"Correcta. Amazon ElastiCache: ofrece almacenes de caché en memoria administrados para disminuir latencia. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon RDS","why":"Incorrecta. Amazon RDS: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece almacenes de caché en memoria administrados para disminuir latencia."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0308","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una entidad requiere continuidad de negocio si toda su región principal deja de funcionar; (2) una compañía debe decidir la ubicación geográfica donde alojará datos por residencia y latencia. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Arquitectura multirregión + AWS CloudFormation","why":"Incorrecta. cumple el requisito 1: despliega o replica recursos en regiones distintas para objetivos globales y recuperación. NO cumple el requisito 2: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables."},{"l":"B","t":"AWS Outposts + AWS CloudFormation","why":"Incorrecta. NO cumple el requisito 1: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente. NO cumple el requisito 2: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables."},{"l":"C","t":"Arquitectura multirregión + Región AWS","why":"Correcta. cumple el requisito 1: despliega o replica recursos en regiones distintas para objetivos globales y recuperación. cumple el requisito 2: área geográfica con múltiples zonas de disponibilidad separadas."},{"l":"D","t":"AWS Outposts + Región AWS","why":"Incorrecta. NO cumple el requisito 1: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente. cumple el requisito 2: área geográfica con múltiples zonas de disponibilidad separadas."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0309","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Una empresa está evaluando AWS: un equipo evalúa si puede eliminar recursos ociosos y ajustar el gasto sin perder objetivos. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Arquitectura basada en eventos","why":"Incorrecta. Arquitectura basada en eventos: desacopla productores y consumidores mediante eventos que disparan reacciones. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo."},{"l":"B","t":"Diseño para fallos","why":"Incorrecta. Diseño para fallos: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo."},{"l":"C","t":"Dimensionar según la demanda","why":"Incorrecta. Dimensionar según la demanda: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo."},{"l":"D","t":"Optimización de costos","why":"Correcta. Optimización de costos: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0310","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Un cliente plantea esta situación: un administrador quiere aplicar iguales permisos a veinte usuarios sin editar cada uno por separado. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Grupo IAM","why":"Correcta. Grupo IAM: permite asignar permisos comunes a un conjunto de usuarios IAM. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Política basada en recurso","why":"Incorrecta. Política basada en recurso: se adjunta al recurso compatible para expresar quién puede actuar sobre él. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite asignar permisos comunes a un conjunto de usuarios IAM."},{"l":"C","t":"Rol IAM","why":"Incorrecta. Rol IAM: otorga credenciales temporales que pueden asumirse por principales autorizados. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite asignar permisos comunes a un conjunto de usuarios IAM."},{"l":"D","t":"Federación de identidades","why":"Incorrecta. Federación de identidades: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite asignar permisos comunes a un conjunto de usuarios IAM."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0311","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un responsable de seguridad quiere consultar recomendaciones y novedades publicadas por expertos AWS. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Amazon Inspector","why":"Incorrecta. Amazon Inspector: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: publica novedades y prácticas de seguridad de AWS en artículos técnicos."},{"l":"B","t":"Bloqueo de acceso público de S3","why":"Incorrecta. Bloqueo de acceso público de S3: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: publica novedades y prácticas de seguridad de AWS en artículos técnicos."},{"l":"C","t":"Cifrado en tránsito","why":"Incorrecta. Cifrado en tránsito: protege datos mientras viajan por conexiones como TLS o VPN. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: publica novedades y prácticas de seguridad de AWS en artículos técnicos."},{"l":"D","t":"AWS Security Blog","why":"Correcta. AWS Security Blog: publica novedades y prácticas de seguridad de AWS en artículos técnicos. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0312","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una organización quiere conocer la evolución de una regla de seguridad y detectar configuraciones no conformes. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"AWS Secrets Manager","why":"Incorrecta. AWS Secrets Manager: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos."},{"l":"B","t":"AWS Systems Manager","why":"Incorrecta. AWS Systems Manager: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos."},{"l":"C","t":"AWS Trusted Advisor","why":"Incorrecta. AWS Trusted Advisor: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos."},{"l":"D","t":"AWS Config","why":"Correcta. AWS Config: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0313","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Una organización compara opciones en la nube: una empresa quiere evaluar una solución de un proveedor externo de ciberseguridad desde un catálogo AWS. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon Detective","why":"Incorrecta. Amazon Detective: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones."},{"l":"B","t":"AWS Marketplace de seguridad","why":"Correcta. AWS Marketplace de seguridad: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS Certificate Manager","why":"Incorrecta. AWS Certificate Manager: aprovisiona y administra certificados TLS públicos o privados compatibles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones."},{"l":"D","t":"Registros VPC Flow Logs","why":"Incorrecta. Registros VPC Flow Logs: capturan metadatos sobre tráfico IP hacia y desde interfaces de red en VPC. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0314","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un trabajador busca un asistente generativo para consultar conocimiento corporativo autorizado. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Amazon Athena","why":"Incorrecta. Amazon Athena: consulta directamente datos almacenados en S3 mediante SQL sin aprovisionar servidores. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece asistentes de IA generativa para tareas empresariales y desarrollo según producto."},{"l":"B","t":"Amazon Kinesis","why":"Incorrecta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece asistentes de IA generativa para tareas empresariales y desarrollo según producto."},{"l":"C","t":"Amazon Q","why":"Correcta. Amazon Q: ofrece asistentes de IA generativa para tareas empresariales y desarrollo según producto. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon Quick","why":"Incorrecta. Amazon Quick: ofrece capacidades de inteligencia de negocios y visualización de datos administradas. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece asistentes de IA generativa para tareas empresariales y desarrollo según producto."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0315","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una cuenta de auditoría necesita consultar recursos de producción sin crear usuarios allí. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Gestión de permisos con políticas administradas","why":"Incorrecta. Gestión de permisos con políticas administradas: reutiliza políticas IAM que pueden vincularse a varias identidades. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: autoriza que un principal de otra cuenta asuma una función con permisos temporales."},{"l":"B","t":"Autenticación multifactor (MFA)","why":"Incorrecta. Autenticación multifactor (MFA): añade un factor adicional para autenticarse además de contraseña o credencial inicial. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: autoriza que un principal de otra cuenta asuma una función con permisos temporales."},{"l":"C","t":"Rol entre cuentas","why":"Correcta. Rol entre cuentas: autoriza que un principal de otra cuenta asuma una función con permisos temporales. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Usuario IAM","why":"Incorrecta. Usuario IAM: representa una identidad persistente en una cuenta con posibles credenciales de larga duración. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: autoriza que un principal de otra cuenta asuma una función con permisos temporales."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0316","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Una organización compara opciones en la nube: un motor de simulación necesita mucha capacidad de CPU y relativamente poca memoria. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Instancias EC2 optimizadas para cómputo","why":"Correcta. Instancias EC2 optimizadas para cómputo: aportan proporción alta de potencia de CPU para cargas intensivas en procesamiento. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Elastic Load Balancing","why":"Incorrecta. Elastic Load Balancing: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aportan proporción alta de potencia de CPU para cargas intensivas en procesamiento."},{"l":"C","t":"Amazon EC2 Auto Scaling","why":"Incorrecta. Amazon EC2 Auto Scaling: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aportan proporción alta de potencia de CPU para cargas intensivas en procesamiento."},{"l":"D","t":"AWS Elastic Beanstalk","why":"Incorrecta. AWS Elastic Beanstalk: despliega aplicaciones web y automatiza infraestructura mientras permite acceso a recursos subyacentes. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aportan proporción alta de potencia de CPU para cargas intensivas en procesamiento."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0317","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Un equipo tiene tres necesidades que resolver en AWS: (1) una compañía busca ver en un lugar central el estado de sus aplicaciones en migración; (2) una compañía deja su CRM instalado y contrata una alternativa SaaS; (3) una corporación busca un marco para alinear personas procesos tecnología y resultados de migración. ¿Qué TRES alternativas debería seleccionar? (Seleccione TRES respuestas).","options":[{"l":"A","t":"Rehosting (rehost)","why":"Incorrecta. Rehosting (rehost) traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"B","t":"Retiring (retire)","why":"Incorrecta. Retiring (retire) elimina aplicaciones que ya no generan valor o no son necesarias. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"C","t":"AWS Cloud Adoption Framework","why":"Correcta. Se aplica a la situación 3: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción."},{"l":"D","t":"AWS Migration Hub","why":"Correcta. Se aplica a la situación 1: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles."},{"l":"E","t":"Migration Evaluator","why":"Incorrecta. Migration Evaluator: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"F","t":"Repurchasing (repurchase)","why":"Correcta. Se aplica a la situación 2: reemplaza una solución existente por otro producto generalmente SaaS."}],"key":["C","D","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0318","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un procesamiento por lotes tolerante a interrupciones busca el menor costo posible de cómputo. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Dedicated Hosts","why":"Incorrecta. Dedicated Hosts: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla."},{"l":"B","t":"Instancias Spot","why":"Correcta. Instancias Spot: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Transferencia de datos saliente","why":"Incorrecta. Transferencia de datos saliente: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla."},{"l":"D","t":"Savings Plans","why":"Incorrecta. Savings Plans: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0319","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) un corporativo busca recibir una factura consolidada de sus diversas cuentas AWS; (2) una compañía busca clasificar facturación según unidades de negocio mediante reglas sobre cuentas y etiquetas. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Facturación consolidada de AWS Organizations + AWS Cost Categories","why":"Correcta. cumple el requisito 1: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles. cumple el requisito 2: agrupa y clasifica líneas de costo usando reglas de negocio configuradas."},{"l":"B","t":"AWS Cost Explorer + AWS Pricing Calculator","why":"Incorrecta. NO cumple el requisito 1: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. NO cumple el requisito 2: estima costos futuros de arquitecturas y servicios antes de desplegarlos."},{"l":"C","t":"AWS Cost Explorer + AWS Cost Categories","why":"Incorrecta. NO cumple el requisito 1: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. cumple el requisito 2: agrupa y clasifica líneas de costo usando reglas de negocio configuradas."},{"l":"D","t":"Facturación consolidada de AWS Organizations + AWS Pricing Calculator","why":"Incorrecta. cumple el requisito 1: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles. NO cumple el requisito 2: estima costos futuros de arquitecturas y servicios antes de desplegarlos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0320","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un equipo pequeño quiere reducir el trabajo de mantenimiento rutinario de la infraestructura subyacente. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Alcance global","why":"Incorrecta. Alcance global: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente."},{"l":"B","t":"Escalabilidad horizontal","why":"Incorrecta. Escalabilidad horizontal: aumenta capacidad agregando más instancias o nodos en paralelo. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente."},{"l":"C","t":"Gasto operativo variable","why":"Incorrecta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente."},{"l":"D","t":"Servicios administrados","why":"Correcta. Servicios administrados: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0321","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un call center necesita producir transcripciones de grabaciones de voz. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Amazon Lex","why":"Incorrecta. Amazon Lex: permite crear interfaces conversacionales de voz y texto para chatbots. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: convierte audio hablado a texto mediante reconocimiento automático de voz."},{"l":"B","t":"Amazon Polly","why":"Incorrecta. Amazon Polly: convierte texto en voz sintetizada para aplicaciones. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: convierte audio hablado a texto mediante reconocimiento automático de voz."},{"l":"C","t":"Amazon Transcribe","why":"Correcta. Amazon Transcribe: convierte audio hablado a texto mediante reconocimiento automático de voz. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon EMR","why":"Incorrecta. Amazon EMR: ejecuta marcos de big data como Apache Spark y Hadoop administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: convierte audio hablado a texto mediante reconocimiento automático de voz."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0322","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un sistema heredado requiere identificar una identidad IAM concreta dentro de una cuenta. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Permisos explícitamente denegados","why":"Incorrecta. Permisos explícitamente denegados: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: representa una identidad persistente en una cuenta con posibles credenciales de larga duración."},{"l":"B","t":"AWS STS","why":"Incorrecta. AWS STS: emite credenciales de seguridad temporales para sesiones y roles. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: representa una identidad persistente en una cuenta con posibles credenciales de larga duración."},{"l":"C","t":"Política basada en recurso","why":"Incorrecta. Política basada en recurso: se adjunta al recurso compatible para expresar quién puede actuar sobre él. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: representa una identidad persistente en una cuenta con posibles credenciales de larga duración."},{"l":"D","t":"Usuario IAM","why":"Correcta. Usuario IAM: representa una identidad persistente en una cuenta con posibles credenciales de larga duración. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0323","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un operador necesita automatizar tareas AWS desde una terminal usando comandos. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Arquitectura multirregión","why":"Incorrecta. Arquitectura multirregión: despliega o replica recursos en regiones distintas para objetivos globales y recuperación. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts."},{"l":"B","t":"Región AWS","why":"Incorrecta. Región AWS: área geográfica con múltiples zonas de disponibilidad separadas. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts."},{"l":"C","t":"AWS CLI","why":"Correcta. AWS CLI: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Ubicación perimetral (edge location)","why":"Incorrecta. Ubicación perimetral (edge location): punto de presencia cercano a usuarios para entrega de contenido y ciertos servicios periféricos. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0324","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una aplicación recibe peticiones y debe repartirlas entre varias instancias disponibles. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Amazon EKS","why":"Incorrecta. Amazon EKS: ofrece Kubernetes administrado para orquestar aplicaciones en contenedores. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador."},{"l":"B","t":"Instancias EC2 optimizadas para cómputo","why":"Incorrecta. Instancias EC2 optimizadas para cómputo: aportan proporción alta de potencia de CPU para cargas intensivas en procesamiento. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador."},{"l":"C","t":"Elastic Load Balancing","why":"Correcta. Elastic Load Balancing: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Fargate","why":"Incorrecta. AWS Fargate: ejecuta contenedores sin administrar servidores de host para ECS o EKS compatibles. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0325","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una empresa compara qué proveedor mantiene la infraestructura subyacente de una base RDS. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Parches del SO invitado en EC2","why":"Incorrecta. Parches del SO invitado en EC2: normalmente corresponden al cliente para sistemas operativos de instancias EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS."},{"l":"B","t":"Parches de infraestructura de RDS","why":"Correcta. Parches de infraestructura de RDS: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Control de accesos a datos en RDS","why":"Incorrecta. Control de accesos a datos en RDS: lo define el cliente mediante identidades permisos y controles de aplicación. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS."},{"l":"D","t":"Configuración de grupos de seguridad","why":"Incorrecta. Configuración de grupos de seguridad: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0326","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Un equipo tiene tres necesidades que resolver en AWS: (1) una plataforma requiere administrar credenciales de base de datos con rotación automática; (2) un grupo de trabajo busca ejecutar tareas operativas repetibles en un conjunto de instancias administradas; (3) un auditor busca detectar políticas que permiten acceso a un bucket desde fuera de la organización. ¿Qué TRES alternativas debería seleccionar? (Seleccione TRES respuestas).","options":[{"l":"A","t":"AWS Security Hub","why":"Incorrecta. AWS Security Hub: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"B","t":"AWS IAM Access Analyzer","why":"Correcta. Se aplica a la situación 3: identifica acceso externo no previsto y ayuda a analizar permisos de recursos e identidades."},{"l":"C","t":"AWS Systems Manager","why":"Correcta. Se aplica a la situación 2: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos."},{"l":"D","t":"AWS Firewall Manager","why":"Incorrecta. AWS Firewall Manager administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"E","t":"AWS Secrets Manager","why":"Correcta. Se aplica a la situación 1: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos."},{"l":"F","t":"Service Control Policy (SCP)","why":"Incorrecta. Service Control Policy (SCP) establece el máximo conjunto de permisos posibles para cuentas en una organización. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."}],"key":["B","C","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0327","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un portal web debe seguir disponible si falla una instancia de su despliegue; (2) una entidad requiere restaurar su servicio después de la pérdida de una región. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Pago por uso + Escalabilidad horizontal","why":"Incorrecta. NO cumple el requisito 1: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente. NO cumple el requisito 2: aumenta capacidad agregando más instancias o nodos en paralelo."},{"l":"B","t":"Alta disponibilidad + Recuperación ante desastres","why":"Correcta. cumple el requisito 1: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos. cumple el requisito 2: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación."},{"l":"C","t":"Pago por uso + Recuperación ante desastres","why":"Incorrecta. NO cumple el requisito 1: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente. cumple el requisito 2: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación."},{"l":"D","t":"Alta disponibilidad + Escalabilidad horizontal","why":"Incorrecta. cumple el requisito 1: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos. NO cumple el requisito 2: aumenta capacidad agregando más instancias o nodos en paralelo."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0328","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) un grupo de trabajo requiere un repositorio privado administrado para sus imágenes Docker; (2) una plataforma recibe peticiones y debe repartirlas entre múltiples instancias disponibles; (3) un integrante del equipo técnico sube su código web y busca que AWS configure el entorno de ejecución asociado. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"AWS Elastic Beanstalk","why":"Correcta. Se aplica a la situación 3: despliega aplicaciones web y automatiza infraestructura mientras permite acceso a recursos subyacentes."},{"l":"B","t":"Amazon ECR","why":"Correcta. Se aplica a la situación 1: registra y almacena imágenes de contenedores para despliegues."},{"l":"C","t":"AWS Lambda","why":"Incorrecta. AWS Lambda ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"D","t":"Instancias EC2 optimizadas para memoria","why":"Incorrecta. Instancias EC2 optimizadas para memoria: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"E","t":"Elastic Load Balancing","why":"Correcta. Se aplica a la situación 2: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador."},{"l":"F","t":"Amazon EKS","why":"Incorrecta. Amazon EKS ofrece Kubernetes administrado para orquestar aplicaciones en contenedores. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."}],"key":["A","B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0329","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) Durante un nuevo proyecto, un responsable exige una longitud mínima para todas las contraseñas de usuarios IAM; (2) Durante un nuevo proyecto, el propietario de un bucket agrega una declaración que autoriza a un rol de otra cuenta a leer objetos. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Política de contraseñas IAM + Límite de permisos IAM","why":"Incorrecta. cumple el requisito 1: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. NO cumple el requisito 2: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol."},{"l":"B","t":"Política de contraseñas IAM + Política basada en recurso","why":"Correcta. cumple el requisito 1: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. cumple el requisito 2: se adjunta al recurso compatible para expresar quién puede actuar sobre él."},{"l":"C","t":"AWS STS + Límite de permisos IAM","why":"Incorrecta. NO cumple el requisito 1: emite credenciales de seguridad temporales para sesiones y roles. NO cumple el requisito 2: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol."},{"l":"D","t":"AWS STS + Política basada en recurso","why":"Incorrecta. NO cumple el requisito 1: emite credenciales de seguridad temporales para sesiones y roles. cumple el requisito 2: se adjunta al recurso compatible para expresar quién puede actuar sobre él."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0330","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un portal requiere acceso continuo a imágenes de catálogo y alta disponibilidad. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Amazon FSx","why":"Incorrecta. Amazon FSx: ofrece sistemas de archivos administrados especializados como Windows File Server y Lustre. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona."},{"l":"B","t":"Amazon EBS","why":"Incorrecta. Amazon EBS: aporta volúmenes de almacenamiento en bloques persistente para instancias EC2. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona."},{"l":"C","t":"S3 Standard-IA","why":"Incorrecta. S3 Standard-IA: almacena objetos poco consultados con recuperación rápida y resiliencia multizona. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona."},{"l":"D","t":"S3 Standard","why":"Correcta. S3 Standard: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0331","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una multinacional busca organizar múltiples cuentas bajo una estructura administrada centralmente; (2) un grupo de trabajo busca gobernar permisos y uso de claves para cifrar datos en servicios de AWS. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Control Tower","why":"Incorrecta. AWS Control Tower facilita configurar y gobernar un entorno de múltiples cuentas con controles. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Amazon CloudWatch","why":"Incorrecta. Amazon CloudWatch: recopila métricas registros y alarmas para observar aplicaciones y recursos. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"AWS Organizations","why":"Correcta. AWS Organizations responde a la necesidad 1: agrupa cuentas para aplicar gobierno y facturación centralizada."},{"l":"D","t":"AWS Well-Architected Tool","why":"Incorrecta. AWS Well-Architected Tool: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"AWS KMS","why":"Correcta. AWS KMS responde a la necesidad 2: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado."}],"key":["C","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0332","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) un sistema informático requiere elegir los tipos y tamaños de recursos que cumplen latencia y rendimiento; (2) una plataforma web busca reemplazar servidores sin perder sesiones almacenadas localmente en ellos; (3) un grupo de trabajo detecta servidores sobredimensionados y planea ajustar su capacidad tras medir utilización. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"Dimensionar según la demanda","why":"Correcta. Se aplica a la situación 3: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento."},{"l":"B","t":"Sostenibilidad","why":"Incorrecta. Sostenibilidad pilar Well-Architected que minimiza impactos ambientales del uso de recursos. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"C","t":"Eficiencia del rendimiento","why":"Correcta. Se aplica a la situación 1: pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga."},{"l":"D","t":"Seguridad","why":"Incorrecta. Seguridad pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"E","t":"Diseño sin estado","why":"Correcta. Se aplica a la situación 2: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado."},{"l":"F","t":"Diseño para fallos","why":"Incorrecta. Diseño para fallos: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse. Ninguna de las tres situaciones exige prioritariamente esta función."}],"key":["A","C","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0333","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una compañía busca acercar su aplicación a clientes de América Europa y Asia; (2) una compañía busca reemplazar inversiones iniciales en centros de datos por cargos mensuales variables. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Agilidad + Gasto operativo variable","why":"Incorrecta. NO cumple el requisito 1: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas. cumple el requisito 2: desplaza inversiones en hardware hacia gastos asociados al uso."},{"l":"B","t":"Agilidad + Economías de escala","why":"Incorrecta. NO cumple el requisito 1: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas. NO cumple el requisito 2: reducen costos unitarios gracias al volumen agregado de demanda del proveedor."},{"l":"C","t":"Alcance global + Economías de escala","why":"Incorrecta. cumple el requisito 1: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas. NO cumple el requisito 2: reducen costos unitarios gracias al volumen agregado de demanda del proveedor."},{"l":"D","t":"Alcance global + Gasto operativo variable","why":"Correcta. cumple el requisito 1: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas. cumple el requisito 2: desplaza inversiones en hardware hacia gastos asociados al uso."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0334","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Muy alta","text":"Un equipo tiene tres necesidades que resolver en AWS: (1) una corporación busca comprar una solución comercial de un proveedor externo compatible con AWS; (2) una entidad global requiere la modalidad más especializada para operar cargas de misión crítica; (3) un grupo financiero busca un plan de soporte con acompañamiento experto para cargas críticas de negocio. ¿Qué TRES alternativas debería seleccionar? (Seleccione TRES respuestas).","options":[{"l":"A","t":"AWS Basic Support","why":"Incorrecta. AWS Basic Support proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"B","t":"AWS Prescriptive Guidance","why":"Incorrecta. AWS Prescriptive Guidance: publica estrategias patrones y guías para migración modernización y operación. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"C","t":"AWS Business Support+","why":"Incorrecta. AWS Business Support+ plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"D","t":"AWS Enterprise Support","why":"Correcta. Se aplica a la situación 3: plan prémium para cargas críticas de negocio con orientación experta y capacidades empresariales."},{"l":"E","t":"AWS Marketplace","why":"Correcta. Se aplica a la situación 1: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros."},{"l":"F","t":"AWS Unified Operations","why":"Correcta. Se aplica a la situación 2: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones."}],"key":["D","E","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0335","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un sistema etiqueta automáticamente objetos presentes en fotografías. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon Athena","why":"Incorrecta. Amazon Athena: consulta directamente datos almacenados en S3 mediante SQL sin aprovisionar servidores. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: analiza imágenes y video para detectar objetos textos y características visuales."},{"l":"B","t":"Amazon Polly","why":"Incorrecta. Amazon Polly: convierte texto en voz sintetizada para aplicaciones. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: analiza imágenes y video para detectar objetos textos y características visuales."},{"l":"C","t":"Amazon Lex","why":"Incorrecta. Amazon Lex: permite crear interfaces conversacionales de voz y texto para chatbots. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: analiza imágenes y video para detectar objetos textos y características visuales."},{"l":"D","t":"Amazon Rekognition","why":"Correcta. Amazon Rekognition: analiza imágenes y video para detectar objetos textos y características visuales. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0336","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) Durante un nuevo proyecto, un analista investiga relaciones entre identidades IP y actividades tras recibir una alerta; (2) Durante un nuevo proyecto, un investigador requiere revisar metadatos de flujos IP aceptados o rechazados en interfaces. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Shield","why":"Incorrecta. AWS Shield: protege contra ataques de denegación de servicio distribuido DDoS. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Registros VPC Flow Logs","why":"Correcta. Registros VPC Flow Logs responde a la necesidad 2: capturan metadatos sobre tráfico IP hacia y desde interfaces de red en VPC."},{"l":"C","t":"Cifrado en tránsito","why":"Incorrecta. Cifrado en tránsito: protege datos mientras viajan por conexiones como TLS o VPN. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Amazon Detective","why":"Correcta. Amazon Detective responde a la necesidad 1: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados."},{"l":"E","t":"Amazon GuardDuty","why":"Incorrecta. Amazon GuardDuty detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["B","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0337","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una tienda quiere que el módulo de cobros pueda evolucionar sin obligar a desplegar el de catálogo. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Excelencia operativa","why":"Incorrecta. Excelencia operativa: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: diseña componentes para depender poco unos de otros y limitar fallas en cascada."},{"l":"B","t":"Dimensionar según la demanda","why":"Incorrecta. Dimensionar según la demanda: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: diseña componentes para depender poco unos de otros y limitar fallas en cascada."},{"l":"C","t":"Acoplamiento débil","why":"Correcta. Acoplamiento débil: diseña componentes para depender poco unos de otros y limitar fallas en cascada. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Arquitectura basada en eventos","why":"Incorrecta. Arquitectura basada en eventos: desacopla productores y consumidores mediante eventos que disparan reacciones. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: diseña componentes para depender poco unos de otros y limitar fallas en cascada."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0338","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un servicio crítico necesita asegurar disponibilidad de capacidad específica de EC2 en una AZ. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Savings Plans","why":"Incorrecta. Savings Plans: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reservan capacidad EC2 en una zona de disponibilidad sin obligar por sí mismas al descuento de plazo."},{"l":"B","t":"Instancias bajo demanda (On-Demand)","why":"Incorrecta. Instancias bajo demanda (On-Demand): paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reservan capacidad EC2 en una zona de disponibilidad sin obligar por sí mismas al descuento de plazo."},{"l":"C","t":"Transferencia de datos saliente","why":"Incorrecta. Transferencia de datos saliente: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reservan capacidad EC2 en una zona de disponibilidad sin obligar por sí mismas al descuento de plazo."},{"l":"D","t":"On-Demand Capacity Reservations","why":"Correcta. On-Demand Capacity Reservations: reservan capacidad EC2 en una zona de disponibilidad sin obligar por sí mismas al descuento de plazo. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0339","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Un equipo tiene tres necesidades que resolver en AWS: (1) Durante un nuevo proyecto, dos cuentas deben compartir subredes de una VPC sin duplicarlas; (2) un responsable de administración central busca impedir determinadas acciones aunque un usuario final tenga permisos IAM amplios; (3) una corporación construye una landing zone gobernada para sus nuevas cuentas AWS. ¿Qué TRES alternativas debería seleccionar? (Seleccione TRES respuestas).","options":[{"l":"A","t":"Service Control Policy (SCP)","why":"Correcta. Se aplica a la situación 2: establece el máximo conjunto de permisos posibles para cuentas en una organización."},{"l":"B","t":"AWS Control Tower","why":"Correcta. Se aplica a la situación 3: facilita configurar y gobernar un entorno de múltiples cuentas con controles."},{"l":"C","t":"AWS Firewall Manager","why":"Incorrecta. AWS Firewall Manager administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"D","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"E","t":"AWS IAM Access Analyzer","why":"Incorrecta. AWS IAM Access Analyzer identifica acceso externo no previsto y ayuda a analizar permisos de recursos e identidades. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"F","t":"AWS Resource Access Manager","why":"Correcta. Se aplica a la situación 1: facilita compartir recursos AWS compatibles entre cuentas de forma controlada."}],"key":["A","B","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0340","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un portal web debe seguir disponible si falla una instancia de su despliegue; (2) un grupo de trabajo pequeño busca reducir el trabajo de mantenimiento rutinario de la infraestructura subyacente. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Alta disponibilidad","why":"Correcta. Alta disponibilidad responde a la necesidad 1: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos."},{"l":"B","t":"Agilidad","why":"Incorrecta. Agilidad: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Tolerancia a errores","why":"Incorrecta. Tolerancia a errores continúa operando durante fallas de componentes con interrupción mínima o nula. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Servicios administrados","why":"Correcta. Servicios administrados responde a la necesidad 2: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente."},{"l":"E","t":"Recuperación ante desastres","why":"Incorrecta. Recuperación ante desastres: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0341","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) Durante un nuevo proyecto, un servidor web con IP pública debe ser accesible directamente desde Internet según sus reglas; (2) una entidad requiere denegar rangos IP a nivel de subred con reglas separadas de ida y vuelta. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Subred pública + Lista de control de acceso de red (NACL)","why":"Correcta. cumple el requisito 1: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. cumple el requisito 2: filtro sin estado que aplica reglas de entrada y salida a nivel de subred."},{"l":"B","t":"Amazon CloudFront + Lista de control de acceso de red (NACL)","why":"Incorrecta. NO cumple el requisito 1: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN. cumple el requisito 2: filtro sin estado que aplica reglas de entrada y salida a nivel de subred."},{"l":"C","t":"Subred pública + AWS Site-to-Site VPN","why":"Incorrecta. cumple el requisito 1: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. NO cumple el requisito 2: conecta redes locales a VPC mediante túneles cifrados sobre una red IP."},{"l":"D","t":"Amazon CloudFront + AWS Site-to-Site VPN","why":"Incorrecta. NO cumple el requisito 1: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN. NO cumple el requisito 2: conecta redes locales a VPC mediante túneles cifrados sobre una red IP."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0342","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) un responsable de administración requiere habilitar TCP 443 a un servidor y que las respuestas se acepten de forma automática; (2) Durante un nuevo proyecto, dos empresas quieren consumir un servicio AWS por una ruta privada sin exponer tráfico a Internet. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Grupo de seguridad + AWS PrivateLink","why":"Correcta. cumple el requisito 1: firewall virtual con estado asociado a interfaces y recursos compatibles. cumple el requisito 2: expone servicios de forma privada mediante endpoints sin usar Internet público."},{"l":"B","t":"Grupo de seguridad + Amazon API Gateway","why":"Incorrecta. cumple el requisito 1: firewall virtual con estado asociado a interfaces y recursos compatibles. NO cumple el requisito 2: crea publica administra y protege APIs para clientes que acceden a backends."},{"l":"C","t":"Amazon Route 53 + AWS PrivateLink","why":"Incorrecta. NO cumple el requisito 1: presta servicios DNS y políticas de enrutamiento de consultas por nombre. cumple el requisito 2: expone servicios de forma privada mediante endpoints sin usar Internet público."},{"l":"D","t":"Amazon Route 53 + Amazon API Gateway","why":"Incorrecta. NO cumple el requisito 1: presta servicios DNS y políticas de enrutamiento de consultas por nombre. NO cumple el requisito 2: crea publica administra y protege APIs para clientes que acceden a backends."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0343","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Muy alta","text":"Un equipo tiene tres necesidades que resolver en AWS: (1) un trabajador busca un asistente generativo para revisar conocimiento corporativo autorizado; (2) un responsable requiere paneles de BI y visualizaciones sin desarrollar una interfaz propia; (3) un comercio convierte de forma automática descripciones escritas de productos de español a francés. ¿Qué TRES alternativas debería seleccionar? (Seleccione TRES respuestas).","options":[{"l":"A","t":"Amazon Transcribe","why":"Incorrecta. Amazon Transcribe convierte audio hablado a texto mediante reconocimiento automático de voz. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"B","t":"Amazon Quick","why":"Correcta. Se aplica a la situación 2: ofrece capacidades de inteligencia de negocios y visualización de datos administradas."},{"l":"C","t":"Amazon Translate","why":"Correcta. Se aplica a la situación 3: traduce texto entre idiomas mediante modelos administrados."},{"l":"D","t":"Amazon Athena","why":"Incorrecta. Amazon Athena consulta directamente datos almacenados en S3 mediante SQL sin aprovisionar servidores. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"E","t":"Amazon Rekognition","why":"Incorrecta. Amazon Rekognition: analiza imágenes y video para detectar objetos textos y características visuales. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"F","t":"Amazon Q","why":"Correcta. Se aplica a la situación 1: ofrece asistentes de IA generativa para tareas empresariales y desarrollo según producto."}],"key":["B","C","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0344","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, una empresa requiere conectividad dedicada predecible sin depender de un túnel VPN público. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"AWS Global Accelerator","why":"Incorrecta. AWS Global Accelerator: mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona conexión de red privada dedicada entre instalaciones y AWS."},{"l":"B","t":"AWS PrivateLink","why":"Incorrecta. AWS PrivateLink: expone servicios de forma privada mediante endpoints sin usar Internet público. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona conexión de red privada dedicada entre instalaciones y AWS."},{"l":"C","t":"Amazon API Gateway","why":"Incorrecta. Amazon API Gateway: crea publica administra y protege APIs para clientes que acceden a backends. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona conexión de red privada dedicada entre instalaciones y AWS."},{"l":"D","t":"AWS Direct Connect","why":"Correcta. AWS Direct Connect: proporciona conexión de red privada dedicada entre instalaciones y AWS. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0345","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) un grupo de trabajo evalúa si puede eliminar recursos ociosos y ajustar el gasto sin perder objetivos; (2) un grupo de trabajo revisa métricas y automatiza procedimientos para mejorar continuamente la operación. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Arquitectura basada en eventos + Acoplamiento débil","why":"Incorrecta. NO cumple el requisito 1: desacopla productores y consumidores mediante eventos que disparan reacciones. NO cumple el requisito 2: diseña componentes para depender poco unos de otros y limitar fallas en cascada."},{"l":"B","t":"Arquitectura basada en eventos + Excelencia operativa","why":"Incorrecta. NO cumple el requisito 1: desacopla productores y consumidores mediante eventos que disparan reacciones. cumple el requisito 2: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos."},{"l":"C","t":"Optimización de costos + Excelencia operativa","why":"Correcta. cumple el requisito 1: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo. cumple el requisito 2: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos."},{"l":"D","t":"Optimización de costos + Acoplamiento débil","why":"Incorrecta. cumple el requisito 1: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo. NO cumple el requisito 2: diseña componentes para depender poco unos de otros y limitar fallas en cascada."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0346","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Un equipo tiene tres necesidades que resolver en AWS: (1) Durante un nuevo proyecto, una dirección exige estimar el beneficio económico antes de migrar sus servidores; (2) un sistema informático regulado permanece local hasta renegociar sus contratos y requisitos legales; (3) una corporación busca un marco para alinear personas procesos tecnología y resultados de migración. ¿Qué TRES alternativas debería seleccionar? (Seleccione TRES respuestas).","options":[{"l":"A","t":"Relocating (relocate)","why":"Incorrecta. Relocating (relocate) mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"B","t":"Migration Evaluator","why":"Correcta. Se aplica a la situación 1: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura."},{"l":"C","t":"Retiring (retire)","why":"Incorrecta. Retiring (retire): elimina aplicaciones que ya no generan valor o no son necesarias. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"D","t":"Rehosting (rehost)","why":"Incorrecta. Rehosting (rehost) traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"E","t":"AWS Cloud Adoption Framework","why":"Correcta. Se aplica a la situación 3: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción."},{"l":"F","t":"Retaining (retain)","why":"Correcta. Se aplica a la situación 2: conserva temporalmente una carga de trabajo en el entorno actual."}],"key":["B","E","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0347","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un equipo necesita descubrir esquemas y transformar conjuntos de datos para analítica. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Amazon EMR","why":"Incorrecta. Amazon EMR: ejecuta marcos de big data como Apache Spark y Hadoop administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: integra datos mediante procesos ETL y catálogo de metadatos administrados."},{"l":"B","t":"Amazon SageMaker AI","why":"Incorrecta. Amazon SageMaker AI: proporciona capacidades para construir entrenar y desplegar modelos de machine learning. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: integra datos mediante procesos ETL y catálogo de metadatos administrados."},{"l":"C","t":"Amazon Textract","why":"Incorrecta. Amazon Textract: extrae texto y estructura de documentos como tablas y formularios. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: integra datos mediante procesos ETL y catálogo de metadatos administrados."},{"l":"D","t":"AWS Glue","why":"Correcta. AWS Glue: integra datos mediante procesos ETL y catálogo de metadatos administrados. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0348","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Una empresa está evaluando AWS: un equipo clasifica sentimientos y entidades en comentarios de clientes. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Amazon Lex","why":"Incorrecta. Amazon Lex: permite crear interfaces conversacionales de voz y texto para chatbots. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: extrae información del lenguaje natural como entidades y sentimientos de texto."},{"l":"B","t":"AWS Glue","why":"Incorrecta. AWS Glue: integra datos mediante procesos ETL y catálogo de metadatos administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: extrae información del lenguaje natural como entidades y sentimientos de texto."},{"l":"C","t":"Am

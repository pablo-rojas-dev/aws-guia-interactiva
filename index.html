investigador requiere revisar metadatos de flujos IP aceptados o rechazados en interfaces. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Amazon Macie + Cifrado en tránsito","why":"Incorrecta. cumple el requisito 1: detecta y ayuda a clasificar datos confidenciales en Amazon S3. NO cumple el requisito 2: protege datos mientras viajan por conexiones como TLS o VPN."},{"l":"B","t":"AWS Marketplace de seguridad + Cifrado en tránsito","why":"Incorrecta. NO cumple el requisito 1: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. NO cumple el requisito 2: protege datos mientras viajan por conexiones como TLS o VPN."},{"l":"C","t":"AWS Marketplace de seguridad + Registros VPC Flow Logs","why":"Incorrecta. NO cumple el requisito 1: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. cumple el requisito 2: capturan metadatos sobre tráfico IP hacia y desde interfaces de red en VPC."},{"l":"D","t":"Amazon Macie + Registros VPC Flow Logs","why":"Correcta. cumple el requisito 1: detecta y ayuda a clasificar datos confidenciales en Amazon S3. cumple el requisito 2: capturan metadatos sobre tráfico IP hacia y desde interfaces de red en VPC."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0133","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: un equipo requiere una plataforma Kubernetes administrada y compatible con herramientas Kubernetes. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Amazon ECS","why":"Incorrecta. Amazon ECS: orquesta contenedores mediante un servicio de administración propio de AWS. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece Kubernetes administrado para orquestar aplicaciones en contenedores."},{"l":"B","t":"Amazon EKS","why":"Correcta. Amazon EKS: ofrece Kubernetes administrado para orquestar aplicaciones en contenedores. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon EC2","why":"Incorrecta. Amazon EC2: ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece Kubernetes administrado para orquestar aplicaciones en contenedores."},{"l":"D","t":"Amazon EC2 Auto Scaling","why":"Incorrecta. Amazon EC2 Auto Scaling: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece Kubernetes administrado para orquestar aplicaciones en contenedores."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0134","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: un repositorio necesita ejecutar compilación y pruebas automáticas al recibir cambios. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"AWS Amplify","why":"Incorrecta. AWS Amplify: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: compila código ejecuta pruebas y produce artefactos en un entorno administrado."},{"l":"B","t":"Amazon SES","why":"Incorrecta. Amazon SES: permite enviar correos electrónicos transaccionales y campañas mediante un servicio escalable. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: compila código ejecuta pruebas y produce artefactos en un entorno administrado."},{"l":"C","t":"AWS IoT Core","why":"Incorrecta. AWS IoT Core: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: compila código ejecuta pruebas y produce artefactos en un entorno administrado."},{"l":"D","t":"AWS CodeBuild","why":"Correcta. AWS CodeBuild: compila código ejecuta pruebas y produce artefactos en un entorno administrado. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0135","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"En un proyecto que utilizará AWS, una app necesita PostgreSQL administrado sin instalar ni mantener manualmente el motor en EC2. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"AWS DMS","why":"Incorrecta. AWS DMS: migra o replica datos de bases con cambios mínimos y admite migraciones heterogéneas. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento."},{"l":"B","t":"Base de datos autoadministrada en EC2","why":"Incorrecta. Base de datos autoadministrada en EC2: permite al cliente instalar y controlar motor parches y configuración en una instancia. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento."},{"l":"C","t":"Amazon RDS","why":"Correcta. Amazon RDS: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon Aurora","why":"Incorrecta. Amazon Aurora: ofrece un motor relacional administrado compatible con MySQL o PostgreSQL y arquitectura de almacenamiento propia. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0136","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un sistema transaccional no puede dejar de procesar si se avería un componente. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Tolerancia a errores","why":"Correcta. Tolerancia a errores: continúa operando durante fallas de componentes con interrupción mínima o nula. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Economías de escala","why":"Incorrecta. Economías de escala: reducen costos unitarios gracias al volumen agregado de demanda del proveedor. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: continúa operando durante fallas de componentes con interrupción mínima o nula."},{"l":"C","t":"Gasto operativo variable","why":"Incorrecta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: continúa operando durante fallas de componentes con interrupción mínima o nula."},{"l":"D","t":"Alta disponibilidad","why":"Incorrecta. Alta disponibilidad: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: continúa operando durante fallas de componentes con interrupción mínima o nula."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0137","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) Durante un nuevo proyecto, un auditor solicita evitar lectura de tráfico capturado entre un navegador y su API; (2) una compañía busca evaluar una solución de un proveedor externo de ciberseguridad desde un catálogo AWS. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Cifrado en tránsito","why":"Correcta. Cifrado en tránsito responde a la necesidad 1: protege datos mientras viajan por conexiones como TLS o VPN."},{"l":"B","t":"AWS Certificate Manager","why":"Incorrecta. AWS Certificate Manager: aprovisiona y administra certificados TLS públicos o privados compatibles. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"AWS Marketplace de seguridad","why":"Correcta. AWS Marketplace de seguridad responde a la necesidad 2: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones."},{"l":"D","t":"Bloqueo de acceso público de S3","why":"Incorrecta. Bloqueo de acceso público de S3: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Cifrado en reposo","why":"Incorrecta. Cifrado en reposo protege datos almacenados en discos objetos o bases de datos. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0138","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una organización traslada un conjunto de máquinas virtuales a un entorno compatible en AWS. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Repurchasing (repurchase)","why":"Incorrecta. Repurchasing (repurchase): reemplaza una solución existente por otro producto generalmente SaaS. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales."},{"l":"B","t":"Refactoring (refactor)","why":"Incorrecta. Refactoring (refactor): rediseña significativamente la aplicación para aprovechar capacidades nativas de nube. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales."},{"l":"C","t":"Relocating (relocate)","why":"Correcta. Relocating (relocate): mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Replatforming (replatform)","why":"Incorrecta. Replatforming (replatform): realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0139","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Alta","text":"Un cliente plantea esta situación: una compañía quiere comprar una solución comercial de un proveedor externo compatible con AWS. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"AWS Marketplace","why":"Correcta. AWS Marketplace: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS re:Post","why":"Incorrecta. AWS re:Post: comunidad de preguntas y respuestas técnicas sobre AWS. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros."},{"l":"C","t":"AWS Basic Support","why":"Incorrecta. AWS Basic Support: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros."},{"l":"D","t":"AWS Professional Services","why":"Incorrecta. AWS Professional Services: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0140","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un responsable de seguridad busca revisar recomendaciones y novedades publicadas por expertos AWS; (2) una aplicación de clientes requiere altas de usuario e inicio de sesión sin crear cuentas IAM para consumidores. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS WAF","why":"Incorrecta. AWS WAF filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Amazon Macie","why":"Incorrecta. Amazon Macie: detecta y ayuda a clasificar datos confidenciales en Amazon S3. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"AWS Marketplace de seguridad","why":"Incorrecta. AWS Marketplace de seguridad: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"AWS Security Blog","why":"Correcta. AWS Security Blog responde a la necesidad 1: publica novedades y prácticas de seguridad de AWS en artículos técnicos."},{"l":"E","t":"Amazon Cognito","why":"Correcta. Amazon Cognito responde a la necesidad 2: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles."}],"key":["D","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0141","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: dos empresas quieren consumir un servicio AWS por una ruta privada sin exponer tráfico a Internet. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"AWS Site-to-Site VPN","why":"Incorrecta. AWS Site-to-Site VPN: conecta redes locales a VPC mediante túneles cifrados sobre una red IP. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: expone servicios de forma privada mediante endpoints sin usar Internet público."},{"l":"B","t":"Lista de control de acceso de red (NACL)","why":"Incorrecta. Lista de control de acceso de red (NACL): filtro sin estado que aplica reglas de entrada y salida a nivel de subred. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: expone servicios de forma privada mediante endpoints sin usar Internet público."},{"l":"C","t":"AWS PrivateLink","why":"Correcta. AWS PrivateLink: expone servicios de forma privada mediante endpoints sin usar Internet público. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Subred pública","why":"Incorrecta. Subred pública: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: expone servicios de forma privada mediante endpoints sin usar Internet público."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0142","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una empresa compara nube y centro de datos incluyendo electricidad espacio mantenimiento y licencias. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Costo total de propiedad (TCO)","why":"Correcta. Costo total de propiedad (TCO): considera costos directos e indirectos de operar una solución durante su vida útil. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Costos variables frente a fijos","why":"Incorrecta. Costos variables frente a fijos: distingue consumo flexible mensual de inversión inicial inmovilizada. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: considera costos directos e indirectos de operar una solución durante su vida útil."},{"l":"C","t":"Bring Your Own License (BYOL)","why":"Incorrecta. Bring Your Own License (BYOL): permite aprovechar licencias de software propias cuando lo permiten sus términos. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: considera costos directos e indirectos de operar una solución durante su vida útil."},{"l":"D","t":"Licencia incluida","why":"Incorrecta. Licencia incluida: incorpora el cargo de licencia aplicable en el precio del servicio. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: considera costos directos e indirectos de operar una solución durante su vida útil."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0143","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) una plataforma transmite grandes volúmenes desde AWS a clientes de Internet y debe estimar cargos de egreso; (2) una compañía requiere identificar hosts físicos para administrar ciertos requisitos de licenciamiento por servidor. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Transferencia de datos saliente + Instancias Spot","why":"Incorrecta. cumple el requisito 1: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. NO cumple el requisito 2: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla."},{"l":"B","t":"Instancias bajo demanda (On-Demand) + Instancias Spot","why":"Incorrecta. NO cumple el requisito 1: paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable. NO cumple el requisito 2: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla."},{"l":"C","t":"Instancias bajo demanda (On-Demand) + Dedicated Hosts","why":"Incorrecta. NO cumple el requisito 1: paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable. cumple el requisito 2: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."},{"l":"D","t":"Transferencia de datos saliente + Dedicated Hosts","why":"Correcta. cumple el requisito 1: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. cumple el requisito 2: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0144","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) una compañía compara qué proveedor mantiene la infraestructura subyacente de una base RDS; (2) un grupo de trabajo pregunta quién debe corregir bibliotecas vulnerables incorporadas al paquete de su función Lambda; (3) una entidad ejecuta Windows en EC2 y requiere asignar responsables de parches del sistema invitado. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"Código y dependencias de Lambda","why":"Correcta. Se aplica a la situación 2: son responsabilidad del cliente que publica y mantiene su propia función."},{"l":"B","t":"Parches de infraestructura de RDS","why":"Correcta. Se aplica a la situación 1: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS."},{"l":"C","t":"Seguridad del hipervisor administrado por AWS","why":"Incorrecta. Seguridad del hipervisor administrado por AWS AWS administra la virtualización e infraestructura subyacente de EC2. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"D","t":"Seguridad física del centro de datos","why":"Incorrecta. Seguridad física del centro de datos: AWS controla acceso físico energía y protección de instalaciones de sus regiones. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"E","t":"Parches del SO invitado en EC2","why":"Correcta. Se aplica a la situación 3: normalmente corresponden al cliente para sistemas operativos de instancias EC2."},{"l":"F","t":"Configuración de grupos de seguridad","why":"Incorrecta. Configuración de grupos de seguridad el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."}],"key":["A","B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0145","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Una empresa está evaluando AWS: una empresa exige proteger el ingreso a la consola incluso si se filtra una contraseña. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Autenticación multifactor (MFA)","why":"Correcta. Autenticación multifactor (MFA): añade un factor adicional para autenticarse además de contraseña o credencial inicial. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS STS","why":"Incorrecta. AWS STS: emite credenciales de seguridad temporales para sesiones y roles. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: añade un factor adicional para autenticarse además de contraseña o credencial inicial."},{"l":"C","t":"AWS IAM Identity Center","why":"Incorrecta. AWS IAM Identity Center: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: añade un factor adicional para autenticarse además de contraseña o credencial inicial."},{"l":"D","t":"Usuario raíz (root)","why":"Incorrecta. Usuario raíz (root): es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: añade un factor adicional para autenticarse además de contraseña o credencial inicial."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0146","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una plataforma monolítica requiere más RAM en su instancia sin distribuirse entre múltiples servidores; (2) una empresa comercial requiere agregar recursos en picos de minutos y retirarlos al terminar la promoción. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Alta disponibilidad + Servicios administrados","why":"Incorrecta. NO cumple el requisito 1: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos. NO cumple el requisito 2: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente."},{"l":"B","t":"Alta disponibilidad + Elasticidad","why":"Incorrecta. NO cumple el requisito 1: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos. cumple el requisito 2: ajusta automáticamente la capacidad en función de cambios de demanda y puede reducirla cuando baja."},{"l":"C","t":"Escalabilidad vertical + Elasticidad","why":"Correcta. cumple el requisito 1: aumenta recursos de un único servidor como memoria o CPU. cumple el requisito 2: ajusta automáticamente la capacidad en función de cambios de demanda y puede reducirla cuando baja."},{"l":"D","t":"Escalabilidad vertical + Servicios administrados","why":"Incorrecta. cumple el requisito 1: aumenta recursos de un único servidor como memoria o CPU. NO cumple el requisito 2: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0147","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una base de datos residente en memoria necesita más RAM por vCPU. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Instancias EC2 optimizadas para memoria","why":"Correcta. Instancias EC2 optimizadas para memoria: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon ECR","why":"Incorrecta. Amazon ECR: registra y almacena imágenes de contenedores para despliegues. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria."},{"l":"C","t":"Amazon ECS","why":"Incorrecta. Amazon ECS: orquesta contenedores mediante un servicio de administración propio de AWS. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria."},{"l":"D","t":"AWS Lambda","why":"Incorrecta. AWS Lambda: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0148","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"En un proyecto que utilizará AWS, una aplicación ejecutada en AWS debe evitar secretos de larga duración para acceso a servicios. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Gestión de permisos con políticas administradas","why":"Incorrecta. Gestión de permisos con políticas administradas: reutiliza políticas IAM que pueden vincularse a varias identidades. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reduce exposición al expirar automáticamente las credenciales de sesión."},{"l":"B","t":"Rol IAM","why":"Incorrecta. Rol IAM: otorga credenciales temporales que pueden asumirse por principales autorizados. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reduce exposición al expirar automáticamente las credenciales de sesión."},{"l":"C","t":"Credenciales de acceso programático","why":"Incorrecta. Credenciales de acceso programático: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reduce exposición al expirar automáticamente las credenciales de sesión."},{"l":"D","t":"Acceso mediante credenciales temporales","why":"Correcta. Acceso mediante credenciales temporales: reduce exposición al expirar automáticamente las credenciales de sesión. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0149","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Una organización compara opciones en la nube: una multinacional quiere organizar múltiples cuentas bajo una estructura administrada centralmente. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"AWS Config","why":"Incorrecta. AWS Config: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: agrupa cuentas para aplicar gobierno y facturación centralizada."},{"l":"B","t":"AWS Organizations","why":"Correcta. AWS Organizations: agrupa cuentas para aplicar gobierno y facturación centralizada. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: agrupa cuentas para aplicar gobierno y facturación centralizada."},{"l":"D","t":"AWS IAM Access Analyzer","why":"Incorrecta. AWS IAM Access Analyzer: identifica acceso externo no previsto y ayuda a analizar permisos de recursos e identidades. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: agrupa cuentas para aplicar gobierno y facturación centralizada."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0150","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una función procesa archivos al subirse a S3 evitando mantener una instancia encendida; (2) un grupo de trabajo ejecuta contenedores y busca evitar operar nodos EC2 de su clúster. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Lambda","why":"Correcta. AWS Lambda responde a la necesidad 1: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso."},{"l":"B","t":"AWS Fargate","why":"Correcta. AWS Fargate responde a la necesidad 2: ejecuta contenedores sin administrar servidores de host para ECS o EKS compatibles."},{"l":"C","t":"Instancias EC2 optimizadas para memoria","why":"Incorrecta. Instancias EC2 optimizadas para memoria: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Instancias EC2 optimizadas para cómputo","why":"Incorrecta. Instancias EC2 optimizadas para cómputo: aportan proporción alta de potencia de CPU para cargas intensivas en procesamiento. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Amazon EC2","why":"Incorrecta. Amazon EC2 ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0151","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una compañía con cargas de producción requiere un nivel inicial de soporte técnico pagado para operación; (2) un integrante del equipo técnico busca plantear una duda técnica a una comunidad de expertos y usuarios AWS. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Unified Operations","why":"Incorrecta. AWS Unified Operations: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"AWS Marketplace","why":"Incorrecta. AWS Marketplace: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"AWS re:Post","why":"Correcta. AWS re:Post responde a la necesidad 2: comunidad de preguntas y respuestas técnicas sobre AWS."},{"l":"D","t":"AWS Business Support+","why":"Correcta. AWS Business Support+ responde a la necesidad 1: plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada."},{"l":"E","t":"AWS Basic Support","why":"Incorrecta. AWS Basic Support proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0152","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Alta","text":"Una organización compara opciones en la nube: una empresa debe capacitar empleados y redefinir roles para adoptar trabajo en la nube. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Perspectiva de personas de AWS CAF","why":"Correcta. Perspectiva de personas de AWS CAF: aborda habilidades cultura organización y preparación de la fuerza laboral. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Perspectiva de seguridad de AWS CAF","why":"Incorrecta. Perspectiva de seguridad de AWS CAF: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aborda habilidades cultura organización y preparación de la fuerza laboral."},{"l":"C","t":"Perspectiva de operaciones de AWS CAF","why":"Incorrecta. Perspectiva de operaciones de AWS CAF: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aborda habilidades cultura organización y preparación de la fuerza laboral."},{"l":"D","t":"Perspectiva de plataforma de AWS CAF","why":"Incorrecta. Perspectiva de plataforma de AWS CAF: se centra en construir y modernizar la plataforma tecnológica en la nube. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aborda habilidades cultura organización y preparación de la fuerza laboral."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0153","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una empresa consulta informes mensuales poco frecuentes pero exige acceso inmediato y resiliencia multizona. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"S3 Intelligent-Tiering","why":"Incorrecta. S3 Intelligent-Tiering: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena objetos poco consultados con recuperación rápida y resiliencia multizona."},{"l":"B","t":"S3 Glacier Flexible Retrieval","why":"Incorrecta. S3 Glacier Flexible Retrieval: archiva datos rara vez consultados con recuperaciones en minutos u horas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena objetos poco consultados con recuperación rápida y resiliencia multizona."},{"l":"C","t":"S3 Standard-IA","why":"Correcta. S3 Standard-IA: almacena objetos poco consultados con recuperación rápida y resiliencia multizona. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"S3 Glacier Deep Archive","why":"Incorrecta. S3 Glacier Deep Archive: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena objetos poco consultados con recuperación rápida y resiliencia multizona."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0154","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) los objetos tienen frecuencias de consulta impredecibles y se busca optimizar almacenamiento de forma automática; (2) una entidad conserva documentos por décadas y tolera recuperaciones de muchas horas; (3) una plataforma requiere guardar millones de fotografías como objetos accesibles por URL y API. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"S3 Glacier Deep Archive","why":"Correcta. Se aplica a la situación 2: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas."},{"l":"B","t":"S3 Standard-IA","why":"Incorrecta. S3 Standard-IA almacena objetos poco consultados con recuperación rápida y resiliencia multizona. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"C","t":"AWS Backup","why":"Incorrecta. AWS Backup: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"D","t":"Amazon S3","why":"Correcta. Se aplica a la situación 3: almacena objetos en buckets con acceso basado en API y alta durabilidad."},{"l":"E","t":"S3 Intelligent-Tiering","why":"Correcta. Se aplica a la situación 1: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización."},{"l":"F","t":"S3 Glacier Instant Retrieval","why":"Incorrecta. S3 Glacier Instant Retrieval guarda archivos de acceso muy infrecuente que requieren recuperación en milisegundos. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."}],"key":["A","D","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0155","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Alta","text":"Una empresa está evaluando AWS: un área de TI reorganiza observabilidad operación e incidentes para los servicios en AWS. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Perspectiva de gobernanza de AWS CAF","why":"Incorrecta. Perspectiva de gobernanza de AWS CAF: orienta transformación mediante gestión de riesgos carteras y control organizacional. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube."},{"l":"B","t":"Perspectiva de operaciones de AWS CAF","why":"Correcta. Perspectiva de operaciones de AWS CAF: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Perspectiva de seguridad de AWS CAF","why":"Incorrecta. Perspectiva de seguridad de AWS CAF: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube."},{"l":"D","t":"Perspectiva de personas de AWS CAF","why":"Incorrecta. Perspectiva de personas de AWS CAF: aborda habilidades cultura organización y preparación de la fuerza laboral. Aunque está relacionada con caf, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0156","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Una organización compara opciones en la nube: una aplicación analiza eventos de clics continuamente conforme llegan. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"AWS Glue","why":"Incorrecta. AWS Glue: integra datos mediante procesos ETL y catálogo de metadatos administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ingiere y procesa flujos de datos en tiempo real a escala."},{"l":"B","t":"Amazon Kinesis","why":"Correcta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon Textract","why":"Incorrecta. Amazon Textract: extrae texto y estructura de documentos como tablas y formularios. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ingiere y procesa flujos de datos en tiempo real a escala."},{"l":"D","t":"Amazon Polly","why":"Incorrecta. Amazon Polly: convierte texto en voz sintetizada para aplicaciones. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ingiere y procesa flujos de datos en tiempo real a escala."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0157","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"Una organización compara opciones en la nube: una empresa necesita un servicio relacional de AWS optimizado y compatible con PostgreSQL. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon Aurora","why":"Correcta. Amazon Aurora: ofrece un motor relacional administrado compatible con MySQL o PostgreSQL y arquitectura de almacenamiento propia. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon Neptune","why":"Incorrecta. Amazon Neptune: proporciona una base de datos de grafos administrada para relaciones conectadas. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece un motor relacional administrado compatible con MySQL o PostgreSQL y arquitectura de almacenamiento propia."},{"l":"C","t":"Amazon Redshift","why":"Incorrecta. Amazon Redshift: ejecuta analítica SQL de almacén de datos para grandes volúmenes. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece un motor relacional administrado compatible con MySQL o PostgreSQL y arquitectura de almacenamiento propia."},{"l":"D","t":"Amazon DynamoDB","why":"Incorrecta. Amazon DynamoDB: proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece un motor relacional administrado compatible con MySQL o PostgreSQL y arquitectura de almacenamiento propia."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0158","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una empresa quiere atenuar inundaciones volumétricas de tráfico contra una aplicación. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"AWS WAF","why":"Incorrecta. AWS WAF: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: protege contra ataques de denegación de servicio distribuido DDoS."},{"l":"B","t":"AWS Shield","why":"Correcta. AWS Shield: protege contra ataques de denegación de servicio distribuido DDoS. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon Cognito","why":"Incorrecta. Amazon Cognito: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: protege contra ataques de denegación de servicio distribuido DDoS."},{"l":"D","t":"Bloqueo de acceso público de S3","why":"Incorrecta. Bloqueo de acceso público de S3: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: protege contra ataques de denegación de servicio distribuido DDoS."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0159","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un operador busca acercar copias de contenido a espectadores en otras ciudades. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Ubicación perimetral (edge location)","why":"Correcta. Ubicación perimetral (edge location): punto de presencia cercano a usuarios para entrega de contenido y ciertos servicios periféricos. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS CloudFormation","why":"Incorrecta. AWS CloudFormation: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: punto de presencia cercano a usuarios para entrega de contenido y ciertos servicios periféricos."},{"l":"C","t":"Zona de disponibilidad (AZ)","why":"Incorrecta. Zona de disponibilidad (AZ): ubicación físicamente independiente dentro de una región con infraestructura redundante. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: punto de presencia cercano a usuarios para entrega de contenido y ciertos servicios periféricos."},{"l":"D","t":"AWS Outposts","why":"Incorrecta. AWS Outposts: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: punto de presencia cercano a usuarios para entrega de contenido y ciertos servicios periféricos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0160","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un administrador quiere encontrar CVE relevantes para imágenes de contenedor y cargas compatibles. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon Inspector","why":"Correcta. Amazon Inspector: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Security Blog","why":"Incorrecta. AWS Security Blog: publica novedades y prácticas de seguridad de AWS en artículos técnicos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles."},{"l":"C","t":"Bloqueo de acceso público de S3","why":"Incorrecta. Bloqueo de acceso público de S3: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles."},{"l":"D","t":"AWS WAF","why":"Incorrecta. AWS WAF: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0161","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) un grupo de trabajo busca reducir horas dedicadas a aprovisionar manualmente decenas de entornos; (2) Durante un nuevo proyecto, un analista debe identificar gastos locales que no aparecen en el costo de compra de servidores. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Costo total de propiedad (TCO)","why":"Incorrecta. Costo total de propiedad (TCO): considera costos directos e indirectos de operar una solución durante su vida útil. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"Automatización como ahorro","why":"Correcta. Automatización como ahorro responde a la necesidad 1: reduce trabajo manual y errores operativos por procesos repetibles."},{"l":"C","t":"Bring Your Own License (BYOL)","why":"Incorrecta. Bring Your Own License (BYOL) permite aprovechar licencias de software propias cuando lo permiten sus términos. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Licencia incluida","why":"Incorrecta. Licencia incluida: incorpora el cargo de licencia aplicable en el precio del servicio. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Costos ocultos de centros de datos","why":"Correcta. Costos ocultos de centros de datos responde a la necesidad 2: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos."}],"key":["B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0162","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: se expuso un bucket por una política pública excesiva y deben asignarse las responsabilidades. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Configuración de grupos de seguridad","why":"Incorrecta. Configuración de grupos de seguridad: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets."},{"l":"B","t":"Parches del SO invitado en EC2","why":"Incorrecta. Parches del SO invitado en EC2: normalmente corresponden al cliente para sistemas operativos de instancias EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets."},{"l":"C","t":"Política de bucket S3","why":"Correcta. Política de bucket S3: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Parches de infraestructura de RDS","why":"Incorrecta. Parches de infraestructura de RDS: son administrados por AWS para la infraestructura y componentes gestionados de Amazon RDS. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0163","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) Durante un nuevo proyecto, una auditoría identifica aplicaciones antiguas sin usuarios que no deben migrarse; (2) Durante un nuevo proyecto, una dirección exige estimar el beneficio económico antes de migrar sus servidores. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Refactoring (refactor)","why":"Incorrecta. Refactoring (refactor): rediseña significativamente la aplicación para aprovechar capacidades nativas de nube. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Retiring (retire)","why":"Correcta. Retiring (retire) responde a la necesidad 1: elimina aplicaciones que ya no generan valor o no son necesarias."},{"l":"C","t":"Relocating (relocate)","why":"Incorrecta. Relocating (relocate) mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"AWS Migration Hub","why":"Incorrecta. AWS Migration Hub: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Migration Evaluator","why":"Correcta. Migration Evaluator responde a la necesidad 2: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura."}],"key":["B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0164","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Una empresa está evaluando AWS: una organización prioriza confidencialidad controles de acceso y respuesta a incidentes. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Seguridad","why":"Correcta. Seguridad: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Diseño sin estado","why":"Incorrecta. Diseño sin estado: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos."},{"l":"C","t":"Excelencia operativa","why":"Incorrecta. Excelencia operativa: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos."},{"l":"D","t":"Eficiencia del rendimiento","why":"Incorrecta. Eficiencia del rendimiento: pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0165","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una organización requiere continuidad de negocio si toda su región principal deja de funcionar. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Modelo híbrido de nube","why":"Incorrecta. Modelo híbrido de nube: combina infraestructura local y recursos de nube conectados. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: despliega o replica recursos en regiones distintas para objetivos globales y recuperación."},{"l":"B","t":"Zona de disponibilidad (AZ)","why":"Incorrecta. Zona de disponibilidad (AZ): ubicación físicamente independiente dentro de una región con infraestructura redundante. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: despliega o replica recursos en regiones distintas para objetivos globales y recuperación."},{"l":"C","t":"AWS CloudFormation","why":"Incorrecta. AWS CloudFormation: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: despliega o replica recursos en regiones distintas para objetivos globales y recuperación."},{"l":"D","t":"Arquitectura multirregión","why":"Correcta. Arquitectura multirregión: despliega o replica recursos en regiones distintas para objetivos globales y recuperación. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0166","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una base de datos interna no debe ser accesible directamente desde Internet. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Subred privada","why":"Correcta. Subred privada: no dispone de una ruta directa al internet gateway para exposición pública. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Global Accelerator","why":"Incorrecta. AWS Global Accelerator: mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: no dispone de una ruta directa al internet gateway para exposición pública."},{"l":"C","t":"Amazon API Gateway","why":"Incorrecta. Amazon API Gateway: crea publica administra y protege APIs para clientes que acceden a backends. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: no dispone de una ruta directa al internet gateway para exposición pública."},{"l":"D","t":"Grupo de seguridad","why":"Incorrecta. Grupo de seguridad: firewall virtual con estado asociado a interfaces y recursos compatibles. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: no dispone de una ruta directa al internet gateway para exposición pública."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0167","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una plataforma requiere milisegundos de latencia para millones de elementos sin gestionar servidores; (2) una empresa comercial busca guardar temporalmente resultados de consultas recurrentes en memoria. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Neptune","why":"Incorrecta. Amazon Neptune proporciona una base de datos de grafos administrada para relaciones conectadas. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Amazon DynamoDB","why":"Correcta. Amazon DynamoDB responde a la necesidad 1: proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable."},{"l":"C","t":"Amazon ElastiCache","why":"Correcta. Amazon ElastiCache responde a la necesidad 2: ofrece almacenes de caché en memoria administrados para disminuir latencia."},{"l":"D","t":"Amazon RDS","why":"Incorrecta. Amazon RDS: administra bases de datos relacionales compatibles y tareas como backups y mantenimiento. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"AWS DMS","why":"Incorrecta. AWS DMS: migra o replica datos de bases con cambios mínimos y admite migraciones heterogéneas. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["B","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0168","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"Un cliente plantea esta situación: una compañía centraliza datos para consultas BI analíticas sobre un data warehouse. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Amazon Aurora","why":"Incorrecta. Amazon Aurora: ofrece un motor relacional administrado compatible con MySQL o PostgreSQL y arquitectura de almacenamiento propia. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta analítica SQL de almacén de datos para grandes volúmenes."},{"l":"B","t":"Amazon Redshift","why":"Correcta. Amazon Redshift: ejecuta analítica SQL de almacén de datos para grandes volúmenes. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon DocumentDB","why":"Incorrecta. Amazon DocumentDB: proporciona una base de documentos administrada compatible con APIs de MongoDB. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta analítica SQL de almacén de datos para grandes volúmenes."},{"l":"D","t":"AWS SCT","why":"Incorrecta. AWS SCT: ayuda a convertir esquemas y objetos de bases de datos entre motores diferentes. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta analítica SQL de almacén de datos para grandes volúmenes."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0169","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) Durante un nuevo proyecto, una fábrica debe recibir telemetría de miles de sensores conectados; (2) un grupo de trabajo busca orquestar source build y deployment en una canalización de entrega. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Amazon SQS + Amazon EventBridge","why":"Incorrecta. NO cumple el requisito 1: desacopla componentes mediante colas de mensajes que consumidores recuperan. NO cumple el requisito 2: enruta eventos desde distintas fuentes a destinos mediante reglas."},{"l":"B","t":"AWS IoT Core + Amazon EventBridge","why":"Incorrecta. cumple el requisito 1: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube. NO cumple el requisito 2: enruta eventos desde distintas fuentes a destinos mediante reglas."},{"l":"C","t":"Amazon SQS + AWS CodePipeline","why":"Incorrecta. NO cumple el requisito 1: desacopla componentes mediante colas de mensajes que consumidores recuperan. cumple el requisito 2: coordina fases automatizadas de entrega continua desde origen hasta despliegue."},{"l":"D","t":"AWS IoT Core + AWS CodePipeline","why":"Correcta. cumple el requisito 1: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube. cumple el requisito 2: coordina fases automatizadas de entrega continua desde origen hasta despliegue."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0170","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un grupo de trabajo requiere descubrir esquemas y transformar conjuntos de datos para analítica; (2) un comercio convierte de forma automática descripciones escritas de productos de español a francés. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Kinesis","why":"Incorrecta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"Amazon Translate","why":"Correcta. Amazon Translate responde a la necesidad 2: traduce texto entre idiomas mediante modelos administrados."},{"l":"C","t":"AWS Glue","why":"Correcta. AWS Glue responde a la necesidad 1: integra datos mediante procesos ETL y catálogo de metadatos administrados."},{"l":"D","t":"Amazon Transcribe","why":"Incorrecta. Amazon Transcribe convierte audio hablado a texto mediante reconocimiento automático de voz. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"Amazon Q","why":"Incorrecta. Amazon Q: ofrece asistentes de IA generativa para tareas empresariales y desarrollo según producto. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["B","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0171","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: un equipo archiva miniaturas reconstruibles y acepta no sobrevivir a pérdida de su AZ. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Amazon EBS","why":"Incorrecta. Amazon EBS: aporta volúmenes de almacenamiento en bloques persistente para instancias EC2. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena datos recreables poco consultados en una sola AZ para reducir costo."},{"l":"B","t":"AWS Storage Gateway","why":"Incorrecta. AWS Storage Gateway: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena datos recreables poco consultados en una sola AZ para reducir costo."},{"l":"C","t":"S3 One Zone-IA","why":"Correcta. S3 One Zone-IA: almacena datos recreables poco consultados en una sola AZ para reducir costo. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"S3 Standard-IA","why":"Incorrecta. S3 Standard-IA: almacena objetos poco consultados con recuperación rápida y resiliencia multizona. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: almacena datos recreables poco consultados en una sola AZ para reducir costo."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0172","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Una empresa está evaluando AWS: una organización necesita desplegar reglas AWS WAF comunes en muchas cuentas. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS Secrets Manager","why":"Incorrecta. AWS Secrets Manager: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles."},{"l":"B","t":"AWS Security Hub","why":"Incorrecta. AWS Security Hub: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles."},{"l":"C","t":"AWS Firewall Manager","why":"Correcta. AWS Firewall Manager: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Organizations","why":"Incorrecta. AWS Organizations: agrupa cuentas para aplicar gobierno y facturación centralizada. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0173","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una administradora busca crear manualmente una instancia desde un navegador sin instalar herramientas; (2) Durante un nuevo proyecto, un hospital debe mantener parte del sistema en su centro de datos mientras aprovecha AWS. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"AWS Management Console + Modelo híbrido de nube","why":"Correcta. cumple el requisito 1: interfaz web gráfica para administrar servicios y recursos de AWS. cumple el requisito 2: combina infraestructura local y recursos de nube conectados."},{"l":"B","t":"Región AWS + AWS CLI","why":"Incorrecta. NO cumple el requisito 1: área geográfica con múltiples zonas de disponibilidad separadas. NO cumple el requisito 2: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts."},{"l":"C","t":"Región AWS + Modelo híbrido de nube","why":"Incorrecta. NO cumple el requisito 1: área geográfica con múltiples zonas de disponibilidad separadas. cumple el requisito 2: combina infraestructura local y recursos de nube conectados."},{"l":"D","t":"AWS Management Console + AWS CLI","why":"Incorrecta. cumple el requisito 1: interfaz web gráfica para administrar servicios y recursos de AWS. NO cumple el requisito 2: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0174","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Alta","text":"En un proyecto que utilizará AWS, una organización global necesita la modalidad más especializada para operar cargas de misión crítica. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"AWS Basic Support","why":"Incorrecta. AWS Basic Support: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones."},{"l":"B","t":"AWS Unified Operations","why":"Correcta. AWS Unified Operations: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS Professional Services","why":"Incorrecta. AWS Professional Services: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones."},{"l":"D","t":"AWS re:Post","why":"Incorrecta. AWS re:Post: comunidad de preguntas y respuestas técnicas sobre AWS. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0175","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un proceso de aprobación debe coordinar múltiples funciones y decisiones encadenadas; (2) un evento debe notificarse en paralelo a múltiples sistemas mediante tópicos. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"AWS Step Functions + Amazon SNS","why":"Correcta. cumple el requisito 1: orquesta flujos de trabajo por estados con pasos y manejo de errores. cumple el requisito 2: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores."},{"l":"B","t":"AWS Amplify + Amazon SNS","why":"Incorrecta. NO cumple el requisito 1: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios. cumple el requisito 2: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores."},{"l":"C","t":"AWS Step Functions + AWS X-Ray","why":"Incorrecta. cumple el requisito 1: orquesta flujos de trabajo por estados con pasos y manejo de errores. NO cumple el requisito 2: ayuda a ras

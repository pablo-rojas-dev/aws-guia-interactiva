azon Comprehend","why":"Correcta. Amazon Comprehend: extrae información del lenguaje natural como entidades y sentimientos de texto. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon Athena","why":"Incorrecta. Amazon Athena: consulta directamente datos almacenados en S3 mediante SQL sin aprovisionar servidores. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: extrae información del lenguaje natural como entidades y sentimientos de texto."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0349","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un grupo de trabajo legal requiere descargar informes SOC de AWS para su auditoría; (2) una entidad busca conocer la evolución de una regla de seguridad y detectar configuraciones no conformes. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Config","why":"Correcta. AWS Config responde a la necesidad 2: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos."},{"l":"B","t":"AWS Control Tower","why":"Incorrecta. AWS Control Tower: facilita configurar y gobernar un entorno de múltiples cuentas con controles. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"AWS Artifact","why":"Correcta. AWS Artifact responde a la necesidad 1: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio."},{"l":"E","t":"AWS KMS","why":"Incorrecta. AWS KMS: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0350","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) un servidor en subred pública requiere una puerta de enlace de la VPC hacia Internet; (2) una sucursal busca enlazar su centro de datos a AWS mediante IPsec por Internet; (3) una compañía requiere definir rangos IP subredes y rutas de su entorno en AWS. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"Internet Gateway","why":"Correcta. Se aplica a la situación 1: habilita comunicación entre una VPC e Internet para recursos configurados adecuadamente."},{"l":"B","t":"Amazon VPC","why":"Correcta. Se aplica a la situación 3: proporciona una red virtual lógicamente aislada para recursos AWS."},{"l":"C","t":"Subred pública","why":"Incorrecta. Subred pública tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"D","t":"Amazon CloudFront","why":"Incorrecta. Amazon CloudFront: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"E","t":"AWS Global Accelerator","why":"Incorrecta. AWS Global Accelerator mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"F","t":"AWS Site-to-Site VPN","why":"Correcta. Se aplica a la situación 2: conecta redes locales a VPC mediante túneles cifrados sobre una red IP."}],"key":["A","B","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0351","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, una empresa busca el ahorro que AWS logra al comprar infraestructura a gran escala. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Pago por uso","why":"Incorrecta. Pago por uso: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reducen costos unitarios gracias al volumen agregado de demanda del proveedor."},{"l":"B","t":"Economías de escala","why":"Correcta. Economías de escala: reducen costos unitarios gracias al volumen agregado de demanda del proveedor. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Tolerancia a errores","why":"Incorrecta. Tolerancia a errores: continúa operando durante fallas de componentes con interrupción mínima o nula. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reducen costos unitarios gracias al volumen agregado de demanda del proveedor."},{"l":"D","t":"Escalabilidad horizontal","why":"Incorrecta. Escalabilidad horizontal: aumenta capacidad agregando más instancias o nodos en paralelo. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reducen costos unitarios gracias al volumen agregado de demanda del proveedor."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0352","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"Una organización compara opciones en la nube: una empresa quiere ver en un lugar central el estado de sus aplicaciones en migración. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Replatforming (replatform)","why":"Incorrecta. Replatforming (replatform): realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles."},{"l":"B","t":"AWS Migration Hub","why":"Correcta. AWS Migration Hub: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS Cloud Adoption Framework","why":"Incorrecta. AWS Cloud Adoption Framework: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles."},{"l":"D","t":"Retiring (retire)","why":"Incorrecta. Retiring (retire): elimina aplicaciones que ya no generan valor o no son necesarias. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0353","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una empresa emergente prepara una cotización mensual hipotética de EC2 RDS y transferencia antes de crearlos; (2) finanzas debe atribuir gasto a equipos mediante etiquetas como proyecto o centro de costo. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Pricing Calculator","why":"Correcta. AWS Pricing Calculator responde a la necesidad 1: estima costos futuros de arquitecturas y servicios antes de desplegarlos."},{"l":"B","t":"Facturación consolidada de AWS Organizations","why":"Incorrecta. Facturación consolidada de AWS Organizations: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Etiquetas de asignación de costos","why":"Correcta. Etiquetas de asignación de costos responde a la necesidad 2: permiten desglosar gastos por metadatos de recursos tras activarlas para facturación."},{"l":"D","t":"AWS Budgets","why":"Incorrecta. AWS Budgets: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"AWS Cost Categories","why":"Incorrecta. AWS Cost Categories agrupa y clasifica líneas de costo usando reglas de negocio configuradas. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0354","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una cuenta experimental busca documentación y asistencia general de facturación sin suscripción prémium. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"AWS Basic Support","why":"Correcta. AWS Basic Support: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Marketplace","why":"Incorrecta. AWS Marketplace: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago."},{"l":"C","t":"AWS Prescriptive Guidance","why":"Incorrecta. AWS Prescriptive Guidance: publica estrategias patrones y guías para migración modernización y operación. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago."},{"l":"D","t":"AWS Enterprise Support","why":"Incorrecta. AWS Enterprise Support: plan prémium para cargas críticas de negocio con orientación experta y capacidades empresariales. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0355","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un equipo adjunta al rol de aplicación una política que permite PutObject en un bucket. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Credenciales de acceso programático","why":"Incorrecta. Credenciales de acceso programático: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados."},{"l":"B","t":"Usuario IAM","why":"Incorrecta. Usuario IAM: representa una identidad persistente en una cuenta con posibles credenciales de larga duración. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados."},{"l":"C","t":"Política basada en identidad IAM","why":"Correcta. Política basada en identidad IAM: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Federación de identidades","why":"Incorrecta. Federación de identidades: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0356","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un grupo de trabajo requiere una plataforma Kubernetes administrada y compatible con herramientas Kubernetes; (2) una base de datos residente en memoria requiere más RAM por vCPU. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Amazon EKS + Elastic Load Balancing","why":"Incorrecta. cumple el requisito 1: ofrece Kubernetes administrado para orquestar aplicaciones en contenedores. NO cumple el requisito 2: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador."},{"l":"B","t":"AWS Batch + Instancias EC2 optimizadas para memoria","why":"Incorrecta. NO cumple el requisito 1: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados. cumple el requisito 2: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria."},{"l":"C","t":"AWS Batch + Elastic Load Balancing","why":"Incorrecta. NO cumple el requisito 1: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados. NO cumple el requisito 2: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador."},{"l":"D","t":"Amazon EKS + Instancias EC2 optimizadas para memoria","why":"Correcta. cumple el requisito 1: ofrece Kubernetes administrado para orquestar aplicaciones en contenedores. cumple el requisito 2: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0357","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) Durante un nuevo proyecto, un auditor debe investigar qué identidad eliminó un recurso desde la consola o API; (2) un responsable de administración desea recomendaciones generales sobre recursos ociosos y configuraciones de seguridad. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Trusted Advisor","why":"Correcta. AWS Trusted Advisor responde a la necesidad 2: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas."},{"l":"B","t":"AWS Well-Architected Tool","why":"Incorrecta. AWS Well-Architected Tool: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"AWS CloudTrail","why":"Correcta. AWS CloudTrail responde a la necesidad 1: registra acciones de API y actividad de cuenta para auditoría de quién hizo qué y cuándo."},{"l":"D","t":"Service Control Policy (SCP)","why":"Incorrecta. Service Control Policy (SCP): establece el máximo conjunto de permisos posibles para cuentas en una organización. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"AWS Config","why":"Incorrecta. AWS Config registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["A","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0358","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, una empresa necesita identificar hosts físicos para administrar ciertos requisitos de licenciamiento por servidor. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Instancias reservadas (Reserved Instances)","why":"Incorrecta. Instancias reservadas (Reserved Instances): proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."},{"l":"B","t":"Transferencia de datos saliente","why":"Incorrecta. Transferencia de datos saliente: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."},{"l":"C","t":"Savings Plans","why":"Incorrecta. Savings Plans: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias."},{"l":"D","t":"Dedicated Hosts","why":"Correcta. Dedicated Hosts: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0359","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Una empresa está evaluando AWS: un equipo necesita crear el mismo entorno varias veces sin configuraciones manuales inconsistentes. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Seguridad","why":"Incorrecta. Seguridad: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: sustituye operaciones manuales repetitivas por procesos reproducibles."},{"l":"B","t":"Diseño sin estado","why":"Incorrecta. Diseño sin estado: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: sustituye operaciones manuales repetitivas por procesos reproducibles."},{"l":"C","t":"Acoplamiento débil","why":"Incorrecta. Acoplamiento débil: diseña componentes para depender poco unos de otros y limitar fallas en cascada. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: sustituye operaciones manuales repetitivas por procesos reproducibles."},{"l":"D","t":"Automatización de infraestructura","why":"Correcta. Automatización de infraestructura: sustituye operaciones manuales repetitivas por procesos reproducibles. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0360","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) una compañía busca evaluar una solución de un proveedor externo de ciberseguridad desde un catálogo AWS; (2) una compañía requiere impedir publicaciones públicas accidentales de datos en Amazon S3. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"AWS Marketplace de seguridad + Bloqueo de acceso público de S3","why":"Correcta. cumple el requisito 1: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. cumple el requisito 2: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos."},{"l":"B","t":"AWS Marketplace de seguridad + Amazon Macie","why":"Incorrecta. cumple el requisito 1: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. NO cumple el requisito 2: detecta y ayuda a clasificar datos confidenciales en Amazon S3."},{"l":"C","t":"Amazon Cognito + Amazon Macie","why":"Incorrecta. NO cumple el requisito 1: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles. NO cumple el requisito 2: detecta y ayuda a clasificar datos confidenciales en Amazon S3."},{"l":"D","t":"Amazon Cognito + Bloqueo de acceso público de S3","why":"Incorrecta. NO cumple el requisito 1: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles. cumple el requisito 2: aplica salvaguardas para prevenir exposición pública no deseada de buckets y objetos."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0361","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) un grupo de trabajo busca ejecutar tareas operativas repetibles en un conjunto de instancias administradas; (2) un auditor busca detectar políticas que permiten acceso a un bucket desde fuera de la organización. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Systems Manager","why":"Correcta. AWS Systems Manager responde a la necesidad 1: ayuda a visualizar y operar recursos incluidas automatización y administración de nodos."},{"l":"B","t":"AWS Security Hub","why":"Incorrecta. AWS Security Hub: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"AWS Well-Architected Tool","why":"Incorrecta. AWS Well-Architected Tool: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Service Control Policy (SCP)","why":"Incorrecta. Service Control Policy (SCP) establece el máximo conjunto de permisos posibles para cuentas en una organización. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"AWS IAM Access Analyzer","why":"Correcta. AWS IAM Access Analyzer responde a la necesidad 2: identifica acceso externo no previsto y ayuda a analizar permisos de recursos e identidades."}],"key":["A","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0362","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un grupo de trabajo requiere crear el mismo entorno múltiples veces sin configuraciones manuales inconsistentes; (2) un grupo de trabajo detecta servidores sobredimensionados y planea ajustar su capacidad tras medir utilización. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Eficiencia del rendimiento","why":"Incorrecta. Eficiencia del rendimiento pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Automatización de infraestructura","why":"Correcta. Automatización de infraestructura responde a la necesidad 1: sustituye operaciones manuales repetitivas por procesos reproducibles."},{"l":"C","t":"Arquitectura basada en eventos","why":"Incorrecta. Arquitectura basada en eventos: desacopla productores y consumidores mediante eventos que disparan reacciones. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Dimensionar según la demanda","why":"Correcta. Dimensionar según la demanda responde a la necesidad 2: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento."},{"l":"E","t":"Fiabilidad","why":"Incorrecta. Fiabilidad: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["B","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0363","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) Durante un nuevo proyecto, un proceso CLI heredado debe autenticarse para invocar APIs AWS y gestionar sus credenciales; (2) los empleados necesitan iniciar sesión una vez y acceder a múltiples cuentas AWS asignadas. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Credenciales de acceso programático + Política basada en identidad IAM","why":"Incorrecta. cumple el requisito 1: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias. NO cumple el requisito 2: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados."},{"l":"B","t":"Límite de permisos IAM + Política basada en identidad IAM","why":"Incorrecta. NO cumple el requisito 1: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. NO cumple el requisito 2: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados."},{"l":"C","t":"Credenciales de acceso programático + AWS IAM Identity Center","why":"Correcta. cumple el requisito 1: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias. cumple el requisito 2: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO."},{"l":"D","t":"Límite de permisos IAM + AWS IAM Identity Center","why":"Incorrecta. NO cumple el requisito 1: restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. cumple el requisito 2: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0364","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"Un cliente plantea esta situación: una organización necesita restaurar su servicio después de la pérdida de una región. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Recuperación ante desastres","why":"Correcta. Recuperación ante desastres: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Tolerancia a errores","why":"Incorrecta. Tolerancia a errores: continúa operando durante fallas de componentes con interrupción mínima o nula. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación."},{"l":"C","t":"Elasticidad","why":"Incorrecta. Elasticidad: ajusta automáticamente la capacidad en función de cambios de demanda y puede reducirla cuando baja. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación."},{"l":"D","t":"Alcance global","why":"Incorrecta. Alcance global: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0365","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una empresa busca reducir energía consumida por transacción y recursos infrautilizados. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Automatización de infraestructura","why":"Incorrecta. Automatización de infraestructura: sustituye operaciones manuales repetitivas por procesos reproducibles. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que minimiza impactos ambientales del uso de recursos."},{"l":"B","t":"Diseño para fallos","why":"Incorrecta. Diseño para fallos: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que minimiza impactos ambientales del uso de recursos."},{"l":"C","t":"Sostenibilidad","why":"Correcta. Sostenibilidad: pilar Well-Architected que minimiza impactos ambientales del uso de recursos. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Acoplamiento débil","why":"Incorrecta. Acoplamiento débil: diseña componentes para depender poco unos de otros y limitar fallas en cascada. Aunque está relacionada con arquitectura, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: pilar Well-Architected que minimiza impactos ambientales del uso de recursos."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0366","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Una empresa está evaluando AWS: una aplicación local necesita seguir usando interfaces de archivos mientras almacena datos en AWS. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS Storage Gateway","why":"Correcta. AWS Storage Gateway: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"S3 Standard","why":"Incorrecta. S3 Standard: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas."},{"l":"C","t":"AWS Backup","why":"Incorrecta. AWS Backup: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas."},{"l":"D","t":"S3 Glacier Instant Retrieval","why":"Incorrecta. S3 Glacier Instant Retrieval: guarda archivos de acceso muy infrecuente que requieren recuperación en milisegundos. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0367","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) un portal web requiere soportar mayor tráfico incorporando servidores adicionales detrás de un balanceador; (2) un grupo de trabajo busca probar una idea y descartarla con rapidez sin adquirir servidores. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Servicios administrados + Alta disponibilidad","why":"Incorrecta. NO cumple el requisito 1: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente. NO cumple el requisito 2: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos."},{"l":"B","t":"Escalabilidad horizontal + Alta disponibilidad","why":"Incorrecta. cumple el requisito 1: aumenta capacidad agregando más instancias o nodos en paralelo. NO cumple el requisito 2: mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos."},{"l":"C","t":"Escalabilidad horizontal + Agilidad","why":"Correcta. cumple el requisito 1: aumenta capacidad agregando más instancias o nodos en paralelo. cumple el requisito 2: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas."},{"l":"D","t":"Servicios administrados + Agilidad","why":"Incorrecta. NO cumple el requisito 1: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente. cumple el requisito 2: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0368","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una startup requiere servidores durante pocos días con uso incierto y no quiere compromisos de uno o tres años. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Instancias Spot","why":"Incorrecta. Instancias Spot: aprovechan capacidad EC2 ociosa con descuentos pero AWS puede interrumpirla. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable."},{"l":"B","t":"Dedicated Instances","why":"Incorrecta. Dedicated Instances: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable."},{"l":"C","t":"Savings Plans","why":"Incorrecta. Savings Plans: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable."},{"l":"D","t":"Instancias bajo demanda (On-Demand)","why":"Correcta. Instancias bajo demanda (On-Demand): paga capacidad de cómputo sin compromiso de largo plazo a la tarifa aplicable. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0369","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) un SOC requiere detectar comunicaciones sospechosas y posibles credenciales comprometidas; (2) un portal web requiere gestionar certificados usados para conexiones HTTPS; (3) una aplicación de clientes requiere altas de usuario e inicio de sesión sin crear cuentas IAM para consumidores. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"AWS Certificate Manager","why":"Correcta. Se aplica a la situación 2: aprovisiona y administra certificados TLS públicos o privados compatibles."},{"l":"B","t":"Cifrado en tránsito","why":"Incorrecta. Cifrado en tránsito protege datos mientras viajan por conexiones como TLS o VPN. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"C","t":"Amazon Cognito","why":"Correcta. Se aplica a la situación 3: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles."},{"l":"D","t":"Amazon GuardDuty","why":"Correcta. Se aplica a la situación 1: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad."},{"l":"E","t":"AWS WAF","why":"Incorrecta. AWS WAF filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"F","t":"AWS Shield","why":"Incorrecta. AWS Shield: protege contra ataques de denegación de servicio distribuido DDoS. Ninguna de las tres situaciones exige prioritariamente esta función."}],"key":["A","C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0370","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una entidad requiere desplegar reglas AWS WAF comunes en muchas cuentas; (2) un responsable de operaciones busca una alarma cuando la CPU de una instancia supera un umbral. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Security Hub","why":"Incorrecta. AWS Security Hub: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"AWS Artifact","why":"Incorrecta. AWS Artifact: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"AWS Resource Access Manager","why":"Incorrecta. AWS Resource Access Manager facilita compartir recursos AWS compatibles entre cuentas de forma controlada. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Amazon CloudWatch","why":"Correcta. Amazon CloudWatch responde a la necesidad 2: recopila métricas registros y alarmas para observar aplicaciones y recursos."},{"l":"E","t":"AWS Firewall Manager","why":"Correcta. AWS Firewall Manager responde a la necesidad 1: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles."}],"key":["D","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0371","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) una entidad requiere un HSM dedicado para operaciones criptográficas y administración propia de claves; (2) un responsable de operaciones requiere saber si un incidente de AWS está afectando específicamente sus recursos; (3) una entidad requiere desplegar reglas AWS WAF comunes en muchas cuentas. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"AWS Health Dashboard","why":"Correcta. Se aplica a la situación 2: muestra eventos de salud de servicios y eventos que pueden afectar recursos de la cuenta."},{"l":"B","t":"AWS CloudHSM","why":"Correcta. Se aplica a la situación 1: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente."},{"l":"C","t":"AWS KMS","why":"Incorrecta. AWS KMS crea y controla claves criptográficas utilizadas por servicios integrados para cifrado. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"D","t":"AWS Resource Access Manager","why":"Incorrecta. AWS Resource Access Manager facilita compartir recursos AWS compatibles entre cuentas de forma controlada. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"E","t":"AWS Firewall Manager","why":"Correcta. Se aplica a la situación 3: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles."},{"l":"F","t":"AWS Secrets Manager","why":"Incorrecta. AWS Secrets Manager: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos. Ninguna de las tres situaciones exige prioritariamente esta función."}],"key":["A","B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0372","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Una empresa está evaluando AWS: un analista quiere ejecutar consultas SQL ad hoc sobre archivos en un lago de datos S3. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Amazon Quick","why":"Incorrecta. Amazon Quick: ofrece capacidades de inteligencia de negocios y visualización de datos administradas. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: consulta directamente datos almacenados en S3 mediante SQL sin aprovisionar servidores."},{"l":"B","t":"Amazon SageMaker AI","why":"Incorrecta. Amazon SageMaker AI: proporciona capacidades para construir entrenar y desplegar modelos de machine learning. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: consulta directamente datos almacenados en S3 mediante SQL sin aprovisionar servidores."},{"l":"C","t":"Amazon Athena","why":"Correcta. Amazon Athena: consulta directamente datos almacenados en S3 mediante SQL sin aprovisionar servidores. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon Kinesis","why":"Incorrecta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: consulta directamente datos almacenados en S3 mediante SQL sin aprovisionar servidores."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0373","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un desarrollador sube su código web y quiere que AWS configure el entorno de ejecución asociado. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"AWS Fargate","why":"Incorrecta. AWS Fargate: ejecuta contenedores sin administrar servidores de host para ECS o EKS compatibles. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: despliega aplicaciones web y automatiza infraestructura mientras permite acceso a recursos subyacentes."},{"l":"B","t":"Instancias EC2 optimizadas para cómputo","why":"Incorrecta. Instancias EC2 optimizadas para cómputo: aportan proporción alta de potencia de CPU para cargas intensivas en procesamiento. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: despliega aplicaciones web y automatiza infraestructura mientras permite acceso a recursos subyacentes."},{"l":"C","t":"Amazon EC2 Auto Scaling","why":"Incorrecta. Amazon EC2 Auto Scaling: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: despliega aplicaciones web y automatiza infraestructura mientras permite acceso a recursos subyacentes."},{"l":"D","t":"AWS Elastic Beanstalk","why":"Correcta. AWS Elastic Beanstalk: despliega aplicaciones web y automatiza infraestructura mientras permite acceso a recursos subyacentes. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0374","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una compañía requiere conectividad dedicada predecible sin depender de un túnel VPN público; (2) un portal web de videos busca reducir latencia de contenido estático global mediante caché perimetral. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Direct Connect","why":"Correcta. AWS Direct Connect responde a la necesidad 1: proporciona conexión de red privada dedicada entre instalaciones y AWS."},{"l":"B","t":"Amazon CloudFront","why":"Correcta. Amazon CloudFront responde a la necesidad 2: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN."},{"l":"C","t":"AWS PrivateLink","why":"Incorrecta. AWS PrivateLink expone servicios de forma privada mediante endpoints sin usar Internet público. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Lista de control de acceso de red (NACL)","why":"Incorrecta. Lista de control de acceso de red (NACL): filtro sin estado que aplica reglas de entrada y salida a nivel de subred. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Grupo de seguridad","why":"Incorrecta. Grupo de seguridad: firewall virtual con estado asociado a interfaces y recursos compatibles. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0375","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una cuenta de auditoría requiere revisar recursos de producción sin crear usuarios allí; (2) un integrante del equipo técnico tiene Allow sobre S3 pero una política aplicable contiene Deny sobre DeleteObject. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Gestión de permisos con políticas administradas + Permisos explícitamente denegados","why":"Incorrecta. NO cumple el requisito 1: reutiliza políticas IAM que pueden vincularse a varias identidades. cumple el requisito 2: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM."},{"l":"B","t":"Rol entre cuentas + Permisos explícitamente denegados","why":"Correcta. cumple el requisito 1: autoriza que un principal de otra cuenta asuma una función con permisos temporales. cumple el requisito 2: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM."},{"l":"C","t":"Gestión de permisos con políticas administradas + Autenticación multifactor (MFA)","why":"Incorrecta. NO cumple el requisito 1: reutiliza políticas IAM que pueden vincularse a varias identidades. NO cumple el requisito 2: añade un factor adicional para autenticarse además de contraseña o credencial inicial."},{"l":"D","t":"Rol entre cuentas + Autenticación multifactor (MFA)","why":"Incorrecta. cumple el requisito 1: autoriza que un principal de otra cuenta asuma una función con permisos temporales. NO cumple el requisito 2: añade un factor adicional para autenticarse además de contraseña o credencial inicial."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0376","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) Durante un nuevo proyecto, un proceso CLI heredado debe autenticarse para invocar APIs AWS y gestionar sus credenciales; (2) un nuevo titular requiere identificar la identidad que debe guardarse con MFA y no usarse habitualmente. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Credenciales de acceso programático","why":"Correcta. Credenciales de acceso programático responde a la necesidad 1: identifican solicitudes firmadas de API mediante mecanismos como claves de acceso cuando son necesarias."},{"l":"B","t":"Usuario raíz (root)","why":"Correcta. Usuario raíz (root) responde a la necesidad 2: es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias."},{"l":"C","t":"Usuario IAM","why":"Incorrecta. Usuario IAM representa una identidad persistente en una cuenta con posibles credenciales de larga duración. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Política basada en identidad IAM","why":"Incorrecta. Política basada en identidad IAM: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Política de contraseñas IAM","why":"Incorrecta. Política de contraseñas IAM: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0377","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una empresa busca reemplazar inversiones iniciales en centros de datos por cargos mensuales variables. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Servicios administrados","why":"Incorrecta. Servicios administrados: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: desplaza inversiones en hardware hacia gastos asociados al uso."},{"l":"B","t":"Gasto operativo variable","why":"Correcta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Pago por uso","why":"Incorrecta. Pago por uso: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: desplaza inversiones en hardware hacia gastos asociados al uso."},{"l":"D","t":"Agilidad","why":"Incorrecta. Agilidad: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: desplaza inversiones en hardware hacia gastos asociados al uso."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0378","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"Una organización compara opciones en la nube: una tienda quiere activar flujos al recibir eventos de servicios SaaS y AWS. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon Connect","why":"Incorrecta. Amazon Connect: proporciona un centro de contacto omnicanal en la nube. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: enruta eventos desde distintas fuentes a destinos mediante reglas."},{"l":"B","t":"AWS CodePipeline","why":"Incorrecta. AWS CodePipeline: coordina fases automatizadas de entrega continua desde origen hasta despliegue. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: enruta eventos desde distintas fuentes a destinos mediante reglas."},{"l":"C","t":"Amazon EventBridge","why":"Correcta. Amazon EventBridge: enruta eventos desde distintas fuentes a destinos mediante reglas. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS CodeBuild","why":"Incorrecta. AWS CodeBuild: compila código ejecuta pruebas y produce artefactos en un entorno administrado. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: enruta eventos desde distintas fuentes a destinos mediante reglas."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0379","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Una empresa está evaluando AWS: un nuevo titular necesita identificar la identidad que debe guardarse con MFA y no usarse habitualmente. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Política basada en recurso","why":"Incorrecta. Política basada en recurso: se adjunta al recurso compatible para expresar quién puede actuar sobre él. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias."},{"l":"B","t":"AWS STS","why":"Incorrecta. AWS STS: emite credenciales de seguridad temporales para sesiones y roles. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias."},{"l":"C","t":"Usuario raíz (root)","why":"Correcta. Usuario raíz (root): es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Permisos explícitamente denegados","why":"Incorrecta. Permisos explícitamente denegados: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0380","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Alta","text":"Una organización compara opciones en la nube: una organización busca patrones de migración y mejores prácticas descritas paso a paso. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"AWS Professional Services","why":"Incorrecta. AWS Professional Services: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: publica estrategias patrones y guías para migración modernización y operación."},{"l":"B","t":"AWS Marketplace","why":"Incorrecta. AWS Marketplace: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: publica estrategias patrones y guías para migración modernización y operación."},{"l":"C","t":"AWS Business Support+","why":"Incorrecta. AWS Business Support+: plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: publica estrategias patrones y guías para migración modernización y operación."},{"l":"D","t":"AWS Prescriptive Guidance","why":"Correcta. AWS Prescriptive Guidance: publica estrategias patrones y guías para migración modernización y operación. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0381","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) el equipo SOC requiere un panel de hallazgos procedentes de múltiples servicios de seguridad; (2) Durante un nuevo proyecto, dos cuentas deben compartir subredes de una VPC sin duplicarlas. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Well-Architected Tool","why":"Incorrecta. AWS Well-Architected Tool: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"AWS Firewall Manager","why":"Incorrecta. AWS Firewall Manager administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"AWS Security Hub","why":"Correcta. AWS Security Hub responde a la necesidad 1: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares."},{"l":"D","t":"AWS Resource Access Manager","why":"Correcta. AWS Resource Access Manager responde a la necesidad 2: facilita compartir recursos AWS compatibles entre cuentas de forma controlada."},{"l":"E","t":"AWS CloudTrail","why":"Incorrecta. AWS CloudTrail: registra acciones de API y actividad de cuenta para auditoría de quién hizo qué y cuándo. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0382","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un grupo de trabajo pregunta quién actualiza la capa de hipervisor que soporta instancias virtuales de EC2; (2) Durante un nuevo proyecto, un auditor revisa qué actor realiza vigilancia y protección de edificios de AWS. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Seguridad del hipervisor administrado por AWS + Código y dependencias de Lambda","why":"Incorrecta. cumple el requisito 1: AWS administra la virtualización e infraestructura subyacente de EC2. NO cumple el requisito 2: son responsabilidad del cliente que publica y mantiene su propia función."},{"l":"B","t":"Política de bucket S3 + Seguridad física del centro de datos","why":"Incorrecta. NO cumple el requisito 1: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. cumple el requisito 2: AWS controla acceso físico energía y protección de instalaciones de sus regiones."},{"l":"C","t":"Política de bucket S3 + Código y dependencias de Lambda","why":"Incorrecta. NO cumple el requisito 1: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. NO cumple el requisito 2: son responsabilidad del cliente que publica y mantiene su propia función."},{"l":"D","t":"Seguridad del hipervisor administrado por AWS + Seguridad física del centro de datos","why":"Correcta. cumple el requisito 1: AWS administra la virtualización e infraestructura subyacente de EC2. cumple el requisito 2: AWS controla acceso físico energía y protección de instalaciones de sus regiones."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0383","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Una organización compara opciones en la nube: una empresa desea implementar servicios contenedorizados con un orquestador nativo AWS. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"AWS Lambda","why":"Incorrecta. AWS Lambda: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orquesta contenedores mediante un servicio de administración propio de AWS."},{"l":"B","t":"Amazon ECS","why":"Correcta. Amazon ECS: orquesta contenedores mediante un servicio de administración propio de AWS. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS Elastic Beanstalk","why":"Incorrecta. AWS Elastic Beanstalk: despliega aplicaciones web y automatiza infraestructura mientras permite acceso a recursos subyacentes. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orquesta contenedores mediante un servicio de administración propio de AWS."},{"l":"D","t":"Amazon Lightsail","why":"Incorrecta. Amazon Lightsail: ofrece servidores virtuales y recursos simplificados con paquetes predecibles. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: orquesta contenedores mediante un servicio de administración propio de AWS."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0384","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) un grupo financiero busca un plan de soporte con acompañamiento experto para cargas críticas de negocio; (2) Durante un nuevo proyecto, una cuenta experimental busca documentación y asistencia general de facturación sin suscripción prémium; (3) una compañía con cargas de producción requiere un nivel inicial de soporte técnico pagado para operación. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"AWS Marketplace","why":"Incorrecta. AWS Marketplace es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"B","t":"AWS Enterprise Support","why":"Correcta. Se aplica a la situación 1: plan prémium para cargas críticas de negocio con orientación experta y capacidades empresariales."},{"l":"C","t":"AWS Basic Support","why":"Correcta. Se aplica a la situación 2: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago."},{"l":"D","t":"AWS Unified Operations","why":"Incorrecta. AWS Unified Operations: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"E","t":"AWS Prescriptive Guidance","why":"Incorrecta. AWS Prescriptive Guidance publica estrategias patrones y guías para migración modernización y operación. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"F","t":"AWS Business Support+","why":"Correcta. Se aplica a la situación 3: plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada."}],"key":["B","C","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0385","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un administrador necesita permitir TCP 443 a un servidor y que las respuestas se acepten automáticamente. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon API Gateway","why":"Incorrecta. Amazon API Gateway: crea publica administra y protege APIs para clientes que acceden a backends. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: firewall virtual con estado asociado a interfaces y recursos compatibles."},{"l":"B","t":"Subred privada","why":"Incorrecta. Subred privada: no dispone de una ruta directa al internet gateway para exposición pública. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: firewall virtual con estado asociado a interfaces y recursos compatibles."},{"l":"C","t":"Grupo de seguridad","why":"Correcta. Grupo de seguridad: firewall virtual con estado asociado a interfaces y recursos compatibles. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Internet Gateway","why":"Incorrecta. Internet Gateway: habilita comunicación entre una VPC e Internet para recursos configurados adecuadamente. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: firewall virtual con estado asociado a interfaces y recursos compatibles."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0386","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) un sistema informático etiqueta de forma automática objetos presentes en fotografías; (2) Durante un nuevo proyecto, una aerolínea desea un bot que entienda intenciones y solicite parámetros a pasajeros. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Amazon Rekognition + Amazon Lex","why":"Correcta. cumple el requisito 1: analiza imágenes y video para detectar objetos textos y características visuales. cumple el requisito 2: permite crear interfaces conversacionales de voz y texto para chatbots."},{"l":"B","t":"Amazon Quick + AWS Glue","why":"Incorrecta. NO cumple el requisito 1: ofrece capacidades de inteligencia de negocios y visualización de datos administradas. NO cumple el requisito 2: integra datos mediante procesos ETL y catálogo de metadatos administrados."},{"l":"C","t":"Amazon Quick + Amazon Lex","why":"Incorrecta. NO cumple el requisito 1: ofrece capacidades de inteligencia de negocios y visualización de datos administradas. cumple el requisito 2: permite crear interfaces conversacionales de voz y texto para chatbots."},{"l":"D","t":"Amazon Rekognition + AWS Glue","why":"Incorrecta. cumple el requisito 1: analiza imágenes y video para detectar objetos textos y características visuales. NO cumple el requisito 2: integra datos mediante procesos ETL y catálogo de metadatos administrados."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0387","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una entidad traslada un conjunto de máquinas virtuales a un entorno compatible en AWS; (2) un grupo financiero busca mover servidores virtuales a AWS sin rediseñar inicialmente sus aplicaciones. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Replatforming (replatform)","why":"Incorrecta. Replatforming (replatform) realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Relocating (relocate)","why":"Correcta. Relocating (relocate) responde a la necesidad 1: mueve infraestructura virtualizada a la nube sin adquirir nuevo hardware ni rediseñar máquinas virtuales."},{"l":"C","t":"AWS Cloud Adoption Framework","why":"Incorrecta. AWS Cloud Adoption Framework: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Rehosting (rehost)","why":"Correcta. Rehosting (rehost) responde a la necesidad 2: traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift."},{"l":"E","t":"Repurchasing (repurchase)","why":"Incorrecta. Repurchasing (repurchase): reemplaza una solución existente por otro producto generalmente SaaS. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["B","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0388","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un equipo necesita exponer endpoints REST controlados frente a funciones Lambda. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon API Gateway","why":"Correcta. Amazon API Gateway: crea publica administra y protege APIs para clientes que acceden a backends. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Transit Gateway","why":"Incorrecta. AWS Transit Gateway: actúa como concentrador para conectar múltiples VPC y redes locales. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: crea publica administra y protege APIs para clientes que acceden a backends."},{"l":"C","t":"AWS Site-to-Site VPN","why":"Incorrecta. AWS Site-to-Site VPN: conecta redes locales a VPC mediante túneles cifrados sobre una red IP. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: crea publica administra y protege APIs para clientes que acceden a backends."},{"l":"D","t":"Amazon CloudFront","why":"Incorrecta. Amazon CloudFront: distribuye y almacena contenido en caché desde ubicaciones perimetrales como CDN. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: crea publica administra y protege APIs para clientes que acceden a backends."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0389","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) Durante un nuevo proyecto, trabajadores remotos necesitan un escritorio virtual de trabajo desde equipos personales; (2) una plataforma requiere enviar correos de confirmación de compra y recuperación de cuenta. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon EventBridge","why":"Incorrecta. Amazon EventBridge enruta eventos desde distintas fuentes a destinos mediante reglas. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Amazon WorkSpaces","why":"Correcta. Amazon WorkSpaces responde a la necesidad 1: proporciona escritorios virtuales persistentes administrados para usuarios."},{"l":"C","t":"AWS X-Ray","why":"Incorrecta. AWS X-Ray: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Amazon SES","why":"Correcta. Amazon SES responde a la necesidad 2: permite enviar correos electrónicos transaccionales y campañas mediante un servicio escalable."},{"l":"E","t":"AWS Amplify","why":"Incorrecta. AWS Amplify: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["B","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0390","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Una empresa está evaluando AWS: un laboratorio necesita procesar conjuntos masivos mediante trabajos Spark. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Amazon Kinesis","why":"Incorrecta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta marcos de big data como Apache Spark y Hadoop administrados."},{"l":"B","t":"Amazon Textract","why":"Incorrecta. Amazon Textract: extrae texto y estructura de documentos como tablas y formularios. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta marcos de big data como Apache Spark y Hadoop administrados."},{"l":"C","t":"Amazon EMR","why":"Correcta. Amazon EMR: ejecuta marcos de big data como Apache Spark y Hadoop administrados. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon Lex","why":"Incorrecta. Amazon Lex: permite crear interfaces conversacionales de voz y texto para chatbots. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta marcos de big data como Apache Spark y Hadoop administrados."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]}],"objectives":[{"id":"1.1","title":"Ventajas y valor de la nube de AWS","summary":"Por qué una organización migra: rapidez, elasticidad, alcance global y disponibilidad.","points":["Cloud computing ofrece capacidad bajo demanda y pago por uso; reduce la necesidad de comprar capacidad fija antes de necesitarla.","Elasticidad: capacidad que se ajusta al aumento y la disminución de la demanda; escalabilidad: capacidad de crecer para atender mayor carga.","Agilidad: aprovisionar recursos rápidamente para experimentar y lanzar productos; no equivale a garantizar que la aplicación sea rápida.","Alta disponibilidad: continuidad frente a fallos de componentes; tolerancia a fallos: capacidad de seguir operando aun si ciertos componentes fallan.","Economías de escala: grandes volúmenes permiten a AWS obtener eficiencia y trasladar parte del ahorro en sus precios."],"trap":"No confundas agilidad con escalabilidad ni elasticid

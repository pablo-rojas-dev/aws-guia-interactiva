urces":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0219","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"Un cliente plantea esta situación: una base de datos en EC2 necesita un disco persistente presentado como dispositivo de bloques. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Amazon EBS","why":"Correcta. Amazon EBS: aporta volúmenes de almacenamiento en bloques persistente para instancias EC2. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Backup","why":"Incorrecta. AWS Backup: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aporta volúmenes de almacenamiento en bloques persistente para instancias EC2."},{"l":"C","t":"S3 Standard","why":"Incorrecta. S3 Standard: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aporta volúmenes de almacenamiento en bloques persistente para instancias EC2."},{"l":"D","t":"S3 Standard-IA","why":"Incorrecta. S3 Standard-IA: almacena objetos poco consultados con recuperación rápida y resiliencia multizona. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aporta volúmenes de almacenamiento en bloques persistente para instancias EC2."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0220","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Una empresa está evaluando AWS: una organización necesita un HSM dedicado para operaciones criptográficas y administración propia de claves. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS CloudHSM","why":"Correcta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Artifact","why":"Incorrecta. AWS Artifact: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente."},{"l":"C","t":"AWS Firewall Manager","why":"Incorrecta. AWS Firewall Manager: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente."},{"l":"D","t":"Service Control Policy (SCP)","why":"Incorrecta. Service Control Policy (SCP): establece el máximo conjunto de permisos posibles para cuentas en una organización. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0221","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una empresa comercial busca que el módulo de cobros pueda evolucionar sin obligar a desplegar el de catálogo; (2) una plataforma web busca reemplazar servidores sin perder sesiones almacenadas localmente en ellos. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Diseño sin estado","why":"Correcta. Diseño sin estado responde a la necesidad 2: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado."},{"l":"B","t":"Diseño para fallos","why":"Incorrecta. Diseño para fallos asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"Seguridad","why":"Incorrecta. Seguridad: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Eficiencia del rendimiento","why":"Incorrecta. Eficiencia del rendimiento: pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Acoplamiento débil","why":"Correcta. Acoplamiento débil responde a la necesidad 1: diseña componentes para depender poco unos de otros y limitar fallas en cascada."}],"key":["A","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0222","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: una empresa debe decidir la ubicación geográfica donde alojará datos por residencia y latencia. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"AWS CLI","why":"Incorrecta. AWS CLI: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: área geográfica con múltiples zonas de disponibilidad separadas."},{"l":"B","t":"Zona de disponibilidad (AZ)","why":"Incorrecta. Zona de disponibilidad (AZ): ubicación físicamente independiente dentro de una región con infraestructura redundante. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: área geográfica con múltiples zonas de disponibilidad separadas."},{"l":"C","t":"Región AWS","why":"Correcta. Región AWS: área geográfica con múltiples zonas de disponibilidad separadas. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Modelo híbrido de nube","why":"Incorrecta. Modelo híbrido de nube: combina infraestructura local y recursos de nube conectados. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: área geográfica con múltiples zonas de disponibilidad separadas."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0223","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un banco quiere mover servidores virtuales a AWS sin rediseñar inicialmente sus aplicaciones. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Repurchasing (repurchase)","why":"Incorrecta. Repurchasing (repurchase): reemplaza una solución existente por otro producto generalmente SaaS. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift."},{"l":"B","t":"Retaining (retain)","why":"Incorrecta. Retaining (retain): conserva temporalmente una carga de trabajo en el entorno actual. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift."},{"l":"C","t":"Rehosting (rehost)","why":"Correcta. Rehosting (rehost): traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Migration Hub","why":"Incorrecta. AWS Migration Hub: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0224","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un portal web requiere acceso continuo a imágenes de catálogo y alta disponibilidad; (2) un grupo de trabajo archiva miniaturas reconstruibles y acepta no sobrevivir a pérdida de su AZ. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"AWS Backup + S3 One Zone-IA","why":"Incorrecta. NO cumple el requisito 1: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. cumple el requisito 2: almacena datos recreables poco consultados en una sola AZ para reducir costo."},{"l":"B","t":"S3 Standard + S3 One Zone-IA","why":"Correcta. cumple el requisito 1: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona. cumple el requisito 2: almacena datos recreables poco consultados en una sola AZ para reducir costo."},{"l":"C","t":"AWS Backup + AWS Storage Gateway","why":"Incorrecta. NO cumple el requisito 1: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. NO cumple el requisito 2: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas."},{"l":"D","t":"S3 Standard + AWS Storage Gateway","why":"Incorrecta. cumple el requisito 1: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona. NO cumple el requisito 2: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0225","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una dirección exige estimar el beneficio económico antes de migrar sus servidores. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"AWS Cloud Adoption Framework","why":"Incorrecta. AWS Cloud Adoption Framework: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura."},{"l":"B","t":"Migration Evaluator","why":"Correcta. Migration Evaluator: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Retaining (retain)","why":"Incorrecta. Retaining (retain): conserva temporalmente una carga de trabajo en el entorno actual. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura."},{"l":"D","t":"Replatforming (replatform)","why":"Incorrecta. Replatforming (replatform): realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0226","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Un cliente plantea esta situación: una función procesa archivos al subirse a S3 sin mantener una instancia encendida. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Instancias EC2 optimizadas para memoria","why":"Incorrecta. Instancias EC2 optimizadas para memoria: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso."},{"l":"B","t":"Amazon ECR","why":"Incorrecta. Amazon ECR: registra y almacena imágenes de contenedores para despliegues. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso."},{"l":"C","t":"AWS Lambda","why":"Correcta. AWS Lambda: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon EC2","why":"Incorrecta. Amazon EC2: ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0227","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: un arquitecto quiere documentar el análisis de riesgos frente a los seis pilares Well-Architected. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"AWS Firewall Manager","why":"Incorrecta. AWS Firewall Manager: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura."},{"l":"B","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura."},{"l":"C","t":"AWS Well-Architected Tool","why":"Correcta. AWS Well-Architected Tool: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon CloudWatch","why":"Incorrecta. Amazon CloudWatch: recopila métricas registros y alarmas para observar aplicaciones y recursos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0228","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Alta","text":"Una organización compara opciones en la nube: un área solicita aislamiento físico de otras cuentas para sus instancias pero no necesita manejar el host subyacente. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Dedicated Hosts","why":"Incorrecta. Dedicated Hosts: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts."},{"l":"B","t":"Transferencia de datos saliente","why":"Incorrecta. Transferencia de datos saliente: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts."},{"l":"C","t":"Dedicated Instances","why":"Correcta. Dedicated Instances: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Instancias reservadas (Reserved Instances)","why":"Incorrecta. Instancias reservadas (Reserved Instances): proporcionan descuentos sobre uso de instancias elegible mediante compromiso contractual de uno o tres años. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0229","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una compañía debe capacitar empleados y redefinir roles para adoptar trabajo en la nube; (2) Durante un nuevo proyecto, un área de TI reorganiza observabilidad operación e incidentes para los servicios en AWS. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Perspectiva de gobernanza de AWS CAF + Perspectiva de operaciones de AWS CAF","why":"Incorrecta. NO cumple el requisito 1: orienta transformación mediante gestión de riesgos carteras y control organizacional. cumple el requisito 2: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube."},{"l":"B","t":"Perspectiva de gobernanza de AWS CAF + Perspectiva de negocio de AWS CAF","why":"Incorrecta. NO cumple el requisito 1: orienta transformación mediante gestión de riesgos carteras y control organizacional. NO cumple el requisito 2: alinea inversiones y transformación digital con resultados empresariales y valor."},{"l":"C","t":"Perspectiva de personas de AWS CAF + Perspectiva de negocio de AWS CAF","why":"Incorrecta. cumple el requisito 1: aborda habilidades cultura organización y preparación de la fuerza laboral. NO cumple el requisito 2: alinea inversiones y transformación digital con resultados empresariales y valor."},{"l":"D","t":"Perspectiva de personas de AWS CAF + Perspectiva de operaciones de AWS CAF","why":"Correcta. cumple el requisito 1: aborda habilidades cultura organización y preparación de la fuerza laboral. cumple el requisito 2: se centra en ejecutar y administrar cargas de trabajo y servicios en la nube."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0230","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"Una organización compara opciones en la nube: un portal necesita soportar mayor tráfico incorporando servidores adicionales detrás de un balanceador. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"Escalabilidad vertical","why":"Incorrecta. Escalabilidad vertical: aumenta recursos de un único servidor como memoria o CPU. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aumenta capacidad agregando más instancias o nodos en paralelo."},{"l":"B","t":"Elasticidad","why":"Incorrecta. Elasticidad: ajusta automáticamente la capacidad en función de cambios de demanda y puede reducirla cuando baja. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aumenta capacidad agregando más instancias o nodos en paralelo."},{"l":"C","t":"Escalabilidad horizontal","why":"Correcta. Escalabilidad horizontal: aumenta capacidad agregando más instancias o nodos en paralelo. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Gasto operativo variable","why":"Incorrecta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: aumenta capacidad agregando más instancias o nodos en paralelo."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0231","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Una empresa está evaluando AWS: una compañía quiere que empleados ingresen a AWS con su proveedor corporativo de identidades. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Política basada en identidad IAM","why":"Incorrecta. Política basada en identidad IAM: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS."},{"l":"B","t":"Federación de identidades","why":"Correcta. Federación de identidades: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Acceso mediante credenciales temporales","why":"Incorrecta. Acceso mediante credenciales temporales: reduce exposición al expirar automáticamente las credenciales de sesión. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS."},{"l":"D","t":"AWS IAM Identity Center","why":"Incorrecta. AWS IAM Identity Center: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite usar un proveedor de identidad externo para obtener acceso a recursos AWS."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0232","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) un integrante del equipo técnico busca plantear una duda técnica a una comunidad de expertos y usuarios AWS; (2) un corporativo requiere acompañamiento de especialistas para un programa amplio de migración. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"AWS Basic Support + AWS Professional Services","why":"Incorrecta. NO cumple el requisito 1: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. cumple el requisito 2: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS."},{"l":"B","t":"AWS Basic Support + AWS Unified Operations","why":"Incorrecta. NO cumple el requisito 1: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. NO cumple el requisito 2: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones."},{"l":"C","t":"AWS re:Post + AWS Unified Operations","why":"Incorrecta. cumple el requisito 1: comunidad de preguntas y respuestas técnicas sobre AWS. NO cumple el requisito 2: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones."},{"l":"D","t":"AWS re:Post + AWS Professional Services","why":"Correcta. cumple el requisito 1: comunidad de preguntas y respuestas técnicas sobre AWS. cumple el requisito 2: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0233","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) un grupo de trabajo adjunta al rol de aplicación una política que permite PutObject en un bucket; (2) un sistema informático heredado requiere identificar una identidad IAM concreta dentro de una cuenta. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Política basada en identidad IAM + Gestión de permisos con políticas administradas","why":"Incorrecta. cumple el requisito 1: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. NO cumple el requisito 2: reutiliza políticas IAM que pueden vincularse a varias identidades."},{"l":"B","t":"Política basada en identidad IAM + Usuario IAM","why":"Correcta. cumple el requisito 1: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. cumple el requisito 2: representa una identidad persistente en una cuenta con posibles credenciales de larga duración."},{"l":"C","t":"Autenticación multifactor (MFA) + Gestión de permisos con políticas administradas","why":"Incorrecta. NO cumple el requisito 1: añade un factor adicional para autenticarse además de contraseña o credencial inicial. NO cumple el requisito 2: reutiliza políticas IAM que pueden vincularse a varias identidades."},{"l":"D","t":"Autenticación multifactor (MFA) + Usuario IAM","why":"Incorrecta. NO cumple el requisito 1: añade un factor adicional para autenticarse además de contraseña o credencial inicial. cumple el requisito 2: representa una identidad persistente en una cuenta con posibles credenciales de larga duración."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0234","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Una empresa está evaluando AWS: una app de clientes necesita altas de usuario e inicio de sesión sin crear cuentas IAM para consumidores. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Registros VPC Flow Logs","why":"Incorrecta. Registros VPC Flow Logs: capturan metadatos sobre tráfico IP hacia y desde interfaces de red en VPC. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles."},{"l":"B","t":"AWS WAF","why":"Incorrecta. AWS WAF: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles."},{"l":"C","t":"AWS Certificate Manager","why":"Incorrecta. AWS Certificate Manager: aprovisiona y administra certificados TLS públicos o privados compatibles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles."},{"l":"D","t":"Amazon Cognito","why":"Correcta. Amazon Cognito: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0235","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Alta","text":"En un proyecto que utilizará AWS, una startup prepara una cotización mensual hipotética de EC2 RDS y transferencia antes de crearlos. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Facturación consolidada de AWS Organizations","why":"Incorrecta. Facturación consolidada de AWS Organizations: agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: estima costos futuros de arquitecturas y servicios antes de desplegarlos."},{"l":"B","t":"AWS Pricing Calculator","why":"Correcta. AWS Pricing Calculator: estima costos futuros de arquitecturas y servicios antes de desplegarlos. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS Cost Explorer","why":"Incorrecta. AWS Cost Explorer: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: estima costos futuros de arquitecturas y servicios antes de desplegarlos."},{"l":"D","t":"AWS Cost and Usage Report (CUR)","why":"Incorrecta. AWS Cost and Usage Report (CUR): proporciona registros detallados de uso y costos para análisis granular. Aunque está relacionada con facturación, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: estima costos futuros de arquitecturas y servicios antes de desplegarlos."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0236","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un sistema informático transaccional no puede dejar de procesar si se avería un componente; (2) una compañía busca acercar su aplicación a clientes de América Europa y Asia. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Pago por uso","why":"Incorrecta. Pago por uso: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"B","t":"Alcance global","why":"Correcta. Alcance global responde a la necesidad 2: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas."},{"l":"C","t":"Alta disponibilidad","why":"Incorrecta. Alta disponibilidad mantiene un servicio accesible durante fallas mediante redundancia y eliminación de puntos únicos. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Gasto operativo variable","why":"Incorrecta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Tolerancia a errores","why":"Correcta. Tolerancia a errores responde a la necesidad 1: continúa operando durante fallas de componentes con interrupción mínima o nula."}],"key":["B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0237","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: un auditor solicita evitar lectura de tráfico capturado entre un navegador y su API. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Amazon Inspector","why":"Incorrecta. Amazon Inspector: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: protege datos mientras viajan por conexiones como TLS o VPN."},{"l":"B","t":"Cifrado en tránsito","why":"Correcta. Cifrado en tránsito: protege datos mientras viajan por conexiones como TLS o VPN. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS Security Blog","why":"Incorrecta. AWS Security Blog: publica novedades y prácticas de seguridad de AWS en artículos técnicos. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: protege datos mientras viajan por conexiones como TLS o VPN."},{"l":"D","t":"AWS WAF","why":"Incorrecta. AWS WAF: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: protege datos mientras viajan por conexiones como TLS o VPN."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0238","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una empresa deja su CRM instalado y contrata una alternativa SaaS. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Refactoring (refactor)","why":"Incorrecta. Refactoring (refactor): rediseña significativamente la aplicación para aprovechar capacidades nativas de nube. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reemplaza una solución existente por otro producto generalmente SaaS."},{"l":"B","t":"Replatforming (replatform)","why":"Incorrecta. Replatforming (replatform): realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reemplaza una solución existente por otro producto generalmente SaaS."},{"l":"C","t":"Rehosting (rehost)","why":"Incorrecta. Rehosting (rehost): traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: reemplaza una solución existente por otro producto generalmente SaaS."},{"l":"D","t":"Repurchasing (repurchase)","why":"Correcta. Repurchasing (repurchase): reemplaza una solución existente por otro producto generalmente SaaS. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0239","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una fábrica requiere ejecutar servicios AWS localmente por baja latencia física y requisitos regulatorios; (2) un responsable de operaciones requiere automatizar tareas AWS desde una terminal mediante comandos. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Región AWS + AWS CLI","why":"Incorrecta. NO cumple el requisito 1: área geográfica con múltiples zonas de disponibilidad separadas. cumple el requisito 2: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts."},{"l":"B","t":"Región AWS + AWS Management Console","why":"Incorrecta. NO cumple el requisito 1: área geográfica con múltiples zonas de disponibilidad separadas. NO cumple el requisito 2: interfaz web gráfica para administrar servicios y recursos de AWS."},{"l":"C","t":"AWS Outposts + AWS Management Console","why":"Incorrecta. cumple el requisito 1: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente. NO cumple el requisito 2: interfaz web gráfica para administrar servicios y recursos de AWS."},{"l":"D","t":"AWS Outposts + AWS CLI","why":"Correcta. cumple el requisito 1: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente. cumple el requisito 2: herramienta de línea de comandos para ejecutar operaciones AWS mediante scripts."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0240","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) una plataforma debe recuperarse de interrupciones y responder a cambios en la demanda; (2) un grupo de trabajo requiere crear el mismo entorno múltiples veces sin configuraciones manuales inconsistentes. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Dimensionar según la demanda + Arquitectura basada en eventos","why":"Incorrecta. NO cumple el requisito 1: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento. NO cumple el requisito 2: desacopla productores y consumidores mediante eventos que disparan reacciones."},{"l":"B","t":"Fiabilidad + Arquitectura basada en eventos","why":"Incorrecta. cumple el requisito 1: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado. NO cumple el requisito 2: desacopla productores y consumidores mediante eventos que disparan reacciones."},{"l":"C","t":"Dimensionar según la demanda + Automatización de infraestructura","why":"Incorrecta. NO cumple el requisito 1: ajusta tamaño y cantidad de recursos a los requisitos medidos para evitar sobreaprovisionamiento. cumple el requisito 2: sustituye operaciones manuales repetitivas por procesos reproducibles."},{"l":"D","t":"Fiabilidad + Automatización de infraestructura","why":"Correcta. cumple el requisito 1: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado. cumple el requisito 2: sustituye operaciones manuales repetitivas por procesos reproducibles."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0241","domain":4,"objective":"4.2","topic":"Facturación","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una compañía busca clasificar facturación según unidades de negocio mediante reglas sobre cuentas y etiquetas; (2) Durante un nuevo proyecto, un área financiera requiere datos detallados de facturación a nivel de recursos y dimensiones compatibles. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Cost and Usage Report (CUR)","why":"Correcta. AWS Cost and Usage Report (CUR) responde a la necesidad 2: proporciona registros detallados de uso y costos para análisis granular."},{"l":"B","t":"AWS Cost Categories","why":"Correcta. AWS Cost Categories responde a la necesidad 1: agrupa y clasifica líneas de costo usando reglas de negocio configuradas."},{"l":"C","t":"AWS Cost Explorer","why":"Incorrecta. AWS Cost Explorer: visualiza y analiza costos y tendencias históricas y previstas mediante filtros. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"Facturación consolidada de AWS Organizations","why":"Incorrecta. Facturación consolidada de AWS Organizations agrupa cargos de cuentas miembros en una cuenta pagadora y posibilita beneficios agregados compatibles. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"AWS Budgets","why":"Incorrecta. AWS Budgets: establece umbrales de costo o uso y emite alertas al superar o prever superar presupuestos. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0242","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una compañía compara nube y centro de datos incluyendo electricidad espacio mantenimiento y licencias; (2) Durante un nuevo proyecto, un cliente prefiere pagar software y capacidad juntos sin administrar su propia licencia. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Costos variables frente a fijos + Licencia incluida","why":"Incorrecta. NO cumple el requisito 1: distingue consumo flexible mensual de inversión inicial inmovilizada. cumple el requisito 2: incorpora el cargo de licencia aplicable en el precio del servicio."},{"l":"B","t":"Costos variables frente a fijos + Automatización como ahorro","why":"Incorrecta. NO cumple el requisito 1: distingue consumo flexible mensual de inversión inicial inmovilizada. NO cumple el requisito 2: reduce trabajo manual y errores operativos por procesos repetibles."},{"l":"C","t":"Costo total de propiedad (TCO) + Licencia incluida","why":"Correcta. cumple el requisito 1: considera costos directos e indirectos de operar una solución durante su vida útil. cumple el requisito 2: incorpora el cargo de licencia aplicable en el precio del servicio."},{"l":"D","t":"Costo total de propiedad (TCO) + Automatización como ahorro","why":"Incorrecta. cumple el requisito 1: considera costos directos e indirectos de operar una solución durante su vida útil. NO cumple el requisito 2: reduce trabajo manual y errores operativos por procesos repetibles."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0243","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: el propietario de un bucket agrega una declaración que autoriza a un rol de otra cuenta a leer objetos. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Acceso mediante credenciales temporales","why":"Incorrecta. Acceso mediante credenciales temporales: reduce exposición al expirar automáticamente las credenciales de sesión. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se adjunta al recurso compatible para expresar quién puede actuar sobre él."},{"l":"B","t":"Política basada en recurso","why":"Correcta. Política basada en recurso: se adjunta al recurso compatible para expresar quién puede actuar sobre él. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Usuario raíz (root)","why":"Incorrecta. Usuario raíz (root): es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se adjunta al recurso compatible para expresar quién puede actuar sobre él."},{"l":"D","t":"Permisos explícitamente denegados","why":"Incorrecta. Permisos explícitamente denegados: una sentencia Deny explícita prevalece sobre cualquier Allow aplicable en la evaluación IAM. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: se adjunta al recurso compatible para expresar quién puede actuar sobre él."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0244","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una compañía exige proteger el ingreso a la consola incluso si se filtra una contraseña; (2) una cuenta de auditoría requiere revisar recursos de producción sin crear usuarios allí. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Autenticación multifactor (MFA)","why":"Correcta. Autenticación multifactor (MFA) responde a la necesidad 1: añade un factor adicional para autenticarse además de contraseña o credencial inicial."},{"l":"B","t":"Acceso mediante credenciales temporales","why":"Incorrecta. Acceso mediante credenciales temporales: reduce exposición al expirar automáticamente las credenciales de sesión. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Política basada en identidad IAM","why":"Incorrecta. Política basada en identidad IAM se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Rol entre cuentas","why":"Correcta. Rol entre cuentas responde a la necesidad 2: autoriza que un principal de otra cuenta asuma una función con permisos temporales."},{"l":"E","t":"Gestión de permisos con políticas administradas","why":"Incorrecta. Gestión de permisos con políticas administradas: reutiliza políticas IAM que pueden vincularse a varias identidades. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0245","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) Durante un nuevo proyecto, una cuenta experimental busca documentación y asistencia general de facturación sin suscripción prémium; (2) una entidad busca patrones de migración y mejores prácticas descritas paso a paso. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Business Support+","why":"Incorrecta. AWS Business Support+ plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"AWS Prescriptive Guidance","why":"Correcta. AWS Prescriptive Guidance responde a la necesidad 2: publica estrategias patrones y guías para migración modernización y operación."},{"l":"C","t":"AWS Professional Services","why":"Incorrecta. AWS Professional Services: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"D","t":"AWS Unified Operations","why":"Incorrecta. AWS Unified Operations: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"AWS Basic Support","why":"Correcta. AWS Basic Support responde a la necesidad 1: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago."}],"key":["B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0246","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"Un cliente plantea esta situación: una startup quiere pagar por los recursos que efectivamente consume en cada mes. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Gasto operativo variable","why":"Incorrecta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente."},{"l":"B","t":"Alcance global","why":"Incorrecta. Alcance global: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente."},{"l":"C","t":"Escalabilidad vertical","why":"Incorrecta. Escalabilidad vertical: aumenta recursos de un único servidor como memoria o CPU. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente."},{"l":"D","t":"Pago por uso","why":"Correcta. Pago por uso: cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0247","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"Una empresa está evaluando AWS: una organización requiere denegar rangos IP a nivel de subred con reglas separadas de ida y vuelta. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Subred pública","why":"Incorrecta. Subred pública: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: filtro sin estado que aplica reglas de entrada y salida a nivel de subred."},{"l":"B","t":"AWS PrivateLink","why":"Incorrecta. AWS PrivateLink: expone servicios de forma privada mediante endpoints sin usar Internet público. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: filtro sin estado que aplica reglas de entrada y salida a nivel de subred."},{"l":"C","t":"Lista de control de acceso de red (NACL)","why":"Correcta. Lista de control de acceso de red (NACL): filtro sin estado que aplica reglas de entrada y salida a nivel de subred. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Internet Gateway","why":"Incorrecta. Internet Gateway: habilita comunicación entre una VPC e Internet para recursos configurados adecuadamente. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: filtro sin estado que aplica reglas de entrada y salida a nivel de subred."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0248","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una entidad busca impedir que datos legibles queden expuestos si se accede a medios almacenados; (2) un portal web requiere gestionar certificados usados para conexiones HTTPS. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Cifrado en tránsito","why":"Incorrecta. Cifrado en tránsito protege datos mientras viajan por conexiones como TLS o VPN. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Cifrado en reposo","why":"Correcta. Cifrado en reposo responde a la necesidad 1: protege datos almacenados en discos objetos o bases de datos."},{"l":"C","t":"AWS Certificate Manager","why":"Correcta. AWS Certificate Manager responde a la necesidad 2: aprovisiona y administra certificados TLS públicos o privados compatibles."},{"l":"D","t":"AWS Security Blog","why":"Incorrecta. AWS Security Blog: publica novedades y prácticas de seguridad de AWS en artículos técnicos. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Amazon Macie","why":"Incorrecta. Amazon Macie: detecta y ayuda a clasificar datos confidenciales en Amazon S3. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["B","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0249","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"Un cliente plantea esta situación: una compañía busca un marco para alinear personas procesos tecnología y resultados de migración. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Replatforming (replatform)","why":"Incorrecta. Replatforming (replatform): realiza optimizaciones limitadas sin cambiar la arquitectura esencial de la aplicación. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción."},{"l":"B","t":"Retiring (retire)","why":"Incorrecta. Retiring (retire): elimina aplicaciones que ya no generan valor o no son necesarias. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción."},{"l":"C","t":"AWS Cloud Adoption Framework","why":"Correcta. AWS Cloud Adoption Framework: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Refactoring (refactor)","why":"Incorrecta. Refactoring (refactor): rediseña significativamente la aplicación para aprovechar capacidades nativas de nube. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona perspectivas para planificar la transformación organizacional y reducir riesgos de adopción."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0250","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) Durante un nuevo proyecto, una instancia de pruebas usa poca CPU y el equipo busca bajar su tamaño de forma fundamentada; (2) una compañía elige un modelo donde el gasto siga el volumen de clientes y no una compra inicial fija. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"Rightsizing + Costos variables frente a fijos","why":"Correcta. cumple el requisito 1: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva. cumple el requisito 2: distingue consumo flexible mensual de inversión inicial inmovilizada."},{"l":"B","t":"Bring Your Own License (BYOL) + Costos variables frente a fijos","why":"Incorrecta. NO cumple el requisito 1: permite aprovechar licencias de software propias cuando lo permiten sus términos. cumple el requisito 2: distingue consumo flexible mensual de inversión inicial inmovilizada."},{"l":"C","t":"Rightsizing + Licencia incluida","why":"Incorrecta. cumple el requisito 1: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva. NO cumple el requisito 2: incorpora el cargo de licencia aplicable en el precio del servicio."},{"l":"D","t":"Bring Your Own License (BYOL) + Licencia incluida","why":"Incorrecta. NO cumple el requisito 1: permite aprovechar licencias de software propias cuando lo permiten sus términos. NO cumple el requisito 2: incorpora el cargo de licencia aplicable en el precio del servicio."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0251","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una aplicación necesita incorporar o retirar instancias EC2 según los picos de CPU. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon EC2 Auto Scaling","why":"Correcta. Amazon EC2 Auto Scaling: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon ECR","why":"Incorrecta. Amazon ECR: registra y almacena imágenes de contenedores para despliegues. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales."},{"l":"C","t":"Amazon Lightsail","why":"Incorrecta. Amazon Lightsail: ofrece servidores virtuales y recursos simplificados con paquetes predecibles. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales."},{"l":"D","t":"Instancias EC2 optimizadas para memoria","why":"Incorrecta. Instancias EC2 optimizadas para memoria: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0252","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"En una revisión de requisitos para AWS, un administrador desea recomendaciones generales sobre recursos ociosos y configuraciones de seguridad. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"AWS Control Tower","why":"Incorrecta. AWS Control Tower: facilita configurar y gobernar un entorno de múltiples cuentas con controles. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas."},{"l":"B","t":"AWS CloudHSM","why":"Incorrecta. AWS CloudHSM: ofrece módulos de seguridad de hardware dedicados bajo mayor control del cliente. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas."},{"l":"C","t":"AWS Trusted Advisor","why":"Correcta. AWS Trusted Advisor: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Resource Access Manager","why":"Incorrecta. AWS Resource Access Manager: facilita compartir recursos AWS compatibles entre cuentas de forma controlada. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: revisa prácticas recomendadas de costo seguridad rendimiento tolerancia a fallos y cuotas."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0253","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una empresa comercial requiere agregar recursos en picos de minutos y retirarlos al terminar la promoción; (2) una compañía busca reemplazar inversiones iniciales en centros de datos por cargos mensuales variables. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Pago por uso","why":"Incorrecta. Pago por uso cobro asociado al consumo real de recursos sin comprar toda la capacidad anticipadamente. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Gasto operativo variable","why":"Correcta. Gasto operativo variable responde a la necesidad 2: desplaza inversiones en hardware hacia gastos asociados al uso."},{"l":"C","t":"Elasticidad","why":"Correcta. Elasticidad responde a la necesidad 1: ajusta automáticamente la capacidad en función de cambios de demanda y puede reducirla cuando baja."},{"l":"D","t":"Alcance global","why":"Incorrecta. Alcance global: permite desplegar aplicaciones cerca de usuarios de distintas regiones geográficas. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Recuperación ante desastres","why":"Incorrecta. Recuperación ante desastres: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["B","C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0254","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) una entidad busca conocer la evolución de una regla de seguridad y detectar configuraciones no conformes; (2) un grupo de trabajo busca gobernar permisos y uso de claves para cifrar datos en servicios de AWS. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"AWS Config + AWS Secrets Manager","why":"Incorrecta. cumple el requisito 1: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos. NO cumple el requisito 2: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos."},{"l":"B","t":"AWS Config + AWS KMS","why":"Correcta. cumple el requisito 1: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos. cumple el requisito 2: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado."},{"l":"C","t":"AWS Organizations + AWS Secrets Manager","why":"Incorrecta. NO cumple el requisito 1: agrupa cuentas para aplicar gobierno y facturación centralizada. NO cumple el requisito 2: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos."},{"l":"D","t":"AWS Organizations + AWS KMS","why":"Incorrecta. NO cumple el requisito 1: agrupa cuentas para aplicar gobierno y facturación centralizada. cumple el requisito 2: crea y controla claves criptográficas utilizadas por servicios integrados para cifrado."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0255","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"En una revisión de requisitos para AWS, una empresa requiere instalar software especializado y gestionar su propio sistema operativo en una máquina virtual. ¿Qué opción satisface MEJOR esta necesidad?","options":[{"l":"A","t":"Amazon EKS","why":"Incorrecta. Amazon EKS: ofrece Kubernetes administrado para orquestar aplicaciones en contenedores. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado."},{"l":"B","t":"Amazon EC2","why":"Correcta. Amazon EC2: ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Amazon ECS","why":"Incorrecta. Amazon ECS: orquesta contenedores mediante un servicio de administración propio de AWS. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado."},{"l":"D","t":"AWS Lambda","why":"Incorrecta. AWS Lambda: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece capacidad de cómputo mediante servidores virtuales con control del sistema invitado."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0256","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"Una organización compara opciones en la nube: un desarrollador quiere localizar dónde se consume tiempo en una petición que cruza varios microservicios. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"AWS X-Ray","why":"Correcta. AWS X-Ray: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon SNS","why":"Incorrecta. Amazon SNS: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones."},{"l":"C","t":"AWS Amplify","why":"Incorrecta. AWS Amplify: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones."},{"l":"D","t":"Amazon SQS","why":"Incorrecta. Amazon SQS: desacopla componentes mediante colas de mensajes que consumidores recuperan. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0257","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) una entidad prioriza confidencialidad controles de acceso y respuesta a incidentes; (2) un grupo de trabajo evalúa si puede eliminar recursos ociosos y ajustar el gasto sin perder objetivos. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Seguridad + Optimización de costos","why":"Correcta. cumple el requisito 1: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. cumple el requisito 2: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo."},{"l":"B","t":"Seguridad + Acoplamiento débil","why":"Incorrecta. cumple el requisito 1: pilar Well-Architected que protege información sistemas y activos mediante controles y gestión de riesgos. NO cumple el requisito 2: diseña componentes para depender poco unos de otros y limitar fallas en cascada."},{"l":"C","t":"Automatización de infraestructura + Acoplamiento débil","why":"Incorrecta. NO cumple el requisito 1: sustituye operaciones manuales repetitivas por procesos reproducibles. NO cumple el requisito 2: diseña componentes para depender poco unos de otros y limitar fallas en cascada."},{"l":"D","t":"Automatización de infraestructura + Optimización de costos","why":"Incorrecta. NO cumple el requisito 1: sustituye operaciones manuales repetitivas por procesos reproducibles. cumple el requisito 2: pilar Well-Architected que evita gastos innecesarios y maximiza valor del consumo."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0258","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"Una empresa está evaluando AWS: un comercio convierte automáticamente descripciones escritas de productos de español a francés. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Amazon Translate","why":"Correcta. Amazon Translate: traduce texto entre idiomas mediante modelos administrados. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon EMR","why":"Incorrecta. Amazon EMR: ejecuta marcos de big data como Apache Spark y Hadoop administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: traduce texto entre idiomas mediante modelos administrados."},{"l":"C","t":"Amazon Rekognition","why":"Incorrecta. Amazon Rekognition: analiza imágenes y video para detectar objetos textos y características visuales. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: traduce texto entre idiomas mediante modelos administrados."},{"l":"D","t":"Amazon Kinesis","why":"Incorrecta. Amazon Kinesis: ingiere y procesa flujos de datos en tiempo real a escala. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: traduce texto entre idiomas mediante modelos administrados."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0259","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una entidad conserva documentos por décadas y tolera recuperaciones de muchas horas; (2) una compañía consulta informes mensuales poco frecuentes pero exige acceso inmediato y resiliencia multizona. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"AWS Backup + S3 Standard-IA","why":"Incorrecta. NO cumple el requisito 1: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. cumple el requisito 2: almacena objetos poco consultados con recuperación rápida y resiliencia multizona."},{"l":"B","t":"AWS Backup + AWS Storage Gateway","why":"Incorrecta. NO cumple el requisito 1: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. NO cumple el requisito 2: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas."},{"l":"C","t":"S3 Glacier Deep Archive + AWS Storage Gateway","why":"Incorrecta. cumple el requisito 1: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas. NO cumple el requisito 2: integra aplicaciones locales con almacenamiento en la nube mediante interfaces de archivos volúmenes o cintas."},{"l":"D","t":"S3 Glacier Deep Archive + S3 Standard-IA","why":"Correcta. cumple el requisito 1: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas. cumple el requisito 2: almacena objetos poco consultados con recuperación rápida y resiliencia multizona."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0260","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"En un proyecto que utilizará AWS, una aplicación necesita enviar correos de confirmación de compra y recuperación de cuenta. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Amazon EventBridge","why":"Incorrecta. Amazon EventBridge: enruta eventos desde distintas fuentes a destinos mediante reglas. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite enviar correos electrónicos transaccionales y campañas mediante un servicio escalable."},{"l":"B","t":"Amazon SES","why":"Correcta. Amazon SES: permite enviar correos electrónicos transaccionales y campañas mediante un servicio escalable. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS X-Ray","why":"Incorrecta. AWS X-Ray: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite enviar correos electrónicos transaccionales y campañas mediante un servicio escalable."},{"l":"D","t":"AWS CodePipeline","why":"Incorrecta. AWS CodePipeline: coordina fases automatizadas de entrega continua desde origen hasta despliegue. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite enviar correos electrónicos transaccionales y campañas mediante un servicio escalable."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0261","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) una compañía busca reducir energía consumida por transacción y recursos infrautilizados; (2) Durante un nuevo proyecto, un arquitecto decide incorporar redundancia y reintentos porque los componentes pueden fallar. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Diseño sin estado","why":"Incorrecta. Diseño sin estado: mantiene el estado de sesión fuera de cada instancia para permitir sustituciones y escalado. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Eficiencia del rendimiento","why":"Incorrecta. Eficiencia del rendimiento pilar Well-Architected que selecciona y usa recursos informáticos apropiados para la carga. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"Diseño para fallos","why":"Correcta. Diseño para fallos responde a la necesidad 2: asume que pueden ocurrir fallas y crea mecanismos para seguir funcionando o recuperarse."},{"l":"D","t":"Automatización de infraestructura","why":"Incorrecta. Automatización de infraestructura: sustituye operaciones manuales repetitivas por procesos reproducibles. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Sostenibilidad","why":"Correcta. Sostenibilidad responde a la necesidad 1: pilar Well-Architected que minimiza impactos ambientales del uso de recursos."}],"key":["C","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0262","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Una empresa está evaluando AWS: un auditor quiere detectar políticas que permiten acceso a un bucket desde fuera de la organización. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS IAM Access Analyzer","why":"Correcta. AWS IAM Access Analyzer: identifica acceso externo no previsto y ayuda a analizar permisos de recursos e identidades. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Secrets Manager","why":"Incorrecta. AWS Secrets Manager: almacena y puede rotar de forma administrada secretos como credenciales de bases de datos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad;

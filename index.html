"E","t":"Dedicated Hosts","why":"Incorrecta. Dedicated Hosts ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."}],"key":["B","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0089","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una auditoría pregunta quién protege físicamente las instalaciones y los equipos que sostienen AWS. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Política de bucket S3","why":"Incorrecta. Política de bucket S3: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios."},{"l":"B","t":"Seguridad física del centro de datos","why":"Incorrecta. Seguridad física del centro de datos: AWS controla acceso físico energía y protección de instalaciones de sus regiones. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios."},{"l":"C","t":"Seguridad en la nube","why":"Incorrecta. Seguridad en la nube: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios."},{"l":"D","t":"Seguridad de la nube","why":"Correcta. Seguridad de la nube: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0090","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) Durante un nuevo proyecto, se expuso un bucket por una política pública excesiva y deben asignarse las responsabilidades; (2) una entidad ejecuta Windows en EC2 y requiere asignar responsables de parches del sistema invitado. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Seguridad del hipervisor administrado por AWS + Parches del SO invitado en EC2","why":"Incorrecta. NO cumple el requisito 1: AWS administra la virtualización e infraestructura subyacente de EC2. cumple el requisito 2: normalmente corresponden al cliente para sistemas operativos de instancias EC2."},{"l":"B","t":"Seguridad del hipervisor administrado por AWS + Seguridad de la nube","why":"Incorrecta. NO cumple el requisito 1: AWS administra la virtualización e infraestructura subyacente de EC2. NO cumple el requisito 2: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios."},{"l":"C","t":"Política de bucket S3 + Parches del SO invitado en EC2","why":"Correcta. cumple el requisito 1: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. cumple el requisito 2: normalmente corresponden al cliente para sistemas operativos de instancias EC2."},{"l":"D","t":"Política de bucket S3 + Seguridad de la nube","why":"Incorrecta. cumple el requisito 1: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. NO cumple el requisito 2: es obligación de AWS proteger la infraestructura física global que sustenta sus servicios."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0091","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un motor de simulación requiere mucha capacidad de CPU y relativamente poca memoria; (2) una plataforma recibe peticiones y debe repartirlas entre múltiples instancias disponibles. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Batch","why":"Incorrecta. AWS Batch: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"AWS Lambda","why":"Incorrecta. AWS Lambda: ejecuta código activado por eventos sin administrar servidores y cobra por ejecución y uso. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Elastic Load Balancing","why":"Correcta. Elastic Load Balancing responde a la necesidad 2: distribuye tráfico entrante entre múltiples destinos sanos según tipo de balanceador."},{"l":"D","t":"Amazon EC2 Auto Scaling","why":"Incorrecta. Amazon EC2 Auto Scaling ajusta automáticamente la cantidad de instancias EC2 de un grupo según políticas y señales. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"Instancias EC2 optimizadas para cómputo","why":"Correcta. Instancias EC2 optimizadas para cómputo responde a la necesidad 1: aportan proporción alta de potencia de CPU para cargas intensivas en procesamiento."}],"key":["C","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0092","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) una compañía busca reutilizar licencias existentes en cargas elegibles desplegadas en AWS; (2) Durante un nuevo proyecto, una instancia de pruebas usa poca CPU y el equipo busca bajar su tamaño de forma fundamentada. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Licencia incluida","why":"Incorrecta. Licencia incluida incorpora el cargo de licencia aplicable en el precio del servicio. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"B","t":"Rightsizing","why":"Correcta. Rightsizing responde a la necesidad 2: ajusta recursos a necesidades reales para evitar pagar por capacidad excesiva."},{"l":"C","t":"Costos ocultos de centros de datos","why":"Incorrecta. Costos ocultos de centros de datos: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Bring Your Own License (BYOL)","why":"Correcta. Bring Your Own License (BYOL) responde a la necesidad 1: permite aprovechar licencias de software propias cuando lo permiten sus términos."},{"l":"E","t":"Costos variables frente a fijos","why":"Incorrecta. Costos variables frente a fijos: distingue consumo flexible mensual de inversión inicial inmovilizada. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["B","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0093","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Un cliente plantea esta situación: un equipo legal necesita descargar informes SOC de AWS para su auditoría. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"AWS Security Hub","why":"Incorrecta. AWS Security Hub: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio."},{"l":"B","t":"AWS Health Dashboard","why":"Incorrecta. AWS Health Dashboard: muestra eventos de salud de servicios y eventos que pueden afectar recursos de la cuenta. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio."},{"l":"C","t":"AWS Artifact","why":"Correcta. AWS Artifact: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Firewall Manager","why":"Incorrecta. AWS Firewall Manager: administra centralmente políticas de firewall y protección en cuentas y recursos compatibles. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0094","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"Una organización compara opciones en la nube: una fábrica necesita ejecutar servicios AWS localmente por baja latencia física y requisitos regulatorios. ¿Qué alternativa cubre MEJOR esta necesidad?","options":[{"l":"A","t":"AWS SDK","why":"Incorrecta. AWS SDK: bibliotecas para que aplicaciones invoquen APIs de AWS desde un lenguaje de programación. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente."},{"l":"B","t":"AWS CloudFormation","why":"Incorrecta. AWS CloudFormation: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente."},{"l":"C","t":"AWS Outposts","why":"Correcta. AWS Outposts: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"AWS Management Console","why":"Incorrecta. AWS Management Console: interfaz web gráfica para administrar servicios y recursos de AWS. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: lleva infraestructura y servicios administrados de AWS a instalaciones del cliente."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0095","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) una entidad busca aplicar políticas de copia y retención consistentes a múltiples servicios; (2) una plataforma requiere guardar millones de fotografías como objetos accesibles por URL y API; (3) una base de datos en EC2 requiere un disco persistente presentado como dispositivo de bloques. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"S3 Standard-IA","why":"Incorrecta. S3 Standard-IA almacena objetos poco consultados con recuperación rápida y resiliencia multizona. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"B","t":"AWS Backup","why":"Correcta. Se aplica a la situación 1: centraliza y automatiza políticas de respaldo de recursos AWS compatibles."},{"l":"C","t":"Amazon S3","why":"Correcta. Se aplica a la situación 2: almacena objetos en buckets con acceso basado en API y alta durabilidad."},{"l":"D","t":"Amazon EBS","why":"Correcta. Se aplica a la situación 3: aporta volúmenes de almacenamiento en bloques persistente para instancias EC2."},{"l":"E","t":"S3 One Zone-IA","why":"Incorrecta. S3 One Zone-IA almacena datos recreables poco consultados en una sola AZ para reducir costo. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"F","t":"Amazon FSx","why":"Incorrecta. Amazon FSx: ofrece sistemas de archivos administrados especializados como Windows File Server y Lustre. Ninguna de las tres situaciones exige prioritariamente esta función."}],"key":["B","C","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0096","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una corporación centraliza datos para consultas BI analíticas sobre un data warehouse; (2) un grupo de trabajo requiere transformar procedimientos y esquemas Oracle para un destino PostgreSQL. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon Redshift","why":"Correcta. Amazon Redshift responde a la necesidad 1: ejecuta analítica SQL de almacén de datos para grandes volúmenes."},{"l":"B","t":"AWS SCT","why":"Correcta. AWS SCT responde a la necesidad 2: ayuda a convertir esquemas y objetos de bases de datos entre motores diferentes."},{"l":"C","t":"Amazon RDS","why":"Incorrecta. Amazon RDS administra bases de datos relacionales compatibles y tareas como backups y mantenimiento. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Base de datos autoadministrada en EC2","why":"Incorrecta. Base de datos autoadministrada en EC2: permite al cliente instalar y controlar motor parches y configuración en una instancia. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"E","t":"Amazon ElastiCache","why":"Incorrecta. Amazon ElastiCache: ofrece almacenes de caché en memoria administrados para disminuir latencia. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["A","B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0097","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un analista debe identificar gastos locales que no aparecen en el costo de compra de servidores. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Licencia incluida","why":"Incorrecta. Licencia incluida: incorpora el cargo de licencia aplicable en el precio del servicio. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos."},{"l":"B","t":"Costos ocultos de centros de datos","why":"Correcta. Costos ocultos de centros de datos: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Bring Your Own License (BYOL)","why":"Incorrecta. Bring Your Own License (BYOL): permite aprovechar licencias de software propias cuando lo permiten sus términos. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos."},{"l":"D","t":"Costos variables frente a fijos","why":"Incorrecta. Costos variables frente a fijos: distingue consumo flexible mensual de inversión inicial inmovilizada. Aunque está relacionada con economía, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0098","domain":4,"objective":"4.1","topic":"Precios","difficulty":"Alta","text":"En un proyecto que utilizará AWS, una aplicación transmite grandes volúmenes desde AWS a clientes de Internet y debe estimar cargos de egreso. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Dedicated Hosts","why":"Incorrecta. Dedicated Hosts: ofrecen servidores físicos EC2 dedicados a una cuenta con visibilidad y control de colocación de instancias. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso."},{"l":"B","t":"Dedicated Instances","why":"Incorrecta. Dedicated Instances: ejecutan instancias en hardware dedicado a una cuenta sin control de host específico como Dedicated Hosts. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso."},{"l":"C","t":"Transferencia de datos saliente","why":"Correcta. Transferencia de datos saliente: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Savings Plans","why":"Incorrecta. Savings Plans: ofrecen ahorro a cambio de comprometer un gasto de uso por hora durante uno o tres años según plan. Aunque está relacionada con precios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: puede generar cargos al enviar datos desde AWS hacia Internet según servicio y niveles de uso."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0099","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Alta","text":"En un proyecto que utilizará AWS, los objetos tienen frecuencias de consulta impredecibles y se busca optimizar almacenamiento automáticamente. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"S3 Intelligent-Tiering","why":"Correcta. S3 Intelligent-Tiering: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"S3 Glacier Deep Archive","why":"Incorrecta. S3 Glacier Deep Archive: ofrece almacenamiento de archivo muy económico con recuperación normalmente en horas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización."},{"l":"C","t":"S3 Glacier Flexible Retrieval","why":"Incorrecta. S3 Glacier Flexible Retrieval: archiva datos rara vez consultados con recuperaciones en minutos u horas. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización."},{"l":"D","t":"S3 Standard-IA","why":"Incorrecta. S3 Standard-IA: almacena objetos poco consultados con recuperación rápida y resiliencia multizona. Aunque está relacionada con almacenamiento, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta niveles de acceso para patrones cambiantes o desconocidos con monitorización."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0100","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"Un cliente plantea esta situación: una compañía debe decidir quién autoriza las cuentas que consultan información empresarial alojada en RDS. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Seguridad del hipervisor administrado por AWS","why":"Incorrecta. Seguridad del hipervisor administrado por AWS: AWS administra la virtualización e infraestructura subyacente de EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: lo define el cliente mediante identidades permisos y controles de aplicación."},{"l":"B","t":"Parches del SO invitado en EC2","why":"Incorrecta. Parches del SO invitado en EC2: normalmente corresponden al cliente para sistemas operativos de instancias EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: lo define el cliente mediante identidades permisos y controles de aplicación."},{"l":"C","t":"Control de accesos a datos en RDS","why":"Correcta. Control de accesos a datos en RDS: lo define el cliente mediante identidades permisos y controles de aplicación. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Política de bucket S3","why":"Incorrecta. Política de bucket S3: el cliente debe configurar adecuadamente las políticas y permisos de sus buckets. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: lo define el cliente mediante identidades permisos y controles de aplicación."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0101","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) Durante un nuevo proyecto, instancias privadas deben descargar actualizaciones sin recibir conexiones iniciadas desde Internet; (2) una plataforma TCP global busca IP fijas y entrada optimizada a endpoints regionales. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"NAT Gateway + AWS Global Accelerator","why":"Correcta. cumple el requisito 1: permite que recursos de subredes privadas inicien tráfico saliente a Internet sin conexiones entrantes iniciadas desde fuera. cumple el requisito 2: mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS."},{"l":"B","t":"Amazon Route 53 + AWS Site-to-Site VPN","why":"Incorrecta. NO cumple el requisito 1: presta servicios DNS y políticas de enrutamiento de consultas por nombre. NO cumple el requisito 2: conecta redes locales a VPC mediante túneles cifrados sobre una red IP."},{"l":"C","t":"NAT Gateway + AWS Site-to-Site VPN","why":"Incorrecta. cumple el requisito 1: permite que recursos de subredes privadas inicien tráfico saliente a Internet sin conexiones entrantes iniciadas desde fuera. NO cumple el requisito 2: conecta redes locales a VPC mediante túneles cifrados sobre una red IP."},{"l":"D","t":"Amazon Route 53 + AWS Global Accelerator","why":"Incorrecta. NO cumple el requisito 1: presta servicios DNS y políticas de enrutamiento de consultas por nombre. cumple el requisito 2: mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0102","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"Una empresa está evaluando AWS: un servidor en subred pública necesita una puerta de enlace de la VPC hacia Internet. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS Site-to-Site VPN","why":"Incorrecta. AWS Site-to-Site VPN: conecta redes locales a VPC mediante túneles cifrados sobre una red IP. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: habilita comunicación entre una VPC e Internet para recursos configurados adecuadamente."},{"l":"B","t":"AWS PrivateLink","why":"Incorrecta. AWS PrivateLink: expone servicios de forma privada mediante endpoints sin usar Internet público. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: habilita comunicación entre una VPC e Internet para recursos configurados adecuadamente."},{"l":"C","t":"AWS Direct Connect","why":"Incorrecta. AWS Direct Connect: proporciona conexión de red privada dedicada entre instalaciones y AWS. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: habilita comunicación entre una VPC e Internet para recursos configurados adecuadamente."},{"l":"D","t":"Internet Gateway","why":"Correcta. Internet Gateway: habilita comunicación entre una VPC e Internet para recursos configurados adecuadamente. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0103","domain":3,"objective":"3.6","topic":"Almacenamiento","difficulty":"Muy alta","text":"Una organización debe cubrir dos requisitos en AWS: (1) una compañía conserva respaldos largos y acepta esperar minutos u horas para recuperarlos; (2) múltiples instancias Linux deben compartir carpetas con un sistema informático de archivos NFS administrado. ¿Qué combinación atiende AMBOS requisitos, respectivamente?","options":[{"l":"A","t":"S3 Glacier Flexible Retrieval + Amazon EFS","why":"Correcta. cumple el requisito 1: archiva datos rara vez consultados con recuperaciones en minutos u horas. cumple el requisito 2: proporciona archivos elásticos administrados NFS para acceso simultáneo desde varias instancias Linux."},{"l":"B","t":"AWS Backup + Amazon EFS","why":"Incorrecta. NO cumple el requisito 1: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. cumple el requisito 2: proporciona archivos elásticos administrados NFS para acceso simultáneo desde varias instancias Linux."},{"l":"C","t":"AWS Backup + S3 Standard","why":"Incorrecta. NO cumple el requisito 1: centraliza y automatiza políticas de respaldo de recursos AWS compatibles. NO cumple el requisito 2: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona."},{"l":"D","t":"S3 Glacier Flexible Retrieval + S3 Standard","why":"Incorrecta. cumple el requisito 1: archiva datos rara vez consultados con recuperaciones en minutos u horas. NO cumple el requisito 2: clase de objetos para accesos frecuentes con baja latencia y redundancia multizona."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0104","domain":1,"objective":"1.4","topic":"Economía","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) Durante un nuevo proyecto, un cliente prefiere pagar software y capacidad juntos sin administrar su propia licencia; (2) un grupo de trabajo busca reducir horas dedicadas a aprovisionar manualmente decenas de entornos. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"Costo total de propiedad (TCO) + Automatización como ahorro","why":"Incorrecta. NO cumple el requisito 1: considera costos directos e indirectos de operar una solución durante su vida útil. cumple el requisito 2: reduce trabajo manual y errores operativos por procesos repetibles."},{"l":"B","t":"Costo total de propiedad (TCO) + Costos ocultos de centros de datos","why":"Incorrecta. NO cumple el requisito 1: considera costos directos e indirectos de operar una solución durante su vida útil. NO cumple el requisito 2: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos."},{"l":"C","t":"Licencia incluida + Automatización como ahorro","why":"Correcta. cumple el requisito 1: incorpora el cargo de licencia aplicable en el precio del servicio. cumple el requisito 2: reduce trabajo manual y errores operativos por procesos repetibles."},{"l":"D","t":"Licencia incluida + Costos ocultos de centros de datos","why":"Incorrecta. cumple el requisito 1: incorpora el cargo de licencia aplicable en el precio del servicio. NO cumple el requisito 2: incluyen energía refrigeración inmueble mantenimiento y renovación de equipos."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0105","domain":1,"objective":"1.2","topic":"Arquitectura","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) un grupo de trabajo revisa métricas y automatiza procedimientos para mejorar continuamente la operación; (2) una plataforma debe recuperarse de interrupciones y responder a cambios en la demanda. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Arquitectura basada en eventos + Fiabilidad","why":"Incorrecta. NO cumple el requisito 1: desacopla productores y consumidores mediante eventos que disparan reacciones. cumple el requisito 2: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado."},{"l":"B","t":"Excelencia operativa + Fiabilidad","why":"Correcta. cumple el requisito 1: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos. cumple el requisito 2: pilar Well-Architected que permite recuperarse de errores y mantener funcionamiento adecuado."},{"l":"C","t":"Arquitectura basada en eventos + Acoplamiento débil","why":"Incorrecta. NO cumple el requisito 1: desacopla productores y consumidores mediante eventos que disparan reacciones. NO cumple el requisito 2: diseña componentes para depender poco unos de otros y limitar fallas en cascada."},{"l":"D","t":"Excelencia operativa + Acoplamiento débil","why":"Incorrecta. cumple el requisito 1: pilar Well-Architected orientado a operar monitorizar y mejorar procesos y procedimientos. NO cumple el requisito 2: diseña componentes para depender poco unos de otros y limitar fallas en cascada."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0106","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una organización compara capacidades de AWS para tres casos: (1) una compañía exige proteger el ingreso a la consola incluso si se filtra una contraseña; (2) un nuevo titular requiere identificar la identidad que debe guardarse con MFA y no usarse habitualmente; (3) un grupo de trabajo adjunta al rol de aplicación una política que permite PutObject en un bucket. ¿Qué TRES opciones corresponden a los requisitos? (Seleccione TRES respuestas).","options":[{"l":"A","t":"Autenticación multifactor (MFA)","why":"Correcta. Se aplica a la situación 1: añade un factor adicional para autenticarse además de contraseña o credencial inicial."},{"l":"B","t":"Política basada en identidad IAM","why":"Correcta. Se aplica a la situación 3: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados."},{"l":"C","t":"Límite de permisos IAM","why":"Incorrecta. Límite de permisos IAM restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"D","t":"Federación de identidades","why":"Incorrecta. Federación de identidades permite usar un proveedor de identidad externo para obtener acceso a recursos AWS. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"E","t":"Gestión de permisos con políticas administradas","why":"Incorrecta. Gestión de permisos con políticas administradas: reutiliza políticas IAM que pueden vincularse a varias identidades. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"F","t":"Usuario raíz (root)","why":"Correcta. Se aplica a la situación 2: es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias."}],"key":["A","B","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0107","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Una empresa está evaluando AWS: una organización quiere impedir que datos legibles queden expuestos si se accede a medios almacenados. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Amazon Macie","why":"Incorrecta. Amazon Macie: detecta y ayuda a clasificar datos confidenciales en Amazon S3. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: protege datos almacenados en discos objetos o bases de datos."},{"l":"B","t":"AWS WAF","why":"Incorrecta. AWS WAF: filtra peticiones HTTP(S) mediante reglas como bloqueo por patrones web. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: protege datos almacenados en discos objetos o bases de datos."},{"l":"C","t":"Cifrado en reposo","why":"Correcta. Cifrado en reposo: protege datos almacenados en discos objetos o bases de datos. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon Cognito","why":"Incorrecta. Amazon Cognito: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: protege datos almacenados en discos objetos o bases de datos."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0108","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: trabajadores remotos necesitan un escritorio virtual de trabajo desde equipos personales. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Amazon Connect","why":"Incorrecta. Amazon Connect: proporciona un centro de contacto omnicanal en la nube. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona escritorios virtuales persistentes administrados para usuarios."},{"l":"B","t":"Amazon WorkSpaces","why":"Correcta. Amazon WorkSpaces: proporciona escritorios virtuales persistentes administrados para usuarios. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS CodeBuild","why":"Incorrecta. AWS CodeBuild: compila código ejecuta pruebas y produce artefactos en un entorno administrado. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona escritorios virtuales persistentes administrados para usuarios."},{"l":"D","t":"AWS X-Ray","why":"Incorrecta. AWS X-Ray: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona escritorios virtuales persistentes administrados para usuarios."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0109","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un analista investiga relaciones entre identidades IP y actividades tras recibir una alerta. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Amazon Detective","why":"Correcta. Amazon Detective: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon Macie","why":"Incorrecta. Amazon Macie: detecta y ayuda a clasificar datos confidenciales en Amazon S3. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados."},{"l":"C","t":"AWS Shield","why":"Incorrecta. AWS Shield: protege contra ataques de denegación de servicio distribuido DDoS. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados."},{"l":"D","t":"Amazon Cognito","why":"Incorrecta. Amazon Cognito: gestiona registro e inicio de sesión de usuarios finales para aplicaciones web y móviles. Aunque está relacionada con amenazas, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ayuda a investigar y analizar causas de hallazgos de seguridad relacionados."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0110","domain":2,"objective":"2.1","topic":"Responsabilidad","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un servidor quedó accesible por SSH desde toda Internet debido a una regla permisiva. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Seguridad en la nube","why":"Incorrecta. Seguridad en la nube: es obligación del cliente configurar controles y proteger sus datos y cargas según el servicio. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2."},{"l":"B","t":"Código y dependencias de Lambda","why":"Incorrecta. Código y dependencias de Lambda: son responsabilidad del cliente que publica y mantiene su propia función. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2."},{"l":"C","t":"Configuración de grupos de seguridad","why":"Correcta. Configuración de grupos de seguridad: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Parches del SO invitado en EC2","why":"Incorrecta. Parches del SO invitado en EC2: normalmente corresponden al cliente para sistemas operativos de instancias EC2. Aunque está relacionada con responsabilidad, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: el cliente determina las reglas que permiten tráfico hacia y desde sus cargas EC2."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0111","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un evento debe notificarse en paralelo a varios sistemas mediante tópicos. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Amazon SNS","why":"Correcta. Amazon SNS: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Amazon EventBridge","why":"Incorrecta. Amazon EventBridge: enruta eventos desde distintas fuentes a destinos mediante reglas. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores."},{"l":"C","t":"AWS Step Functions","why":"Incorrecta. AWS Step Functions: orquesta flujos de trabajo por estados con pasos y manejo de errores. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores."},{"l":"D","t":"AWS IoT Core","why":"Incorrecta. AWS IoT Core: conecta y administra comunicación segura entre dispositivos IoT y aplicaciones en la nube. Aunque está relacionada con integración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0112","domain":3,"objective":"3.5","topic":"Redes","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un sitio necesita dirigir su dominio a distintos endpoints usando resolución DNS. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Amazon Route 53","why":"Correcta. Amazon Route 53: presta servicios DNS y políticas de enrutamiento de consultas por nombre. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS PrivateLink","why":"Incorrecta. AWS PrivateLink: expone servicios de forma privada mediante endpoints sin usar Internet público. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: presta servicios DNS y políticas de enrutamiento de consultas por nombre."},{"l":"C","t":"Subred pública","why":"Incorrecta. Subred pública: tiene una ruta hacia internet gateway y permite conectividad de recursos elegibles con IP pública. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: presta servicios DNS y políticas de enrutamiento de consultas por nombre."},{"l":"D","t":"AWS Global Accelerator","why":"Incorrecta. AWS Global Accelerator: mejora disponibilidad y rendimiento de tráfico usando IP estáticas anycast y red global AWS. Aunque está relacionada con redes, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: presta servicios DNS y políticas de enrutamiento de consultas por nombre."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0113","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Alta","text":"Una empresa está evaluando AWS: un administrador central quiere impedir determinadas acciones aunque un usuario tenga permisos IAM amplios. ¿Qué opción debería elegir?","options":[{"l":"A","t":"AWS Artifact","why":"Incorrecta. AWS Artifact: ofrece documentación de cumplimiento de AWS y determinados acuerdos en un portal de autoservicio. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: establece el máximo conjunto de permisos posibles para cuentas en una organización."},{"l":"B","t":"Service Control Policy (SCP)","why":"Correcta. Service Control Policy (SCP): establece el máximo conjunto de permisos posibles para cuentas en una organización. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"AWS Config","why":"Incorrecta. AWS Config: registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: establece el máximo conjunto de permisos posibles para cuentas en una organización."},{"l":"D","t":"AWS Resource Access Manager","why":"Incorrecta. AWS Resource Access Manager: facilita compartir recursos AWS compatibles entre cuentas de forma controlada. Aunque está relacionada con auditoría, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: establece el máximo conjunto de permisos posibles para cuentas en una organización."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0114","domain":1,"objective":"1.3","topic":"CAF","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un grupo de trabajo debe definir arquitectura y capacidades de plataforma para albergar aplicaciones migradas; (2) Durante un nuevo proyecto, una entidad prepara su enfoque de protección riesgos y controles de seguridad de la migración. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Perspectiva de seguridad de AWS CAF","why":"Correcta. Perspectiva de seguridad de AWS CAF responde a la necesidad 2: orienta a lograr confidencialidad integridad y disponibilidad durante la transformación."},{"l":"B","t":"Perspectiva de operaciones de AWS CAF","why":"Incorrecta. Perspectiva de operaciones de AWS CAF se centra en ejecutar y administrar cargas de trabajo y servicios en la nube. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"Perspectiva de personas de AWS CAF","why":"Incorrecta. Perspectiva de personas de AWS CAF: aborda habilidades cultura organización y preparación de la fuerza laboral. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Perspectiva de plataforma de AWS CAF","why":"Correcta. Perspectiva de plataforma de AWS CAF responde a la necesidad 1: se centra en construir y modernizar la plataforma tecnológica en la nube."},{"l":"E","t":"Perspectiva de negocio de AWS CAF","why":"Incorrecta. Perspectiva de negocio de AWS CAF: alinea inversiones y transformación digital con resultados empresariales y valor. No sustituye las capacidades específicas requeridas para los dos casos."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0115","domain":3,"objective":"3.7","topic":"Datos e IA","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un equipo de ciencia de datos debe entrenar y desplegar modelos predictivos personalizados. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"Amazon Translate","why":"Incorrecta. Amazon Translate: traduce texto entre idiomas mediante modelos administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona capacidades para construir entrenar y desplegar modelos de machine learning."},{"l":"B","t":"Amazon Quick","why":"Incorrecta. Amazon Quick: ofrece capacidades de inteligencia de negocios y visualización de datos administradas. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona capacidades para construir entrenar y desplegar modelos de machine learning."},{"l":"C","t":"Amazon SageMaker AI","why":"Correcta. Amazon SageMaker AI: proporciona capacidades para construir entrenar y desplegar modelos de machine learning. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Amazon EMR","why":"Incorrecta. Amazon EMR: ejecuta marcos de big data como Apache Spark y Hadoop administrados. Aunque está relacionada con datos e ia, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona capacidades para construir entrenar y desplegar modelos de machine learning."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0116","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Alta","text":"En un proyecto que utilizará AWS, un servicio necesita credenciales temporales al asumir un rol en otra cuenta. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"AWS STS","why":"Correcta. AWS STS: emite credenciales de seguridad temporales para sesiones y roles. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"Política de contraseñas IAM","why":"Incorrecta. Política de contraseñas IAM: define requisitos de longitud complejidad y rotación de contraseñas de usuarios IAM. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: emite credenciales de seguridad temporales para sesiones y roles."},{"l":"C","t":"Acceso mediante credenciales temporales","why":"Incorrecta. Acceso mediante credenciales temporales: reduce exposición al expirar automáticamente las credenciales de sesión. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: emite credenciales de seguridad temporales para sesiones y roles."},{"l":"D","t":"AWS IAM Identity Center","why":"Incorrecta. AWS IAM Identity Center: habilita acceso centralizado de usuarios a varias cuentas y aplicaciones con SSO. Aunque está relacionada con iam, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: emite credenciales de seguridad temporales para sesiones y roles."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0117","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un integrante del equipo técnico busca localizar dónde se consume tiempo en una petición que cruza múltiples microservicios; (2) una compañía desea desplegar un call center sin operar centrales telefónicas locales. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon SNS","why":"Incorrecta. Amazon SNS: distribuye mensajes mediante publicación y suscripción a múltiples suscriptores. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Amazon SES","why":"Incorrecta. Amazon SES: permite enviar correos electrónicos transaccionales y campañas mediante un servicio escalable. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"C","t":"Amazon Connect","why":"Correcta. Amazon Connect responde a la necesidad 2: proporciona un centro de contacto omnicanal en la nube."},{"l":"D","t":"AWS Amplify","why":"Incorrecta. AWS Amplify ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"AWS X-Ray","why":"Correcta. AWS X-Ray responde a la necesidad 1: ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones."}],"key":["C","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0118","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"Un equipo técnico analiza el siguiente escenario: un equipo quiere probar una idea y descartarla con rapidez sin adquirir servidores. ¿Cuál es la alternativa MÁS apropiada?","options":[{"l":"A","t":"Recuperación ante desastres","why":"Incorrecta. Recuperación ante desastres: restablece servicios y datos tras una interrupción grave usando planes y objetivos de recuperación. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas."},{"l":"B","t":"Gasto operativo variable","why":"Incorrecta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas."},{"l":"C","t":"Servicios administrados","why":"Incorrecta. Servicios administrados: delegan a AWS tareas operativas del servicio que de otro modo realizaría el cliente. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas."},{"l":"D","t":"Agilidad","why":"Correcta. Agilidad: permite aprovisionar y experimentar en minutos en lugar de esperar compras físicas. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0119","domain":3,"objective":"3.3","topic":"Cómputo","difficulty":"Alta","text":"Un cliente plantea esta situación: un laboratorio necesita ejecutar miles de trabajos de procesamiento no interactivos en lotes. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Amazon EKS","why":"Incorrecta. Amazon EKS: ofrece Kubernetes administrado para orquestar aplicaciones en contenedores. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados."},{"l":"B","t":"AWS Batch","why":"Correcta. AWS Batch: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados. El requisito específico del escenario coincide con esta función."},{"l":"C","t":"Instancias EC2 optimizadas para memoria","why":"Incorrecta. Instancias EC2 optimizadas para memoria: aportan mayor capacidad de RAM relativa para procesar grandes conjuntos de datos en memoria. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados."},{"l":"D","t":"Amazon ECR","why":"Incorrecta. Amazon ECR: registra y almacena imágenes de contenedores para despliegues. Aunque está relacionada con cómputo, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: planifica y ejecuta trabajos por lotes a escala sobre recursos informáticos apropiados."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0120","domain":2,"objective":"2.2","topic":"Auditoría","difficulty":"Muy alta","text":"Un equipo tiene tres necesidades que resolver en AWS: (1) el equipo SOC requiere un panel de hallazgos procedentes de múltiples servicios de seguridad; (2) Durante un nuevo proyecto, un auditor debe investigar qué identidad eliminó un recurso desde la consola o API; (3) un responsable de operaciones busca una alarma cuando la CPU de una instancia supera un umbral. ¿Qué TRES alternativas debería seleccionar? (Seleccione TRES respuestas).","options":[{"l":"A","t":"AWS Health Dashboard","why":"Incorrecta. AWS Health Dashboard muestra eventos de salud de servicios y eventos que pueden afectar recursos de la cuenta. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"B","t":"Amazon CloudWatch","why":"Correcta. Se aplica a la situación 3: recopila métricas registros y alarmas para observar aplicaciones y recursos."},{"l":"C","t":"AWS CloudTrail","why":"Correcta. Se aplica a la situación 2: registra acciones de API y actividad de cuenta para auditoría de quién hizo qué y cuándo."},{"l":"D","t":"AWS Config","why":"Incorrecta. AWS Config registra configuraciones y evalúa cambios y cumplimiento de reglas de recursos. Es una capacidad distinta de las tres soluciones concretas que exige el escenario."},{"l":"E","t":"AWS Well-Architected Tool","why":"Incorrecta. AWS Well-Architected Tool: permite revisar cargas con preguntas y riesgos asociados a pilares de arquitectura. Ninguna de las tres situaciones exige prioritariamente esta función."},{"l":"F","t":"AWS Security Hub","why":"Correcta. Se aplica a la situación 1: centraliza y prioriza hallazgos de seguridad de servicios integrados y estándares."}],"key":["B","C","F"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0121","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Una empresa está decidiendo cómo resolver dos necesidades: (1) Durante un nuevo proyecto, un auditor solicita evitar lectura de tráfico capturado entre un navegador y su API; (2) un responsable de seguridad busca revisar recomendaciones y novedades publicadas por expertos AWS. ¿Qué par de opciones, EN ESE ORDEN, ofrece la mejor correspondencia?","options":[{"l":"A","t":"AWS Marketplace de seguridad + Amazon Macie","why":"Incorrecta. NO cumple el requisito 1: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. NO cumple el requisito 2: detecta y ayuda a clasificar datos confidenciales en Amazon S3."},{"l":"B","t":"Cifrado en tránsito + AWS Security Blog","why":"Correcta. cumple el requisito 1: protege datos mientras viajan por conexiones como TLS o VPN. cumple el requisito 2: publica novedades y prácticas de seguridad de AWS en artículos técnicos."},{"l":"C","t":"Cifrado en tránsito + Amazon Macie","why":"Incorrecta. cumple el requisito 1: protege datos mientras viajan por conexiones como TLS o VPN. NO cumple el requisito 2: detecta y ayuda a clasificar datos confidenciales en Amazon S3."},{"l":"D","t":"AWS Marketplace de seguridad + AWS Security Blog","why":"Incorrecta. NO cumple el requisito 1: ofrece productos de terceros que pueden adquirirse y desplegarse según sus condiciones. cumple el requisito 2: publica novedades y prácticas de seguridad de AWS en artículos técnicos."}],"key":["B"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0122","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) un grupo de trabajo sustituye su monolito por componentes desacoplados y servicios gestionados; (2) un sistema informático regulado permanece local hasta renegociar sus contratos y requisitos legales. ¿Qué combinación es la MÁS apropiada en ese orden?","options":[{"l":"A","t":"Refactoring (refactor) + Retaining (retain)","why":"Correcta. cumple el requisito 1: rediseña significativamente la aplicación para aprovechar capacidades nativas de nube. cumple el requisito 2: conserva temporalmente una carga de trabajo en el entorno actual."},{"l":"B","t":"Migration Evaluator + Retiring (retire)","why":"Incorrecta. NO cumple el requisito 1: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura. NO cumple el requisito 2: elimina aplicaciones que ya no generan valor o no son necesarias."},{"l":"C","t":"Refactoring (refactor) + Retiring (retire)","why":"Incorrecta. cumple el requisito 1: rediseña significativamente la aplicación para aprovechar capacidades nativas de nube. NO cumple el requisito 2: elimina aplicaciones que ya no generan valor o no son necesarias."},{"l":"D","t":"Migration Evaluator + Retaining (retain)","why":"Incorrecta. NO cumple el requisito 1: ayuda a construir un caso de negocio basado en información de uso y costos de infraestructura. cumple el requisito 2: conserva temporalmente una carga de trabajo en el entorno actual."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0123","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Una organización tiene dos necesidades en un proyecto de AWS: (1) un responsable de administración busca encontrar CVE relevantes para imágenes de contenedor y cargas compatibles; (2) un SOC requiere detectar comunicaciones sospechosas y posibles credenciales comprometidas. ¿Qué DOS opciones satisfacen estos requisitos? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Amazon GuardDuty","why":"Correcta. Amazon GuardDuty responde a la necesidad 2: detecta amenazas y comportamientos anómalos mediante análisis de señales de seguridad."},{"l":"B","t":"Registros VPC Flow Logs","why":"Incorrecta. Registros VPC Flow Logs: capturan metadatos sobre tráfico IP hacia y desde interfaces de red en VPC. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"AWS Security Blog","why":"Incorrecta. AWS Security Blog publica novedades y prácticas de seguridad de AWS en artículos técnicos. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"D","t":"Amazon Inspector","why":"Correcta. Amazon Inspector responde a la necesidad 1: identifica vulnerabilidades de software y exposición en cargas de trabajo compatibles."},{"l":"E","t":"AWS Shield","why":"Incorrecta. AWS Shield: protege contra ataques de denegación de servicio distribuido DDoS. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."}],"key":["A","D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0124","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Muy alta","text":"Un equipo debe elegir dos capacidades de AWS para los siguientes casos: (1) un corporativo requiere acompañamiento de especialistas para un programa amplio de migración; (2) una entidad global requiere la modalidad más especializada para operar cargas de misión crítica. ¿Qué DOS opciones corresponden a estas necesidades? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS Professional Services","why":"Correcta. AWS Professional Services responde a la necesidad 1: aporta consultoría y expertos para proyectos de adopción transformación y arquitectura AWS."},{"l":"B","t":"AWS Marketplace","why":"Incorrecta. AWS Marketplace: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"C","t":"AWS Basic Support","why":"Incorrecta. AWS Basic Support: proporciona asistencia básica para cuentas facturación y recursos de autoayuda sin el soporte técnico de pago. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"AWS Enterprise Support","why":"Incorrecta. AWS Enterprise Support plan prémium para cargas críticas de negocio con orientación experta y capacidades empresariales. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"AWS Unified Operations","why":"Correcta. AWS Unified Operations responde a la necesidad 2: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones."}],"key":["A","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0125","domain":4,"objective":"4.3","topic":"Soporte","difficulty":"Alta","text":"En un proyecto que utilizará AWS, una empresa con cargas de producción necesita un nivel inicial de soporte técnico pagado para operación. ¿Cuál de las siguientes alternativas es la adecuada?","options":[{"l":"A","t":"AWS Business Support+","why":"Correcta. AWS Business Support+: plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada. El requisito específico del escenario coincide con esta función."},{"l":"B","t":"AWS Unified Operations","why":"Incorrecta. AWS Unified Operations: plan superior para operaciones de misión crítica con experiencia especializada en resiliencia de aplicaciones. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada."},{"l":"C","t":"AWS Prescriptive Guidance","why":"Incorrecta. AWS Prescriptive Guidance: publica estrategias patrones y guías para migración modernización y operación. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada."},{"l":"D","t":"AWS Marketplace","why":"Incorrecta. AWS Marketplace: es un catálogo para descubrir adquirir y desplegar software y servicios de terceros. Aunque está relacionada con soporte, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: plan de soporte de pago orientado a cargas de producción con asistencia técnica mejorada."}],"key":["A"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain4.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0126","domain":1,"objective":"1.1","topic":"Beneficios","difficulty":"Alta","text":"Un cliente plantea esta situación: una tienda necesita agregar recursos en picos de minutos y retirarlos al terminar la promoción. ¿Cuál de las siguientes opciones es la MÁS adecuada?","options":[{"l":"A","t":"Economías de escala","why":"Incorrecta. Economías de escala: reducen costos unitarios gracias al volumen agregado de demanda del proveedor. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta automáticamente la capacidad en función de cambios de demanda y puede reducirla cuando baja."},{"l":"B","t":"Escalabilidad vertical","why":"Incorrecta. Escalabilidad vertical: aumenta recursos de un único servidor como memoria o CPU. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta automáticamente la capacidad en función de cambios de demanda y puede reducirla cuando baja."},{"l":"C","t":"Gasto operativo variable","why":"Incorrecta. Gasto operativo variable: desplaza inversiones en hardware hacia gastos asociados al uso. Aunque está relacionada con beneficios, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: ajusta automáticamente la capacidad en función de cambios de demanda y puede reducirla cuando baja."},{"l":"D","t":"Elasticidad","why":"Correcta. Elasticidad: ajusta automáticamente la capacidad en función de cambios de demanda y puede reducirla cuando baja. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0127","domain":3,"objective":"3.1","topic":"Despliegue","difficulty":"Alta","text":"Durante la planificación de una carga de trabajo en AWS, un hospital debe mantener parte del sistema en su centro de datos mientras aprovecha AWS. ¿Qué opción corresponde a ese requisito?","options":[{"l":"A","t":"Ubicación perimetral (edge location)","why":"Incorrecta. Ubicación perimetral (edge location): punto de presencia cercano a usuarios para entrega de contenido y ciertos servicios periféricos. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: combina infraestructura local y recursos de nube conectados."},{"l":"B","t":"AWS CloudFormation","why":"Incorrecta. AWS CloudFormation: define y aprovisiona infraestructura mediante plantillas declarativas reutilizables. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: combina infraestructura local y recursos de nube conectados."},{"l":"C","t":"Modelo híbrido de nube","why":"Correcta. Modelo híbrido de nube: combina infraestructura local y recursos de nube conectados. El requisito específico del escenario coincide con esta función."},{"l":"D","t":"Región AWS","why":"Incorrecta. Región AWS: área geográfica con múltiples zonas de disponibilidad separadas. Aunque está relacionada con despliegue, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: combina infraestructura local y recursos de nube conectados."}],"key":["C"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0128","domain":1,"objective":"1.3","topic":"Migración","difficulty":"Alta","text":"Al seleccionar capacidades de AWS, se presenta este requisito: una auditoría identifica aplicaciones antiguas sin usuarios que no deben migrarse. ¿Qué opción lo satisface MEJOR?","options":[{"l":"A","t":"Rehosting (rehost)","why":"Incorrecta. Rehosting (rehost): traslada aplicaciones a infraestructura en la nube con cambios mínimos lift and shift. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: elimina aplicaciones que ya no generan valor o no son necesarias."},{"l":"B","t":"Repurchasing (repurchase)","why":"Incorrecta. Repurchasing (repurchase): reemplaza una solución existente por otro producto generalmente SaaS. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: elimina aplicaciones que ya no generan valor o no son necesarias."},{"l":"C","t":"AWS Migration Hub","why":"Incorrecta. AWS Migration Hub: ofrece visibilidad y seguimiento del avance de migraciones mediante herramientas compatibles. Aunque está relacionada con migración, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: elimina aplicaciones que ya no generan valor o no son necesarias."},{"l":"D","t":"Retiring (retire)","why":"Correcta. Retiring (retire): elimina aplicaciones que ya no generan valor o no son necesarias. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain1.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0129","domain":3,"objective":"3.8","topic":"Integración","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) una empresa comercial busca activar flujos al recibir eventos de servicios SaaS y AWS; (2) un grupo de trabajo frontend busca simplificar hosting y backend para su aplicación web. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"AWS CodePipeline","why":"Incorrecta. AWS CodePipeline: coordina fases automatizadas de entrega continua desde origen hasta despliegue. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"B","t":"Amazon EventBridge","why":"Correcta. Amazon EventBridge responde a la necesidad 1: enruta eventos desde distintas fuentes a destinos mediante reglas."},{"l":"C","t":"Amazon WorkSpaces","why":"Incorrecta. Amazon WorkSpaces: proporciona escritorios virtuales persistentes administrados para usuarios. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"AWS X-Ray","why":"Incorrecta. AWS X-Ray ayuda a rastrear solicitudes distribuidas entre componentes de aplicaciones. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"E","t":"AWS Amplify","why":"Correcta. AWS Amplify responde a la necesidad 2: ayuda a crear y desplegar aplicaciones web y móviles full stack con integración de servicios."}],"key":["B","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0130","domain":3,"objective":"3.4","topic":"Base de datos","difficulty":"Alta","text":"Una empresa está evaluando AWS: una aplicación necesita milisegundos de latencia para millones de elementos sin gestionar servidores. ¿Qué opción debería elegir?","options":[{"l":"A","t":"Amazon Neptune","why":"Incorrecta. Amazon Neptune: proporciona una base de datos de grafos administrada para relaciones conectadas. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable."},{"l":"B","t":"AWS DMS","why":"Incorrecta. AWS DMS: migra o replica datos de bases con cambios mínimos y admite migraciones heterogéneas. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable."},{"l":"C","t":"Amazon DocumentDB","why":"Incorrecta. Amazon DocumentDB: proporciona una base de documentos administrada compatible con APIs de MongoDB. Aunque está relacionada con base de datos, no atiende de forma tan precisa la necesidad; la capacidad solicitada es: proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable."},{"l":"D","t":"Amazon DynamoDB","why":"Correcta. Amazon DynamoDB: proporciona una base de datos NoSQL de clave-valor y documentos administrada y escalable. El requisito específico del escenario coincide con esta función."}],"key":["D"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain3.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0131","domain":2,"objective":"2.3","topic":"IAM","difficulty":"Muy alta","text":"Una empresa evalúa dos funciones distintas en AWS: (1) un grupo de trabajo busca modificar una política reutilizable y que el cambio afecte a múltiples roles; (2) Durante un nuevo proyecto, una función solo debe leer dos prefijos de S3 y ningún otro dato. ¿Qué DOS alternativas son las MÁS adecuadas? (Seleccione DOS respuestas).","options":[{"l":"A","t":"Gestión de permisos con políticas administradas","why":"Correcta. Gestión de permisos con políticas administradas responde a la necesidad 1: reutiliza políticas IAM que pueden vincularse a varias identidades."},{"l":"B","t":"Límite de permisos IAM","why":"Incorrecta. Límite de permisos IAM restringe permisos máximos que puede conceder una política basada en identidad a un usuario o rol. Aunque pertenece al mismo ámbito, no es una de las dos alternativas más específicas para los requisitos planteados."},{"l":"C","t":"Política basada en identidad IAM","why":"Incorrecta. Política basada en identidad IAM: se adjunta a un usuario grupo o rol y define acciones y recursos autorizados o denegados. No resuelve la necesidad 1 ni la 2 con la correspondencia solicitada."},{"l":"D","t":"Usuario raíz (root)","why":"Incorrecta. Usuario raíz (root): es la identidad inicial de la cuenta con privilegios especiales que debe protegerse y evitarse en tareas diarias. No sustituye las capacidades específicas requeridas para los dos casos."},{"l":"E","t":"Principio de privilegio mínimo","why":"Correcta. Principio de privilegio mínimo responde a la necesidad 2: concede únicamente permisos indispensables para realizar la tarea autorizada."}],"key":["A","E"],"sources":["https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/cloud-practitioner-02-domain2.html","https://docs.aws.amazon.com/aws-certification/latest/cloud-practitioner-02/clf-02-in-scope-services.html"]},{"id":"CLF02-0132","domain":2,"objective":"2.4","topic":"Amenazas","difficulty":"Muy alta","text":"Un equipo de TI estudia dos casos de uso para AWS: (1) una compañía debe localizar números de identificación personal almacenados por error en buckets S3; (2) Durante un nuevo proyecto, un
